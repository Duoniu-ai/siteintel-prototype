<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteIntel 2.0 — 互联网数据智能平台</title><style>:root{--bg:#f5f7fa;--card:#fff;--text:#172033;--muted:#667085;--line:#e2e7ef;--blue:#2457ff;--cyan:#08a9c7;--nav:#0d1728;--nav2:#13223a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:18px;position:sticky;top:0;z-index:20}.logo{font-size:22px;font-weight:900;white-space:nowrap}.logo i{color:var(--blue);font-style:normal}.global{height:40px;flex:1;max-width:680px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;padding:0 14px;color:var(--muted);text-align:left}.toplink{border:0;background:none;color:#344054}.lang{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff}.layout{display:grid;grid-template-columns:238px 1fr;min-height:calc(100vh - 68px)}aside{background:var(--nav);padding:18px 12px;color:#b6c3d5;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.nt{font-size:10px;color:#71829a;letter-spacing:1.4px;padding:16px 10px 6px}.nav{width:100%;text-align:left;color:#b6c3d5;border:0;background:none;padding:10px 12px;border-radius:7px;margin:1px 0}.nav:hover,.nav.on{background:var(--nav2);color:#fff;box-shadow:inset 3px 0 var(--cyan)}main{min-width:0}.wrap{max-width:1320px;margin:auto;padding:28px 30px 70px}.crumb{font-size:11px;color:#8b96a7;letter-spacing:.8px}.hero{background:linear-gradient(115deg,#fff,#f2f5ff);border:1px solid var(--line);border-radius:14px;padding:32px;margin:10px 0 18px}.hero h1{font-size:36px;line-height:1.2;margin:8px 0}.hero h1 span{color:var(--blue)}.hero p{color:var(--muted);max-width:900px;font-size:15px}.analyze{display:flex;max-width:780px;height:46px}.analyze input{flex:1;border:1px solid #cbd4e2;border-right:0;border-radius:8px 0 0 8px;padding:0 14px}.analyze button{border:0;background:var(--blue);color:#fff;padding:0 24px;border-radius:0 8px 8px 0;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.metric{font-size:28px;font-weight:900}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.section{margin:22px 0 10px}.section h2{margin:0;font-size:20px}.section p{margin:3px 0;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #edf0f4}.row:last-child{border:0}.link{color:var(--blue);font-weight:700;border:0;background:none;padding:0}.tag{font-size:11px;padding:3px 8px;border-radius:99px;background:#eef3ff;color:#536178}.feature{min-height:130px;cursor:pointer;transition:.15s}.feature:hover{box-shadow:0 8px 24px #1c2a4612;transform:translateY(-1px)}.icon{width:34px;height:34px;border-radius:9px;background:#eef3ff;color:var(--blue);display:grid;place-items:center;font-weight:900;margin-bottom:9px}.tabs{display:flex;border-bottom:1px solid var(--line);margin:18px 0;overflow:auto}.tab{border:0;background:none;padding:10px 15px;color:var(--muted);white-space:nowrap}.tab.on{color:var(--blue);font-weight:800;border-bottom:2px solid var(--blue)}.dark{background:linear-gradient(145deg,#0c1728,#142944);color:#eef6ff;border-color:#1c3a5c}.dark .muted{color:#9fb1c8}.dark .link{color:#54e4f4}.graph{height:350px;position:relative;overflow:hidden;border:1px solid #254b6d;border-radius:11px;background:radial-gradient(circle,#173451,#07111e 70%)}.graph:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:32px 32px}.node{position:absolute;transform:translate(-50%,-50%);z-index:2;padding:9px 12px;border:1px solid #35618b;border-radius:8px;background:#0b1829;color:#c7d9ed}.node b{color:#54e4f4}.drawer{display:none;position:fixed;inset:0;background:#0007;z-index:50}.drawer.open{display:block}.di{position:absolute;right:0;top:0;width:min(600px,92vw);height:100%;background:#fff;padding:26px;overflow:auto}.close{float:right;border:0;background:none;font-size:28px}.footer{text-align:center;color:var(--muted);border-top:1px solid var(--line);padding:24px;margin-top:30px}@media(max-width:1100px){.layout{grid-template-columns:210px}.wrap{padding-left:20px;padding-right:20px}.cards,.g4{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="logo">Site<i>Intel</i></div><button class="global" onclick="openSearch()">⌕　搜索网站、Domain、IP、ASN、Technology…　⌘ K</button><button class="toplink" onclick="go('api')">API</button><button class="toplink" onclick="go('evidence')">证据</button><button class="lang" onclick="toggleLang()" id="langBtn">EN</button></header><div class="layout"><aside id="side"></aside><main id="main"></main></div><div class="drawer" id="drawer"><div class="di"><button class="close" onclick="closeDrawer()">×</button><div id="drawerBody"></div></div></div><script>(function(){'use strict';const nav=[['INTELLIGENCE','home','总览'],['','websites','Website Intelligence'],['','seo','SEO Intelligence'],['','search','Search / SERP'],['','content','Content Intelligence'],['','technology','Technology Intelligence'],['INFRASTRUCTURE','infra','Infrastructure'],['','ip','IP'],['','asn','ASN / Network'],['','dns','DNS / Nameserver'],['','security','Security'],['','performance','Performance'],['RELATIONSHIPS','relations','Relationship Intelligence'],['','redirect','Redirect Intelligence'],['','history','Historical Intelligence'],['','evidence','Evidence Chain'],['SYSTEM','monitor','监控中心'],['','compare','对比分析'],['','explore','数据探索'],['','api','API']];let route=location.hash.slice(1)||'home';const $=id=>document.getElementById(id);function navs(){$('side').innerHTML=nav.map(n=>n[0]?`<div class="nt">${n[0]}</div><button class="nav ${route===n[1]?'on':''}" onclick="window.SiteIntel.go('${n[1]}')">${n[2]}</button>`:`<button class="nav ${route===n[1]?'on':''}" onclick="window.SiteIntel.go('${n[1]}')">${n[2]}</button>`).join('')}function go(x){route=x;location.hash=x;render();window.scrollTo(0,0)}function openDrawer(html){$('drawerBody').innerHTML=html;$('drawer').classList.add('open')}function closeDrawer(){$('drawer').classList.remove('open')}function openSearch(){openDrawer(`<div class="crumb">GLOBAL SEARCH</div><h1>探索互联网实体</h1><p class="muted">支持 Website、Domain、URL、IP、ASN、Technology。</p><div class="panel"><input id="searchInput" style="width:100%;height:46px;border:1px solid #e2e7ef;border-radius:8px;padding:0 12px" placeholder="example.com / 104.18.32.10 / AS13335" onkeydown="if(event.key==='Enter')window.SiteIntel.results()"><br><br><button class="nav" style="background:#2457ff;color:#fff;width:auto" onclick="window.SiteIntel.results()">搜索</button></div><div id="searchResults"></div>`);setTimeout(()=>{const q=$('searchInput');if(q)q.focus()},0)}function results(){const q=($('searchInput')?.value||'example.com').trim();$('searchResults').innerHTML=`<div class="panel"><h2>搜索结果</h2>${[['Website',q,'websites'],['IP','104.18.32.10','ip'],['ASN','AS13335','asn'],['Technology','Cloudflare','technology']].map(x=>`<div class="row"><span><span class="tag">${x[0]}</span>　<b>${x[1]}</b></span><button class="link" onclick="window.SiteIntel.closeDrawer();window.SiteIntel.go('${x[2]}')">探索 →</button></div>`).join('')}</div>`}function entity(type,name){openDrawer(`<div class="crumb">ENTITY / ${type.toUpperCase()}</div><h1>${name}</h1><p class="muted">${type} 实体，可继续向关联关系、证据与历史延伸。</p><div class="panel"><h2>Core Facts</h2>${[['状态','Observed'],['首次观察','2025-11-03'],['最近观察','2026-08-20'],['Evidence','24'],['Confidence','High']].map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="panel"><h2>Related Entities</h2>${[['Website','example.com','websites'],['IP','104.18.32.10','ip'],['ASN','AS13335','asn'],['DNS','a.gtld-servers.net','dns'],['Technology','Cloudflare','technology']].map(x=>`<div class="row"><span>${x[0]}</span><button class="link" onclick="window.SiteIntel.closeDrawer();window.SiteIntel.go('${x[2]}')">${x[1]} ↗</button></div>`).join('')}</div>`)}function base(title,sub){return `<div class="wrap"><div class="crumb">SITEINTEL / INTELLIGENCE</div><div class="section"><h2>${title}</h2><p>${sub}</p></div>`}function footer(){$('main').innerHTML+=`<div class="footer">SiteIntel 2.0 · Website Data Intelligence Platform</div></div>`}function home(){$('main').innerHTML=base('互联网数据智能平台','从一个网站，看到完整的情报。')+`<section class="hero"><div class="crumb">UNDERSTAND ANY WEBSITE</div><h1>理解一个网站，<span>看见它背后的整个网络。</span></h1><p>SiteIntel 把网站、SEO、内容、技术、IP、DNS、ASN、安全、性能、关系、证据与历史组织成统一的数据智能。</p><div class="analyze"><input id="homeDomain" placeholder="输入域名，例如 example.com"><button onclick="window.SiteIntel.go('websites')">开始分析</button></div></section><div class="cards"><div class="card"><div class="muted">分析网站</div><div class="metric">12.8M</div></div><div class="card"><div class="muted">技术指纹</div><div class="metric">42.7K</div></div><div class="card"><div class="muted">关联实体</div><div class="metric">86.4M</div></div><div class="card"><div class="muted">证据记录</div><div class="metric">31.6M</div></div></div><div class="section"><h2>核心能力</h2></div><div class="grid g4">${[['S','SEO Intelligence','索引、SERP、Keywords、Sitemap、Robots。','seo'],['C','Content Intelligence','页面、主题、结构、语言与内容机会。','content'],['T','Technology Intelligence','CMS、Framework、Analytics、CDN。','technology'],['R','Relationship Intelligence','Website → IP → ASN → Organization → Technology。','relations']].map(x=>`<div class="card feature" onclick="window.SiteIntel.go('${x[3]}')"><div class="icon">${x[0]}</div><b>${x[1]}</b><p class="muted">${x[2]}</p></div>`).join('')}</div><div class="grid g3" style="margin-top:14px"><div class="card feature" onclick="window.SiteIntel.go('infra')"><b>Infrastructure</b><p class="muted">IP / DNS / ASN / Hosting / TLS</p></div><div class="card feature" onclick="window.SiteIntel.go('security')"><b>Security</b><p class="muted">TLS / Headers / Cookies / Signals</p></div><div class="card feature" onclick="window.SiteIntel.go('performance')"><b>Performance</b><p class="muted">Core Web Vitals / TTFB / Resources</p></div></div><div class="section"><h2>热门查询</h2></div><div class="panel">${[['github.com','Website','websites'],['taobao.com','Website','websites'],['cloudflare.com','Website','websites'],['104.18.32.10','IP','ip']].map(x=>`<div class="row"><span><b>${x[0]}</b> <span class="tag">${x[1]}</span></span><button class="link" onclick="window.SiteIntel.go('${x[2]}')">查看 →</button></div>`).join('')}</div>`;footer()}function websites(){$('main').innerHTML=base('example.com','Website Intelligence · 网站是整个分析体系的中心')+`<div class="hero"><div class="crumb">WEBSITE</div><h1>example.com</h1><p>HTTPS · 200 OK · Last observed 2026-08-20</p></div><div class="tabs"><button class="tab on">概览</button><button class="tab" onclick="window.SiteIntel.go('seo')">SEO</button><button class="tab" onclick="window.SiteIntel.go('technology')">技术</button><button class="tab" onclick="window.SiteIntel.go('infra')">基础设施</button><button class="tab" onclick="window.SiteIntel.go('relations')">关系</button><button class="tab" onclick="window.SiteIntel.go('history')">历史</button><button class="tab" onclick="window.SiteIntel.go('evidence')">证据</button></div><div class="cards">${[['SEO','82'],['Technology','18'],['Security','94'],['Performance','88']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="grid g2" style="margin-top:14px"><div class="panel"><h2>Core Intelligence</h2>${[['SEO','SEO Score 82','seo'],['Content','146 indexed pages','content'],['Technology','18 technologies','technology'],['Infrastructure','104.18.32.10 / AS13335','infra'],['Security','TLS valid','security'],['Performance','LCP 1.8s','performance']].map(x=>`<div class="row"><span><b>${x[0]}</b><br><span class="muted">${x[1]}</span></span><button class="link" onclick="window.SiteIntel.go('${x[2]}')">Explore →</button></div>`).join('')}</div><div class="panel dark"><h2>Live Relationship</h2><p class="muted">Website → IP → ASN → Organization</p><div class="graph"><button class="node" style="left:50%;top:50%" onclick="window.SiteIntel.entity('Website','example.com')"><b>example.com</b></button><button class="node" style="left:22%;top:25%" onclick="window.SiteIntel.entity('IP','104.18.32.10')">104.18.32.10</button><button class="node" style="left:78%;top:25%" onclick="window.SiteIntel.entity('ASN','AS13335')">AS13335</button><button class="node" style="left:50%;top:82%" onclick="window.SiteIntel.entity('Technology','Cloudflare')">Cloudflare</button></div></div></div>`;footer()}const simple={seo:['SEO Intelligence','搜索表现、索引、关键词、Sitemap 与 Robots。'],search:['Search / SERP','Baidu、Bing、Google 搜索数据能力入口。'],content:['Content Intelligence','页面、主题、语言、结构与内容机会。'],technology:['Technology Intelligence','CMS、Framework、Analytics、CDN 与技术历史。'],infra:['Infrastructure','IP、DNS、ASN、Hosting、TLS 与基础设施。'],ip:['IP Intelligence','IP 地址、托管网站、历史与关联实体。'],asn:['ASN / Network','ASN、前缀、网络组织与托管关系。'],dns:['DNS / Nameserver','DNS 记录、Nameserver 与历史变化。'],security:['Security Intelligence','TLS、Headers、Cookies 与安全信号。'],performance:['Performance Intelligence','TTFB、Core Web Vitals 与资源表现。'],relations:['Relationship Intelligence','实体之间的关系、证据、置信度与时间有效性。'],redirect:['Redirect Intelligence','重定向来源、目标、链路、状态与最终网站。'],history:['Historical Intelligence','网站、技术、IP、DNS 与关系的历史变化。'],evidence:['Evidence Chain','所有事实与洞察的证据来源与可追溯链。'],monitor:['监控中心','监控网站、变化事件与告警。'],compare:['对比分析','比较两个网站的技术、基础设施、安全与关系。'],explore:['数据探索','浏览热门 Website、IP、ASN 与 Technology 实体。'],api:['API','Website、IP、ASN、Search 等接口能力与示例。']};function simplePage(key){const [title,sub]=simple[key];$('main').innerHTML=base(title,sub)+`<div class="hero"><div class="crumb">SITEINTEL / ${key.toUpperCase()}</div><h1>${title}</h1><p>${sub}</p></div><div class="grid g3"><div class="panel"><h3>Observed Facts</h3><div class="metric">1,284</div><p class="muted">当前可验证事实</p></div><div class="panel"><h3>Evidence</h3><div class="metric">426</div><p class="muted">支持证据</p></div><div class="panel"><h3>Confidence</h3><div class="metric">92%</div><p class="muted">高置信结果占比</p></div></div><div class="section"><h2>数据与能力</h2></div><div class="panel">${[['example.com','Observed','High'],['104.18.32.10','Observed','High'],['AS13335','Observed','High'],['Cloudflare','Detected','Medium']].map(x=>`<div class="row"><span><b>${x[0]}</b><br><span class="muted">${x[1]}</span></span><span class="tag">${x[2]}</span></div>`).join('')}</div>`;footer()}function render(){navs();if(route==='home')home();else if(route==='websites')websites();else if(simple[route])simplePage(route);else home()}function toggleLang(){const b=$('langBtn');b.textContent=b.textContent==='EN'?'中':'EN'}window.SiteIntel={go,openSearch,results,closeDrawer,entity,toggleLang};window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||'home';render()});document.addEventListener('DOMContentLoaded',render);render()})();</script></body></html>
