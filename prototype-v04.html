<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteIntel 2.0 — Website Intelligence</title><style>:root{--bg:#f6f8fb;--surface:#fff;--ink:#101827;--muted:#64748b;--line:#dce3ec;--accent:#2457ff;--cyan:#00a9c8;--dark:#07101d;--dark2:#0b1728}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg)}button,input{font:inherit}button{cursor:pointer}.top{height:68px;background:#ffffffed;backdrop-filter:blur(15px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:28px;position:sticky;top:0;z-index:30}.logo{font-size:21px;font-weight:900}.logo i{font-style:normal;color:var(--accent)}.search{height:40px;flex:1;max-width:680px;border:1px solid var(--line);border-radius:9px;background:#f8fafc;padding:0 15px;color:var(--muted);text-align:left}.top a{color:var(--muted)}.layout{display:grid;grid-template-columns:235px minmax(0,1fr)}aside{background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:20px 12px;position:sticky;top:68px}.section{font-size:10px;color:#94a3b8;letter-spacing:1.5px;padding:18px 10px 6px}.nav{width:100%;border:0;background:none;text-align:left;color:#53657d;padding:10px 12px;border-radius:7px}.nav:hover,.nav.on{background:#edf3ff;color:var(--accent);font-weight:700}main{min-width:0}.wrap{max-width:1450px;margin:auto;padding:34px 42px 80px}.crumb{font-size:12px;color:var(--muted)}h1{font-size:38px;line-height:1.15;margin:10px 0}h2{font-size:21px;margin:0 0 14px}.sub{color:var(--muted);max-width:820px}.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px;margin-bottom:18px}.hero h1 span{color:var(--accent)}.heroSearch{display:flex;gap:8px;margin-top:25px;max-width:850px}.heroSearch input{height:48px;flex:1;border:1px solid var(--line);border-radius:9px;padding:0 14px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;color:var(--ink)}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px}.card b{font-size:25px;display:block}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid #edf1f5;padding:12px 0}.row:last-child{border-bottom:0}.link{border:0;background:none;color:var(--accent);font-weight:700;padding:0}.tag{font-size:11px;border:1px solid #d8e1ef;border-radius:99px;padding:2px 8px;color:#58708f}.score{font-size:40px;font-weight:800;color:var(--accent)}.dark{background:linear-gradient(145deg,var(--dark),var(--dark2));color:#eaf4ff;border:1px solid #18304e}.dark .muted{color:#91a6c4}.dark .row{border-color:#17304b}.dark .link{color:#49ddf4}.graph{height:400px;border-radius:11px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 50%,#102742,#07101d 68%);border:1px solid #1b3656}.graph:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff08 1px,transparent 1px),linear-gradient(90deg,#fff08 1px,transparent 1px);background-size:32px 32px}.node{position:absolute;transform:translate(-50%,-50%);padding:9px 12px;border:1px solid #31547c;border-radius:8px;background:#0b1728;color:#b8d6f3;z-index:2}.node strong{color:#49ddf4}.edge{position:absolute;height:1px;background:#43d8ef66;transform-origin:left center}.drawer{position:fixed;inset:0;background:#0007;z-index:60;display:none}.drawer.open{display:block}.drawerIn{position:absolute;right:0;top:0;height:100%;width:min(620px,94vw);background:#fff;padding:28px;overflow:auto}.close{float:right;border:0;background:none;font-size:28px;color:#718096}.featureGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.feature{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}.feature b{display:block;margin-bottom:4px}.feature span{color:var(--muted);font-size:12px}.bottom{display:none}@media(max-width:900px){.top{height:58px;padding:0 13px;gap:12px}.top .search{display:none}.layout{display:block}aside{display:none}.wrap{padding:18px 13px 80px}.hero{padding:23px 18px}.hero h1{font-size:30px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.featureGrid{grid-template-columns:1fr 1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:62px;background:#fffef5;border-top:1px solid var(--line);z-index:50}.bottom button{border:0;background:none;color:#718096;font-size:10px}.bottom .on{color:var(--accent);font-weight:700}}</style></head><body><header class="top"><div class="logo">Site<i>Intel</i></div><button class="search" onclick="search()">⌕　搜索网站、Domain、IP、ASN、Technology…</button><a href="#">文档</a><a href="#">登录</a></header><div class="layout"><aside id="side"></aside><main id="main"></main></div><nav class="bottom" id="bottom"></nav><div class="drawer" id="drawer"><div class="drawerIn"><button class="close" onclick="closeD()">×</button><div id="db"></div></div></div><script>let route=location.hash.slice(1)||'home';const nav=[['INTELLIGENCE','home','总览'],['','websites','Website Intelligence'],['','seo','SEO Intelligence'],['','search','Search / SERP'],['','content','Content Intelligence'],['','technology','Technology'],['INFRASTRUCTURE','infra','Infrastructure'],['','ip','IP'],['','asn','ASN / Network'],['','dns','DNS / Nameserver'],['','security','Security'],['','performance','Performance'],['RELATIONSHIPS','relations','Relationship Intelligence'],['','redirect','Redirect Intelligence'],['','history','Historical Intelligence'],['','evidence','Evidence Chain']];function navs(){side.innerHTML=nav.map(n=>n[0]?`<div class=section>${n[0]}</div><button class="nav ${route===n[1]?'on':''}" onclick="go('${n[1]}')">${n[2]}</button>`:`<button class="nav ${route===n[1]?'on':''}" onclick="go('${n[1]}')">${n[2]}</button>`).join('');bottom.innerHTML=[['home','首页'],['websites','网站'],['seo','SEO'],['relations','关系'],['evidence','证据']].map(n=>`<button class="${route===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}function go(x){route=x;location.hash=x;render()}function search(){openD(`<div class=crumb>GLOBAL SEARCH</div><h1>探索任何网站</h1><p class=muted>输入 Website、Domain、URL、IP、ASN 或 Technology，进入对应的 Intelligence 页面。</p><div class=panel><input id=q placeholder="example.com / 104.18.32.10 / AS13335" style="width:100%;height:46px;border:1px solid var(--line);border-radius:8px;padding:0 12px"><br><br><button class="btn primary" onclick="go('websites');closeD()">开始分析 →</button></div>`)}function openD(x){db.innerHTML=x;drawer.classList.add('open')}function closeD(){drawer.classList.remove('open')}function entity(t,n){openD(`<div class=crumb>ENTITY / ${t.toUpperCase()}</div><h1>${n}</h1><p class=muted>这是一个可继续探索的互联网实体。</p><div class=panel><h2>Core Facts</h2><div class=row><span>状态</span><b style="color:#059669">Observed</b></div><div class=row><span>Last observed</span><b>2026-08-20</b></div><div class=row><span>Evidence</span><b>24</b></div></div><div class=panel><h2>Related Entities</h2>${[['Website','example.com'],['IP','104.18.32.10'],['ASN','AS13335'],['Nameserver','a.gtld-servers.net'],['Technology','Cloudflare'],['Organization','Cloudflare, Inc.']].map(a=>`<div class=row><span class=muted>${a[0]}</span><button class=link onclick="entity('${a[0]}','${a[1]}')">${a[1]} ↗</button></div>`).join('')}</div>`)}function home(){main.innerHTML=`<div class=wrap><div class=crumb>HOME / WEBSITE INTELLIGENCE</div><section class=hero><div class=crumb>UNDERSTAND ANY WEBSITE</div><h1>理解一个网站，<span>看见它背后的整个网络。</span></h1><p class=sub>SiteIntel 分析网站的 SEO、内容、技术、性能、安全、基础设施与互联网关系，并把结果组织成可以继续探索的数据。</p><div class=heroSearch><input placeholder="example.com"><button class="btn primary" onclick="go('websites')">开始分析</button></div></section><div class=cards><div class=card><b>82</b><span class=muted>SEO Score</span></div><div class=card><b>18</b><span class=muted>Technologies</span></div><div class=card><b>2,481</b><span class=muted>Related Entities</span></div><div class=card><b>7</b><span class=muted>Recent Changes</span></div></div><div class=grid><section class=panel><h2>Website Intelligence</h2><div class=featureGrid>${[['SEO Intelligence','Indexability, SERP, Keywords, Sitemap'],['Content Intelligence','Pages, Topics, Structure, Opportunities'],['Technology Intelligence','CMS, Frameworks, Analytics, CDN'],['Infrastructure Intelligence','IP, DNS, ASN, SSL, Hosting'],['Security Intelligence','TLS, Headers, Cookies, Signals'],['Performance Intelligence','Core Web Vitals, TTFB, Mobile']].map(x=>`<button class=feature onclick="go('${x[0].split(' ')[0].toLowerCase()}')"><b>${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div></section><section class="panel dark"><h2>Relationship Intelligence</h2><p class=muted>Website → IP → ASN → Network → Organization → DNS → Technology → Related Websites</p><button class="btn" onclick="go('relations')">进入关系网络 →</button></section></div></div>`}function websites(){main.innerHTML=`<div class=wrap><div class=crumb>WEBSITE / INTELLIGENCE</div><h1>example.com</h1><p class=muted>Website Intelligence Overview</p><div class=cards><div class=card><b>82</b><span class=muted>SEO</span></div><div class=card><b>18</b><span class=muted>Technology</span></div><div class=card><b>94</b><span class=muted>Security</span></div><div class=card><b>88</b><span class=muted>Performance</span></div></div><div class=grid><section class=panel><h2>Core Intelligence</h2>${[['SEO','SEO Score 82','seo'],['Content','146 indexed pages','content'],['Technology','18 technologies detected','technology'],['Infrastructure','104.18.32.10 / AS13335','infra'],['Security','TLS valid / headers analyzed','security'],['Performance','LCP 1.8s / TTFB 220ms','performance']].map(x=>`<div class=row><span><b>${x[0]}</b><br><span class=muted>${x[1]}</span></span><button class=link onclick="go('${x[2]}')">Explore →</button></div>`).join('')}</section><section class="panel dark"><h2>Live Relationship</h2><p class=muted>当前网站关联 2,481 个实体。</p><button class="btn" onclick="go('relations')">查看关系网络</button></section></div></div>`}function seo(){main.innerHTML=`<div class=wrap><div class=crumb>WEBSITE / SEO INTELLIGENCE</div><h1>SEO Intelligence</h1><p class=muted>从技术 SEO 到搜索可见性，完整查看网站被发现、抓取、理解和排名的条件。</p><div class=cards><div class=card><b>82</b><span class=muted>Overall SEO</span></div><div class=card><b>91%</b><span class=muted>Indexability</span></div><div class=card><b>1,284</b><span class=muted>Indexed URLs</span></div><div class=card><b>326</b><span class=muted>Keywords</span></div></div><div class=grid><section class=panel><h2>Technical SEO</h2>${['Title / Meta Description','H1-H6 Structure','Canonical','Robots.txt','XML Sitemap','Structured Data','Open Graph','Internal Links','Broken Links','Mobile SEO','hreflang'].map(x=>`<div class=row><span>${x}</span><b style="color:#059669">Good</b></div>`).join('')}</section><section class=panel><h2>Search Intelligence</h2><div class=row><span>Baidu</span><button class=link onclick="go('search')">326 keywords →</button></div><div class=row><span>Bing</span><button class=link onclick="go('search')">284 keywords →</button></div><div class=row><span>Google</span><button class=link onclick="go('search')">418 keywords →</button></div></section></div></div>`}function relations(){main.innerHTML=`<div class="wrap"><div class=crumb>WEBSITE / RELATIONSHIP INTELLIGENCE</div><h1>Relationship Intelligence</h1><p class=muted>把 Website、IP、ASN、DNS、Technology、Organization 与 Related Websites 放在同一个可探索空间。</p><section class="panel dark"><div class=graph><div class="node" style="left:50%;top:50%"><strong>example.com</strong></div><div class=node style="left:18%;top:25%">IP · 104.18.32.10</div><div class=node style="left:82%;top:25%">ASN · AS13335</div><div class=node style="left:18%;top:76%">NS · a.gtld-servers.net</div><div class=node style="left:82%;top:76%">ORG · Cloudflare</div><div class=node style="left:50%;top:12%">Technology · Cloudflare</div></div><br><button class="btn" onclick="entity('IP','104.18.32.10')">继续探索 IP →</button></section></div>`}function generic(){let names={search:'Search / SERP Intelligence',content:'Content Intelligence',technology:'Technology Intelligence',infra:'Infrastructure Intelligence',ip:'IP Intelligence',asn:'ASN / Network Intelligence',dns:'DNS / Nameserver Intelligence',security:'Security Intelligence',performance:'Performance Intelligence',redirect:'Redirect Intelligence',history:'Historical Intelligence',evidence:'Evidence Chain'};let title=names[route]||'SiteIntel Intelligence';main.innerHTML=`<div class=wrap><div class=crumb>WEBSITE / ${title.toUpperCase()}</div><h1>${title}</h1><p class=muted>围绕 example.com 的模拟数据。每个实体和指标都可以继续探索。</p><div class=grid><section class=panel><h2>Intelligence Overview</h2>${['Primary signal','Current status','Observed entities','Historical changes','Evidence records'].map((x,i)=>`<div class=row><span>${x}</span><b>${['Detected','Healthy','2,481','7','24'][i]}</b></div>`).join('')}</section><section class=panel><h2>Explore</h2>${[['Website','example.com'],['IP','104.18.32.10'],['ASN','AS13335'],['DNS','a.gtld-servers.net'],['Technology','Cloudflare']].map(x=>`<div class=row><span class=muted>${x[0]}</span><button class=link onclick="entity('${x[0]}','${x[1]}')">${x[1]} ↗</button></div>`).join('')}</section></div></div>`}function render(){navs();route==='home'?home():route==='websites'?websites():route==='seo'?seo():route==='relations'?relations():generic()}render()</script></body></html>
