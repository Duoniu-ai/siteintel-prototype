<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SiteIntel 2.0 — Intelligence Interface</title>
<style>
:root{--bg:#050914;--panel:#0a1020;--panel2:#0d1528;--line:#1b2a45;--text:#e8f1ff;--muted:#7f93b3;--cyan:#42e8ff;--violet:#8c7cff;--green:#57f0a2;--danger:#ff6f91;--glow:0 0 32px #42e8ff18}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(circle at 70% 5%,#17305b33,transparent 35%),radial-gradient(circle at 10% 80%,#6e4bff12,transparent 30%)}.top{height:70px;border-bottom:1px solid var(--line);background:#060b16d9;backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 26px;gap:22px;position:sticky;top:0;z-index:20}.brand{font-weight:900;font-size:21px;letter-spacing:-.7px}.brand i{font-style:normal;color:var(--cyan)}.signal{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.search{flex:1;max-width:720px;height:42px;border:1px solid var(--line);background:#0a1120;border-radius:12px;color:var(--muted);text-align:left;padding:0 15px}.top-actions{margin-left:auto;display:flex;gap:9px}.btn{border:1px solid var(--line);background:#0a1120;color:var(--text);border-radius:9px;padding:8px 13px}.btn:hover{border-color:#35557e}.primary{border-color:#2ccde5;background:#0e7182;color:white;box-shadow:0 0 22px #42e8ff18}.shell{display:grid;grid-template-columns:220px minmax(0,1fr)}aside{border-right:1px solid var(--line);min-height:calc(100vh - 70px);padding:22px 12px;position:sticky;top:70px;height:calc(100vh - 70px)}.nav-title{font-size:10px;color:#526985;letter-spacing:1.5px;text-transform:uppercase;padding:18px 10px 7px}.nav{width:100%;background:none;border:0;color:#8fa4c2;text-align:left;padding:10px 12px;border-radius:8px;margin:2px 0}.nav:hover,.nav.on{background:#10223a;color:var(--cyan);box-shadow:inset 2px 0 var(--cyan)}main{min-width:0}.wrap{max-width:1500px;margin:auto;padding:34px 40px 70px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px;text-transform:uppercase}.hero{min-height:390px;border:1px solid var(--line);border-radius:22px;padding:55px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0b1427e8,#070c18e8),radial-gradient(circle at 75% 50%,#42e8ff20,transparent 35%);box-shadow:var(--glow)}.hero:after{content:"";position:absolute;right:-100px;top:-140px;width:480px;height:480px;border:1px solid #42e8ff2e;border-radius:50%;box-shadow:0 0 80px #42e8ff12}.hero h1{font-size:55px;line-height:1.05;letter-spacing:-2px;max-width:720px;margin:14px 0}.hero p{color:var(--muted);font-size:16px;max-width:690px}.hero-actions{display:flex;gap:10px;margin-top:28px}.orb{position:absolute;right:13%;top:27%;width:160px;height:160px;border:1px solid #42e8ff66;border-radius:50%;box-shadow:0 0 60px #42e8ff18,inset 0 0 40px #42e8ff10}.orb:before,.orb:after{content:"";position:absolute;inset:25px;border:1px solid #8c7cff55;border-radius:50%}.orb:after{inset:67px;background:var(--cyan);box-shadow:0 0 28px var(--cyan)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0;gap:10px}.metric{background:#09101e;border:1px solid var(--line);border-radius:13px;padding:17px}.metric b{display:block;font-size:25px}.metric span{color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:1.45fr .75fr;gap:18px}.panel{background:#09101de8;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.panel h3{margin:0 0 15px;font-size:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #16243a;padding:12px 0}.row:last-child{border:0}.muted{color:var(--muted)}.link{border:0;background:none;color:var(--cyan);padding:0;font-weight:700}.tag{display:inline-flex;border:1px solid #23405f;background:#0b1728;border-radius:999px;padding:3px 8px;color:#9dc1e7;font-size:11px;margin:2px}.graph{height:500px;border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden;background:radial-gradient(circle at center,#0e1d33,#070d18 65%)}.graph:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:36px 36px}.node{position:absolute;transform:translate(-50%,-50%);padding:10px 13px;border:1px solid #27415f;background:#0b1425;color:#b8d7f4;border-radius:10px;box-shadow:0 0 22px #42e8ff0c}.node strong{color:var(--cyan)}.node.main{border-color:#42e8ff88;box-shadow:0 0 30px #42e8ff22;background:#0d2132}.edge{position:absolute;height:1px;background:linear-gradient(90deg,#42e8ff55,#8c7cff55);transform-origin:left center}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow:auto;margin-bottom:18px}.tab{border:0;background:none;color:var(--muted);padding:10px 13px;white-space:nowrap}.tab.on{color:var(--cyan);border-bottom:2px solid var(--cyan)}.timeline .event{display:grid;grid-template-columns:130px 12px 1fr;gap:14px;padding:12px 0}.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);margin-top:7px}.entity-card{border:1px solid var(--line);background:#0b1424;border-radius:12px;padding:15px;transition:.2s}.entity-card:hover{border-color:#42e8ff66;transform:translateY(-1px);box-shadow:0 0 24px #42e8ff10}.drawer{display:none;position:fixed;inset:0;background:#0009;z-index:50}.drawer.open{display:block}.drawer-panel{position:absolute;right:0;top:0;width:min(680px,94vw);height:100%;overflow:auto;background:#080f1c;border-left:1px solid var(--line);padding:28px}.close{float:right;background:none;border:0;color:var(--muted);font-size:28px}.bottom{display:none}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#a8c6e7}.status{color:var(--green)}
@media(max-width:900px){.shell{display:block}aside{display:none}.top{height:58px;padding:0 13px}.top .search{display:none}.wrap{padding:15px 13px 82px}.hero{min-height:460px;padding:30px 22px;border-radius:16px}.hero h1{font-size:37px}.orb{right:-35px;top:45%;opacity:.55}.metrics{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.graph{height:430px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:64px;background:#07101ddd;backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:none;color:#8095b4;font-size:10px}.bottom button.on{color:var(--cyan)}}
</style>
</head>
<body><div class="app"><header class="top"><div class="brand">Site<span>Intel</span></div><span class="signal"></span><button class="search" onclick="search()">⌕　输入 Domain / URL / IP / ASN，开始探索互联网关系…</button><div class="top-actions"><button class="btn" onclick="lang()">EN</button><button class="btn">账户</button></div></header><div class="shell"><aside id="side"></aside><main id="appmain"></main></div><nav class="bottom" id="bottom"></nav></div><div class="drawer" id="drawer"><div class="drawer-panel"><button class="close" onclick="closeDrawer()">×</button><div id="drawerBody"></div></div></div>
<script>
const navs=[['INTELLIGENCE','home','总览'],['','explore','探索'],['','websites','网站'],['ENTITIES','ip','IP 地址'],['','asn','ASN'],['','dns','DNS / Nameserver'],['','technology','技术'],['','organization','组织 / 服务商'],['RELATIONSHIPS','relations','关系网络'],['','history','历史变化'],['','evidence','证据链']];let route=location.hash.slice(1)||'home';function nav(){document.getElementById('side').innerHTML=navs.map(x=>x[0]?`<div class="nav-title">${x[0]}</div><button class="nav ${route===x[1]?'on':''}" onclick="go('${x[1]}')">${x[2]}</button>`:`<button class="nav ${route===x[1]?'on':''}" onclick="go('${x[1]}')">${x[2]}</button>`).join('');document.getElementById('bottom').innerHTML=[['home','⌂'],['explore','⌕'],['relations','◈'],['evidence','◉'],['websites','◫']].map(x=>`<button class="${route===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(r){route=r;location.hash=r;render()}function search(){openDrawer(`<div class="eyebrow">GLOBAL SEARCH</div><h1>探索互联网</h1><p class="muted">输入任何 Domain、URL、IP、ASN 或 Nameserver。</p><div class="panel"><input id="q" placeholder="example.com / 104.18.32.10 / AS13335" style="width:100%;height:46px;background:#0b1424;border:1px solid var(--line);border-radius:9px;color:white;padding:0 13px"><br><br><button class="btn primary" onclick="go('websites');closeDrawer()">开始探索 →</button></div>`)}function lang(){alert('Prototype：语言切换入口已预留')}function openDrawer(x){document.getElementById('drawerBody').innerHTML=x;document.getElementById('drawer').classList.add('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function entity(name,type){openDrawer(`<div class="eyebrow">ENTITY / ${type.toUpperCase()}</div><h1>${name}</h1><p class="muted">这个实体是互联网关系网络中的一个节点。点击关联实体继续向下探索。</p><div class="panel"><h3>Core Signals</h3><div class="row"><span class="muted">状态</span><b class="status">已观测</b></div><div class="row"><span class="muted">最近观测</span><b>2026-08-20 13:42 UTC</b></div><div class="row"><span class="muted">证据</span><b>18 条</b></div></div><div class="panel"><h3>Connected Entities</h3>${[['Website','example.com'],['IP','104.18.32.10'],['ASN','AS13335'],['Nameserver','a.gtld-servers.net'],['Organization','Cloudflare, Inc.'],['Technology','Cloudflare']].map(a=>`<div class="row"><span class="muted">${a[0]}</span><button class="link" onclick="entity('${a[1]}','${a[0]}')">${a[1]} ↗</button></div>`).join('')}</div><button class="btn primary" onclick="go('evidence');closeDrawer()">查看证据链 →</button>`)}
function home(){document.getElementById('appmain').innerHTML=`<div class="wrap"><section class="hero"><div class="eyebrow">SITEINTEL 2.0 / INTERNET INTELLIGENCE</div><h1>看见一个网站。<br><span style="color:var(--cyan)">看见它背后的网络。</span></h1><p>不是一堆查询结果。SiteIntel 把 Website、IP、ASN、DNS、Technology、Organization、History 与 Evidence 连接成一个可以继续探索的互联网关系空间。</p><div class="hero-actions"><button class="btn primary" onclick="go('websites')">探索 example.com →</button><button class="btn" onclick="go('relations')">进入关系网络</button></div><div class="orb"></div></section><div class="metrics"><div class="metric"><b>12.8M</b><span>Website Entities</span></div><div class="metric"><b>42.7K</b><span>Technology Entities</span></div><div class="metric"><b>86.4M</b><span>Relationships</span></div><div class="metric"><b>195</b><span>Countries / Regions</span></div></div><div class="grid2"><section class="panel"><h3>Live Intelligence Signals</h3><div class="row"><span>IP infrastructure changes</span><b class="status">17,392</b></div><div class="row"><span>DNS / Nameserver changes</span><b>8,421</b></div><div class="row"><span>TLS certificate changes</span><b>4,812</b></div><div class="row"><span>Technology changes</span><b>12,430</b></div></section><section class="panel"><h3>Explore by Entity</h3><div class="row"><button class="link" onclick="entity('104.18.32.10','IP')">104.18.32.10</button><span class="tag">IP</span></div><div class="row"><button class="link" onclick="entity('AS13335','ASN')">AS13335</button><span class="tag">ASN</span></div><div class="row"><button class="link" onclick="entity('a.gtld-servers.net','Nameserver')">a.gtld-servers.net</button><span class="tag">NS</span></div></section></div></div>`}
function website(){document.getElementById('appmain').innerHTML=`<div class="wrap"><div class="eyebrow">WEBSITE / INTELLIGENCE</div><h1>example.com</h1><p class="muted">一个网站，不是一条记录。下面是它在互联网关系网络中的位置。</p><div class="tabs"><button class="tab on">Overview</button><button class="tab" onclick="go('relations')">Relations</button><button class="tab" onclick="go('history')">History</button><button class="tab" onclick="go('evidence')">Evidence</button></div><div class="grid2"><section class="panel"><h3>Infrastructure Map</h3><div class="graph"><div class="edge" style="left:30%;top:50%;width:39%;transform:rotate(0deg)"></div><div class="edge" style="left:30%;top:50%;width:27%;transform:rotate(-45deg)"></div><div class="edge" style="left:30%;top:50%;width:27%;transform:rotate(45deg)"></div><div class="edge" style="left:69%;top:50%;width:23%;transform:rotate(-34deg)"></div><div class="node main" style="left:30%;top:50%"><strong>example.com</strong><small style="display:block;color:var(--muted)">WEBSITE</small></div><div class="node" style="left:72%;top:50%"><strong>104.18.32.10</strong><small style="display:block;color:var(--muted)">IP</small></div><div class="node" style="left:56%;top:26%"><strong>AS13335</strong><small style="display:block;color:var(--muted)">ASN</small></div><div class="node" style="left:56%;top:74%"><strong>Cloudflare</strong><small style="display:block;color:var(--muted)">ORG</small></div><div class="node" style="left:88%;top:26%"><strong>a.gtld-servers.net</strong><small style="display:block;color:var(--muted)">NS</small></div></div></section><section><div class="panel"><h3>Identity</h3><div class="row"><span class="muted">Domain</span><b class="mono">example.com</b></div><div class="row"><span class="muted">Status</span><b class="status">Online</b></div><div class="row"><span class="muted">IP</span><button class="link" onclick="entity('104.18.32.10','IP')">104.18.32.10 ↗</button></div><div class="row"><span class="muted">ASN</span><button class="link" onclick="entity('AS13335','ASN')">AS13335 ↗</button></div></div><div class="panel"><h3>Signals</h3><div class="row"><span>Technology</span><b>28</b></div><div class="row"><span>Related entities</span><b>4,281</b></div><div class="row"><span>Evidence</span><b>126</b></div><button class="btn primary" onclick="go('relations')">Continue exploring →</button></div></section></div></div>`}
function explore(){document.getElementById('appmain').innerHTML=`<div class="wrap"><div class="eyebrow">EXPLORER</div><h1>互联网实体探索</h1><p class="muted">从任何节点开始，然后不断向下点击。</p><div class="grid2"><section class="panel"><h3>Suggested Paths</h3>${[['Website','example.com'],['IP','104.18.32.10'],['ASN','AS13335'],['Nameserver','a.gtld-servers.net'],['Technology','Cloudflare']].map(a=>`<div class="entity-card" style="margin:9px 0" onclick="entity('${a[1]}','${a[0]}')"><span class="tag">${a[0]}</span><b style="margin-left:8px">${a[1]}</b><span style="float:right;color:var(--cyan)">→</span></div>`).join('')}</section><section class="panel"><h3>Relationship Discovery</h3><p class="muted">选择一个实体，SiteIntel 会把它周围可验证的关系展开。</p><div class="row"><span>Website → IP</span><b>1 : 2</b></div><div class="row"><span>IP → ASN</span><b>1 : 1</b></div><div class="row"><span>ASN → Websites</span><b>1 : 182K</b></div><div class="row"><span>Nameserver → Domains</span><b>1 : 2.4M</b></div></section></div></div>`}
function relations(){document.getElementById('appmain').innerHTML=`<div class="wrap"><div class="eyebrow">RELATIONSHIP INTELLIGENCE</div><h1>关系网络</h1><p class="muted">实体不是孤立的数据。每个节点都是继续探索的入口。</p><div class="panel"><div class="graph"><div class="edge" style="left:26%;top:50%;width:24%"></div><div class="edge" style="left:50%;top:50%;width:24%;transform:rotate(-42deg)"></div><div class="edge" style="left:50%;top:50%;width:24%;transform:rotate(42deg)"></div><div class="edge" style="left:50%;top:50%;width:25%;transform:rotate(180deg)"></div><div class="node main" style="left:50%;top:50%"><strong>example.com</strong><small style="display:block;color:var(--muted)">WEBSITE</small></div><div class="node" style="left:26%;top:50%" onclick="entity('104.18.32.10','IP')">104.18.32.10</div><div class="node" style="left:74%;top:29%" onclick="entity('AS13335','ASN')">AS13335</div><div class="node" style="left:74%;top:71%" onclick="entity('Cloudflare','Organization')">Cloudflare</div><div class="node" style="left:22%;top:23%" onclick="entity('a.gtld-servers.net','Nameserver')">a.gtld-servers.net</div></div></div></div>`}
function history(){document.getElementById('appmain').innerHTML=`<div class="wrap"><div class="eyebrow">TIME / INFRASTRUCTURE</div><h1>历史变化</h1><p class="muted">让用户看见网站基础设施如何变化。</p><div class="panel timeline"><div class="event"><span class="muted">2026-08-20</span><i class="dot"></i><div><b>IP observation</b><div class="muted">104.18.32.10 remains active · evidence #E-8421</div></div></div><div class="event"><span class="muted">2026-08-17</span><i class="dot"></i><div><b>Nameserver change</b><div class="muted">NS relationship updated · evidence #E-8210</div></div></div><div class="event"><span class="muted">2026-08-12</span><i class="dot"></i><div><b>TLS certificate change</b><div class="muted">Certificate fingerprint changed · evidence #E-7932</div></div></div><div class="event"><span class="muted">2026-07-30</span><i class="dot"></i><div><b>Technology detected</b><div class="muted">Cloudflare edge signals observed · evidence #E-7440</div></div></div></div></div>`}
function evidence(){document.getElementById('appmain').innerHTML=`<div class="wrap"><div class="eyebrow">EVIDENCE / VERIFIABLE DATA</div><h1>证据链</h1><p class="muted">每一个结论都能回到原始观测。</p><div class="grid2"><section class="panel"><h3>Evidence Flow</h3><div class="row"><span>Observation</span><b>HTTP / DNS / TLS</b></div><div class="row"><span>Normalization</span><b>Canonical Entity</b></div><div class="row"><span>Relationship</span><b>Website ↔ IP ↔ ASN</b></div><div class="row"><span>Conclusion</span><b>Infrastructure cluster</b></div></section><section class="panel"><h3>Recent Evidence</h3><div class="row"><span class="mono">E-8421</span><span>DNS</span></div><div class="row"><span class="mono">E-8210</span><span>RDAP</span></div><div class="row"><span class="mono">E-7932</span><span>TLS</span></div><div class="row"><span class="mono">E-7440</span><span>HTTP</span></div></section></div></div>`}
function generic(){document.getElementById('appmain').innerHTML=`<div class="wrap"><div class="eyebrow">ENTITY INTELLIGENCE</div><h1>${({ip:'IP Addresses',asn:'ASN',dns:'DNS / Nameserver',technology:'Technologies',organization:'Organizations'})[route]||'SiteIntel'}</h1><p class="muted">点击任何实体继续探索。</p><div class="grid2"><section class="panel">${['104.18.32.10','AS13335','a.gtld-servers.net','Cloudflare','example.com'].map(x=>`<div class="entity-card" style="margin:9px 0" onclick="entity('${x}','Entity')"><b>${x}</b><span style="float:right;color:var(--cyan)">↗</span></div>`).join('')}</section><section class="panel"><h3>Network Signal</h3><div class="row"><span>Active relationships</span><b>18,421</b></div><div class="row"><span>Historical observations</span><b>92,410</b></div><div class="row"><span>Evidence records</span><b>31,202</b></div></section></div></div>`}
function render(){nav();if(route==='home')home();else if(route==='websites')website();else if(route==='explore')explore();else if(route==='relations')relations();else if(route==='history')history();else if(route==='evidence')evidence();else generic()}window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||'home';render()});render();
</script></body></html>
