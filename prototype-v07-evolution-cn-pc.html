<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1440"><title>SiteIntel 1.0 Evolution · 中文 PC</title><meta name="description" content="SiteIntel 网站情报分析平台：SEO、技术栈、基础设施、安全、性能、关系、历史与证据。"><style>:root{--bg:#f4f7f8;--card:#fff;--text:#17232d;--muted:#71808d;--line:#dce4e8;--brand:#0f766e;--brand2:#0ea5a4;--soft:#e7f6f3;--ok:#16835b;--warn:#b7791f}*{box-sizing:border-box}html,body{margin:0;min-width:1180px;background:var(--bg);color:var(--text);font:14px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:20}.logo{font-size:20px;font-weight:850}.logo b{color:var(--brand)}.search{flex:1;max-width:700px;background:#f7fafb;border:1px solid var(--line);border-radius:9px;padding:10px 14px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 66px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px 12px}.group{font-size:10px;letter-spacing:1px;color:#8a98a2;margin:16px 8px 6px;text-transform:uppercase}.nav{width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;color:#33424d}.nav:hover,.nav.on{background:var(--soft);color:var(--brand);font-weight:700}main{max-width:1500px;width:100%;margin:auto;padding:26px 28px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:15px}.hero{padding:28px;background:linear-gradient(135deg,#fff,#edf9f7)}h1{font-size:34px;line-height:1.2;margin:5px 0}h2{margin:0}.muted{color:var(--muted)}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.metric{font-size:27px;font-weight:850}.ct{font-weight:750;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.entity{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0}.badge{border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:11px}.ok{color:var(--ok)}.warn{color:var(--warn)}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:15px}.tab{border:0;background:none;padding:10px 14px;color:var(--muted);cursor:pointer}.tab.on{color:var(--brand);border-bottom:2px solid var(--brand);font-weight:700}.graph{height:390px;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden;background:radial-gradient(circle,#e7f7f4,#f6f9fa 65%)}.node{position:absolute;transform:translate(-50%,-50%);padding:9px 12px;background:#fff;border:1px solid #cbdad9;border-radius:9px;color:var(--brand);font-weight:700;cursor:pointer;box-shadow:0 6px 20px #183b3b12}.node.main{border-color:var(--brand2);box-shadow:0 0 0 5px #0ea5a410,0 8px 22px #183b3b14}.drawer{display:none;position:fixed;inset:0;background:#0007;z-index:100}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:620px;background:#fff;padding:26px;overflow:auto}.close{float:right;border:0;background:none;font-size:25px}.timeline{padding-left:20px;border-left:2px solid var(--line)}.event{padding:0 0 20px;position:relative}.event:before{content:"";position:absolute;left:-25px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brand)}.notice{padding:10px 13px;background:var(--soft);border:1px solid #cde9e4;border-radius:8px;color:#276a64;margin-bottom:15px}</style></head><body><header class="top"><div class="logo">Site<b>Intel</b></div><div class="search">⌕ 搜索网站、域名、IP、ASN、技术、服务商或发现...</div><button class="btn">中文</button><button class="btn">帮助</button></header><div class="layout"><aside><div class="group">核心情报</div><button class="nav on" onclick="home()">总览</button><button class="nav" onclick="website()">网站分析</button><button class="nav" onclick="seo()">SEO 情报</button><button class="nav" onclick="technology()">技术栈</button><button class="nav" onclick="explore()">探索</button><div class="group">基础设施</div><button class="nav" onclick="entity('IP','104.18.32.10')">IP 地址</button><button class="nav" onclick="entity('ASN','AS13335')">ASN</button><button class="nav" onclick="entity('服务商','Cloudflare')">服务商</button><button class="nav" onclick="entity('DNS','a.gtld-servers.net')">DNS / Nameserver</button><div class="group">2.0 新能力</div><button class="nav" onclick="relations()">关系图谱</button><button class="nav" onclick="historyPage()">历史 / 时间线</button><button class="nav" onclick="evidence()">证据链</button><div class="group">质量分析</div><button class="nav" onclick="quality('安全')">安全</button><button class="nav" onclick="quality('性能')">性能</button></aside><main id="app"></main></div><div class="drawer" id="drawer"><section class="panel"><button class="close" onclick="closeD()">×</button><div id="panel"></div></section></div><script>const E=(n,t)=>`<button class="entity" onclick="entity('${t}','${n}')">${n}</button>`;const M=(a,b,c)=>`<div class="card"><div class="muted">${a}</div><div class="metric">${b}</div><div class="muted">${c}</div></div>`;const C=(t,x)=>`<div class="card"><div class="ct">${t}</div>${x}</div>`;function set(x){app.innerHTML=x}function head(t,s){return `<div style="margin-bottom:18px"><div class="muted">SiteIntel / 网站情报</div><h1>${t}</h1><div class="muted">${s}</div></div>`}function home(){set(`<div class="hero"><div class="muted">SITEINTEL · 1.0 EVOLUTION</div><h1>看懂任何网站。</h1><p class="muted">保留 1.0 的丰富信息架构与 SEO 友好体验，同时加入 2.0 的 SEO 情报、关系图谱、历史时间线与证据链。</p><button class="btn primary" onclick="website()">分析 example.com</button></div><div class="grid g4">${M('网站','12.8M','全球已观测')}${M('技术指纹','42.7K','持续更新')}${M('国家 / 地区','195','覆盖范围')}${M('关系数据','86.4M','2.0 关系层')}</div><div class="grid g3">${C('网站情报','<div class="row">'+E('example.com','网站')+'<span>84 / 100</span></div><div class="row">SEO<span class="ok">82</span></div><div class="row">安全<span class="ok">91</span></div>')} ${C('实体探索','<div class="row">'+E('React','技术')+'<span>1.28M</span></div><div class="row">'+E('104.18.32.10','IP')+'<span>327K 网站</span></div><div class="row">'+E('AS13335','ASN')+'<span>2.1M</span></div>')} ${C('2.0 新能力','<div class="row"><button class="entity" onclick="relations()">关系图谱 →</button></div><div class="row"><button class="entity" onclick="evidence()">证据链 →</button></div><div class="row"><button class="entity" onclick="historyPage()">历史时间线 →</button></div>')}</div>`)}function website(){set(head('example.com','网站情报 · Website Intelligence')+`<div class="notice">网站是中心：SEO、技术、基础设施、安全、性能、关系、历史和证据都从这里继续展开。</div><div class="hero"><div class="muted">网站</div><h1>example.com</h1><div class="muted">HTTPS · 200 OK · 最近观测：2 分钟前</div><div class="metric">84 / 100</div></div><div class="tabs"><button class="tab on">总览</button><button class="tab" onclick="seo()">SEO</button><button class="tab" onclick="technology()">技术</button><button class="tab" onclick="quality('性能')">性能</button><button class="tab" onclick="quality('安全')">安全</button><button class="tab" onclick="entity('基础设施','网站')">基础设施</button><button class="tab" onclick="relations()">关系</button><button class="tab" onclick="historyPage()">历史</button><button class="tab" onclick="evidence()">证据</button></div><div class="grid g4">${M('SEO','82','5 项发现')}${M('技术','92','24 项技术')}${M('安全','91','0 个严重问题')}${M('性能','76','LCP 2.1s')}</div><div class="grid g2">${C('技术栈','<div class="row">'+E('React','技术')+'<span>98%</span></div><div class="row">'+E('Next.js','技术')+'<span>96%</span></div><div class="row">'+E('Nginx','技术')+'<span>91%</span></div>')} ${C('基础设施','<div class="row">IP '+E('104.18.32.10','IP')+'</div><div class="row">ASN '+E('AS13335','ASN')+'</div><div class="row">服务商 '+E('Cloudflare','服务商')+'</div><div class="row">DNS '+E('a.gtld-servers.net','DNS')+'</div>')}</div><div class="card"><div class="ct">关系图谱预览</div><div class="graph"><div class="node main" style="left:50%;top:50%">example.com</div><div class="node" style="left:18%;top:25%" onclick="entity('IP','104.18.32.10')">IP · 104.18.32.10</div><div class="node" style="left:82%;top:25%" onclick="entity('ASN','AS13335')">ASN · AS13335</div><div class="node" style="left:18%;top:77%" onclick="entity('DNS','a.gtld-servers.net')">DNS · a.gtld-servers.net</div><div class="node" style="left:82%;top:77%" onclick="entity('服务商','Cloudflare')">Cloudflare</div></div></div>`)}function seo(){set(head('SEO 情报','搜索引擎友好的内容层 + 深度 SEO 分析')+`<div class="grid g4">${M('SEO 得分','82','/ 100')}${M('已发现页面','4,821','页面')}${M('关键词','12,481','估算')}${M('搜索可见度','68.4%','当前')}</div><div class="grid g2">${C('技术 SEO','<div class="row">可索引性<span class="ok">良好</span></div><div class="row">Robots.txt<span>有效</span></div><div class="row">Sitemap<span>4,821 URLs</span></div><div class="row">Canonical<span class="ok">有效</span></div><div class="row">结构化数据<span>需要检查</span></div>')} ${C('搜索情报','<div class="row">主要关键词<span>12,481</span></div><div class="row">排名变化<span class="ok">+214</span></div><div class="row">SERP 特征<span>18</span></div><div class="row">竞争网站<span>342</span></div><div class="row">搜索引擎<span>Google · Bing · 百度</span></div>')}</div><div class="card"><div class="ct">SEO 发现</div><div class="row"><button class="entity" onclick="finding('结构化数据缺失')">结构化数据缺失</button><span class="badge warn">中</span></div><div class="row"><button class="entity" onclick="finding('部分页面 LCP 较慢')">部分页面 LCP 较慢</button><span class="badge">低</span></div></div>`)}function technology(){set(head('React','技术情报 · Technology Intelligence')+`<div class="grid g4">${M('使用网站','1.28M','已发现')}${M('国家 / 地区','180','覆盖')}${M('首次发现','2013','历史')}${M('置信度','98%','信号验证')}</div><div class="grid g2">${C('相关技术','<div class="row">'+E('Next.js','技术')+'<span>840K</span></div><div class="row">'+E('TypeScript','技术')+'<span>1.1M</span></div><div class="row">'+E('Redux','技术')+'<span>420K</span></div>')} ${C('检测证据','<div class="row">HTML Script<span>98%</span></div><div class="row">Header Signal<span>96%</span></div><div class="row">Asset Fingerprint<span>94%</span></div>')}</div>`)}function explore(){set(head('探索','网站、技术、IP、ASN 与关系实体')+`<div class="card"><div class="row"><b>12,842,392 个结果</b><button class="btn">筛选 ▾</button></div>${['example.com','shop.example','news.example','app.example','docs.example'].map((n,i)=>`<div class="row"><div>${E(n,'网站')}<div class="muted">${E(i%2?'AWS':'Cloudflare','服务商')} · ${E(i%2?'Next.js':'React','技术')}</div></div><span>SEO ${78+i} · 安全 ${88+i}</span></div>`).join('')}</div>`)}function entity(t,n){open(`<div class="muted">${t.toUpperCase()} / 实体详情</div><h1>${n}</h1><p class="muted">当前情报快照 · 最近更新 2 分钟前。</p><div class="grid g2">${M('关联网站','327K','当前')}${M('置信度','98%','已验证')}${M('覆盖国家','180','当前')}${M('最近发现','2 分钟','前')}</div><h3>关系</h3><div class="row">网站 → ${E('example.com','网站')}</div><div class="row">技术 → ${E('React','技术')}</div><div class="row">服务商 → ${E('Cloudflare','服务商')}</div><div class="row">ASN → ${E('AS13335','ASN')}</div><div class="row">DNS → ${E('a.gtld-servers.net','DNS')}</div><h3>证据</h3><div class="row">HTTP Header<span>99%</span></div><div class="row">DNS Observation<span>98%</span></div><div class="row">Certificate<span>99%</span></div><button class="btn primary" onclick="evidence()">打开证据链</button> <button class="btn" onclick="relations()">探索关系</button>`)}function quality(t){open(`<div class="muted">${t} / 质量分析</div><h1>${t}</h1><div class="metric">91 / 100</div><div class="row"><button class="entity" onclick="finding('缺少 Content-Security-Policy')">缺少 Content-Security-Policy</button><span class="badge warn">中</span></div><div class="row"><button class="entity" onclick="finding('部分页面加载较慢')">部分页面加载较慢</button><span class="badge">低</span></div><h3>建议</h3><div class="card">查看具体发现、证据和历史变化，再进入整改流程。</div>`)}function finding(n){open(`<div class="muted">发现详情</div><h1>${n}</h1><div class="row">严重程度<b>中</b></div><div class="row">状态<b>待处理</b></div><div class="row">首次发现<b>2026-08-12</b></div><div class="row">最近发现<b>2026-08-19 13:20 UTC</b></div><div class="row">置信度<b>98%</b></div><h3>证据</h3><div class="timeline"><div class="event"><b>观测</b><div class="muted">HTTP Header / HTML</div></div><div class="event"><b>验证</b><div class="muted">第二数据源交叉验证</div></div><div class="event"><b>当前状态</b><div class="muted">最近一次扫描仍存在</div></div></div>`)}function relations(){open(`<div class="muted">2.0 / RELATIONSHIP INTELLIGENCE</div><h1>关系图谱</h1><p class="muted">从网站向外探索 IP、ASN、DNS、服务商、技术和相关网站。</p><div class="graph"><div class="node main" style="left:50%;top:50%">example.com</div><div class="node" style="left:15%;top:22%" onclick="entity('IP','104.18.32.10')">IP · 104.18.32.10</div><div class="node" style="left:85%;top:22%" onclick="entity('ASN','AS13335')">ASN · AS13335</div><div class="node" style="left:15%;top:78%" onclick="entity('DNS','a.gtld-servers.net')">DNS · a.gtld-servers.net</div><div class="node" style="left:85%;top:78%" onclick="entity('服务商','Cloudflare')">Cloudflare</div></div>`)}function historyPage(){open(`<div class="muted">2.0 / HISTORY</div><h1>历史时间线</h1><div class="timeline"><div class="event"><b>2026-08-19 · DNS 变化</b><div class="muted">Nameserver 记录发生变化。</div></div><div class="event"><b>2026-08-17 · 技术变化</b><div class="muted">检测到新的 JavaScript 资产。</div></div><div class="event"><b>2026-08-12 · 安全发现</b><div class="muted">发现安全 Header 配置问题。</div></div><div class="event"><b>2026-07-28 · 首次观测</b><div class="muted">建立网站基础情报档案。</div></div></div>`)}function evidence(){open(`<div class="muted">2.0 / EVIDENCE</div><h1>证据链</h1><p class="muted">每个发现都可以追溯到观测、验证和时间。</p><div class="timeline"><div class="event"><b>观测源 · HTTP</b><div class="muted">响应头、HTML、TLS</div></div><div class="event"><b>观测源 · DNS</b><div class="muted">A / AAAA / NS / CNAME</div></div><div class="event"><b>交叉验证</b><div class="muted">多个公开信号一致</div></div><div class="event"><b>最终结论</b><div class="muted">置信度 98%</div></div></div>`)}function open(x){panel.innerHTML=x;drawer.classList.add('open')}function closeD(){drawer.classList.remove('open')}home()</script></body></html>
