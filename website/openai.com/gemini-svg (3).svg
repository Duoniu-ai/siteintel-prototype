      <path d="M 40 10 C 15 5, 5 20, 25 25 C 45 30, 35 45, 10 40" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="25" cy="25" r="4" fill="#60A5FA"/>
      <text x="70" y="34" fill="#FFFFFF" font-size="26" font-weight="800">SiteIntel<tspan fill="#38BDF8">.cc</tspan></text>
