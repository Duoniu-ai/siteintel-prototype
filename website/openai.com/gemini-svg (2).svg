<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1650" width="100%" height="100%" style="background: #030712; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <!-- 12. 方案十二：蓝图晶格风 (Blueprint Lattice) -->
  <g transform="translate(40, 20)">
    <rect width="720" height="140" rx="12" fill="#0B1220" stroke="#1E293B" stroke-width="2"/>
    <text x="20" y="26" fill="#38BDF8" font-size="12" font-weight="bold" letter-spacing="1">OPTION 12: BLUEPRINT LATTICE (蓝图晶格风)</text>
    <g transform="translate(35, 42)">
      <rect x="0" y="0" width="50" height="50" rx="6" fill="#0284C7" fill-opacity="0.1" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2"/>
      <path d="M 10 10 L 40 10 L 10 40 L 40 40" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="10" cy="10" r="3" fill="#60A5FA"/><circle cx="40" cy="40" r="3" fill="#60A5FA"/>
      <text x="70" y="34" fill="#FFFFFF" font-size="26" font-weight="800">SiteIntel<tspan fill="#38BDF8">.cc</tspan></text>
      <text x="72" y="50" fill="#64748B" font-size="10" letter-spacing="1">SYSTEM ARCHITECTURE &amp; CODEX</text>
    </g>
    <g transform="translate(580, 42)">
      <text x="45" y="-6" fill="#94A3B8" font-size="11" text-anchor="middle">Favicon</text>
      <rect width="40" height="40" rx="8" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5"/>
      <path d="M 10 10 L 30 10 L 10 30 L 30 30" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 13. 方案十三：量子节点风 (Quantum Node) -->
  <g transform="translate(40, 180)">
    <rect width="720" height="140" rx="12" fill="#0F0B1E" stroke="#1E293B" stroke-width="2"/>
    <text x="20" y="26" fill="#A855F7" font-size="12" font-weight="bold" letter-spacing="1">OPTION 13: QUANTUM NODE (量子节点风)</text>
    <g transform="translate(35, 42)">
      <circle cx="25" cy="25" r="20" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="4 2"/>
      <path d="M 15 25 Q 25 10, 35 25 T 15 25" fill="none" stroke="#C084FC" stroke-width="3"/>
      <circle cx="25" cy="25" r="4" fill="#E9D5FF"/>
      <text x="70" y="34" fill="#FFFFFF" font-size="26" font-weight="800">Site<tspan fill="#A855F7">Intel</tspan><tspan fill="#C084FC">.cc</tspan></text>
      <text x="72" y="50" fill="#64748B" font-size="10" letter-spacing="1">QUANTUM DATA PROCESSING</text>
    </g>
    <g transform="translate(580, 42)">
      <text x="45" y="-6" fill="#94A3B8" font-size="11" text-anchor="middle">Favicon</text>
      <rect width="40" height="40" rx="8" fill="#7E22CE"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#E9D5FF" stroke-width="2" stroke-dasharray="3 2"/>
      <circle cx="20" cy="20" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- 14. 方案十四：代码魔方风 (Code Matrix Cube) -->
  <g transform="translate(40, 340)">
    <rect width="720" height="140" rx="12" fill="#0A1813" stroke="#1E293B" stroke-width="2"/>
    <text x="20" y="26" fill="#10B981" font-size="12" font-weight="bold" letter-spacing="1">OPTION 14: MATRIX CUBE (代码魔方风)</text>
    <g transform="translate(35, 42)">
      <rect x="5" y="5" width="40" height="40" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="2"/>
      <path d="M 15 20 L 22 25 L 15 30 M 27 30 L 35 30" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="34" fill="#FFFFFF" font-size="26" font-weight="800">siteintel<tspan fill="#10B981">.cc</tspan></text>
      <text x="72" y="50" fill="#64748B" font-family="monospace" font-size="10">[codex_matrix_v2]</text>
    </g>
    <g transform="translate(580, 42)">
      <text x="45" y="-6" fill="#94A3B8" font-size="11" text-anchor="middle">Favicon</text>
      <rect width="40" height="40" rx="8" fill="#059669"/>
      <path d="M 12 16 L 18 20 L 12 24 M 22 24 L 28 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 15. 方案十五：脉冲雷达风 (Pulse Radar) -->
  <g transform="translate(40, 500)">
    <rect width="720" height="140" rx="12" fill="#180C0C" stroke="#1E293B" stroke-width="2"/>
    <text x="20" y="26" fill="#F43F5E" font-size="12" font-weight="bold" letter-spacing="1">OPTION 15: PULSE RADAR (脉冲雷达风)</text>
    <g transform="translate(35, 42)">
      <path d="M 5 25 A 20 20 0 0 1 45 25" fill="none" stroke="#F43F5E" stroke-width="2" stroke-dasharray="2 2"/>
      <path d="M 12 25 A 13 13 0 0 1 38 25" fill="none" stroke="#FB7185" stroke-width="3"/>
      <polygon points="25,25 35,12 29,25" fill="#F43F5E"/>
      <text x="70" y="34" fill="#FFFFFF" font-size="26" font-weight="800">SiteIntel<tspan fill="#F43F5E">.cc</tspan></text>
      <text x="72" y="50" fill="#64748B" font-size="10" letter-spacing="1">REAL-TIME RADAR THREAT &amp; METRICS</text>
    </g>
    <g transform="translate(580, 42)">
      <text x="45" y="-6" fill="#94A3B8" font-size="11" text-anchor="middle">Favicon</text>
      <rect width="40" height="40" rx="8" fill="#E11D48"/>
      <path d="M 8 20 A 12 12 0 0 1 32 20" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="20" cy="20" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- 16. 方案十六：极简双环风 (Orbital Loop) -->
  <g transform="translate(40, 660)">
    <rect width="720" height="140" rx="12" fill="#0C131D" stroke="#1E293B" stroke-width="2"/>
    <text x="20" y="26" fill="#38BDF8" font-size="12" font-weight="bold" letter-spacing="1">OPTION 16: ORBITAL LOOP (轨道双环风)</text>
    <g transform="translate(35, 42)">
      <ellipse cx="20" cy="25" rx="15" ry="8" fill="none" stroke="#38BDF8" stroke-width="2.5" transform="rotate(-30 20 25)"/>
      <ellipse cx="30" cy="25" rx="15" ry="8" fill="none" stroke="#818CF8" stroke-width="2.5" transform="rotate(30 30 25)"/>
      <text x="70" y="34" fill="#FFFFFF" font-size="26" font-weight="800">SiteIntel<tspan fill="#818CF8">.cc</tspan></text>
      <text x="72" y="50" fill="#64748B" font-size="10" letter-spacing="1">DYNAMIC WEB ORBITAL TRACKING</text>
    </g>
    <g transform="translate(580, 42)">
      <text x="45" y="-6" fill="#94A3B8" font-size="11" text-anchor="middle">Favicon</text>
      <rect width="40" height="40" rx="8" fill="#0284C7"/>
      <ellipse cx="20" cy="20" rx="12" ry="6" fill="none" stroke="#FFFFFF" stroke-width="2" transform="rotate(-30 20 20)"/>
    </g>
  </g>

  <!-- 17. 方案十七：AI 分支风 (Tree Branching) -->
  <g transform="translate(40, 820)">
    <rect width="720" height="140" rx="12" fill="#140F0A" stroke="#1E293B" stroke-width="2"/>
    <text x="20" y="26" fill="#F59E0B" font-size="12" font-weight="bold" letter-spacing="1">OPTION 17: SYNTAX TREE (语法树分支风)</text>
    <g transform="translate(35, 42)">
      <path d="M 10 40 V 10 M 10 25 H 35 M 35 25 V 10 M 35 25 V 40" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="10" cy="10" r="3.5" fill="#FBBF24"/><circle cx="35" cy="10" r="3.5" fill="#FBBF24"/><circle cx="35" cy="40" r="3.5" fill="#FBBF24"/>
      <text x="70" y="34" fill="#FFFFFF" font-size="26" font-weight="800">Site<tspan fill="#F59E0B">Intel</tspan><tspan fill="#D97706">.cc</tspan></text>
      <text x="72" y="50" fill="#64748B" font-size="10" letter-spacing="1">ABSTRACT SYNTAX &amp; LOGIC TREE</text>
    </g>
    <g transform="translate(580, 42)">
      <text x="45" y="-6" fill="#94A3B8" font-size="11" text-anchor="middle">Favicon</text>
      <rect width="40" height="40" rx="8" fill="#D97706"/>
      <path d="M 12 30 V 10 M 12 20 H 28 M 28 20 V 10 M 28 20 V 30" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>

  <!-- 18. 方案十八：云端折叠风 (Cloud Fold) -->
  <g transform="translate(40, 980)">
    <rect width="720" height="140" rx="12" fill="#09141A" stroke="#1E293B" stroke-width="2"/>
    <text x="20" y="26" fill="#06B6D4" font-size="12" font-weight="bold" letter-spacing="1">OPTION 18: CLOUD FOLD (云端架构风)</text>
    <g transform="translate(35, 42)">
      <path d="M 10 30 C 10 15, 25 15, 30 20 C 35 10, 50 15, 45 30 Z" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 20 30 L 25 22 L 35 30" fill="none" stroke="#67E8F9" stroke-width="2"/>
      <text x="70" y="34" fill="#FFFFFF" font-size="26" font-weight="800">SiteIntel<tspan fill="#06B6D4">.cc</tspan></text>
      <text x="72" y="50" fill="#64748B" font-size="10" letter-spacing="1">CLOUD NATIVE ARCHITECTURE</text>
    </g>
    <g transform="translate(580, 42)">
      <text x="45" y="-6" fill="#94A3B8" font-size="11" text-anchor="middle">Favicon</text>
      <rect width="40" height="40" rx="8" fill="#0891B2"/>
      <path d="M 8 26 C 8 14, 20 14, 24 18 C 28 10, 36 14, 32 26 Z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>

  <!-- 19. 方案十九：数据柱图风 (Metric Bar) -->
  <g transform="translate(40, 1140)">
    <rect width="720" height="140" rx="12" fill="#130D1A" stroke="#1E293B" stroke-width="2"/>
    <text x="20" y="26" fill="#D946EF" font-size="12" font-weight="bold" letter-spacing="1">OPTION 19: METRIC BAR (数据柱图风)</text>
    <g transform="translate(35, 42)">
      <rect x="5" y="25" width="8" height="20" rx="2" fill="#E879F9"/>
      <rect x="18" y="15" width="8" height="30" rx="2" fill="#D946EF"/>
      <rect x="31" y="5" width="8" height="40" rx="2" fill="#C026D3"/>
      <text x="70" y="34" fill="#FFFFFF" font-size="26" font-weight="800">SiteIntel<tspan fill="#D946EF">.cc</tspan></text>
      <text x="72" y="50" fill="#64748B" font-size="10" letter-spacing="1">SCALABLE ANALYTICS METRICS</text>
    </g>
    <g transform="translate(580, 42)">
      <text x="45" y="-6" fill="#94A3B8" font-size="11" text-anchor="middle">Favicon</text>
      <rect width="40" height="40" rx="8" fill="#C026D3"/>
      <rect x="10" y="20" width="5" height="12" rx="1" fill="#FFFFFF"/>
      <rect x="18" y="14" width="5" height="18" rx="1" fill="#FFFFFF"/>
      <rect x="26" y="8" width="5" height="24" rx="1" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- 20. 方案二十：极光折线风 (Aurora Wave) -->
  <g transform="translate(40, 1300)">
    <rect width="720" height="140" rx="12" fill="#0A1618" stroke="#1E293B" stroke-width="2"/>
    <text x="20" y="26" fill="#14B8A6" font-size="12" font-weight="bold" letter-spacing="1">OPTION 20: AURORA WAVE (极光折线风)</text>
    <g transform="translate(35, 42)">
      <path d="M 5 35 Q 15 5, 25 25 T 45 15" fill="none" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
      <path d="M 5 40 Q 15 10, 25 30 T 45 20" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="70" y="34" fill="#FFFFFF" font-size="26" font-weight="800">Site<tspan fill="#14B8A6">Intel</tspan><tspan fill="#5EEAD4">.cc</tspan></text>
      <text x="72" y="50" fill="#64748B" font-size="10" letter-spacing="1">CONTINUOUS SIGNAL MONITORING</text>
    </g>
    <g transform="translate(580, 42)">
      <text x="45" y="-6" fill="#94A3B8" font-size="11" text-anchor="middle">Favicon</text>
      <rect width="40" height="40" rx="8" fill="#0D9488"/>
      <path d="M 6 28 Q 14 8, 22 20 T 34 12" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 21. 方案二十一：终端光标风 (Terminal Cursor) -->
  <g transform="translate(40, 1460)">
    <rect width="720" height="140" rx="12" fill="#111111" stroke="#27272A" stroke-width="2"/>
    <text x="20" y="26" fill="#22C55E" font-size="12" font-weight="bold" letter-spacing="1">OPTION 21: TERMINAL CURSOR (终端光标风)</text>
    <g transform="translate(35, 42)">
      <text x="5" y="32" fill="#22C55E" font-family="monospace" font-size="28" font-weight="bold">&gt;_</text>
      <text x="70" y="34" fill="#FFFFFF" font-family="monospace" font-size="24" font-weight="bold">siteintel<tspan fill="#22C55E">.cc</tspan></text>
      <text x="72" y="50" fill="#71717A" font-family="monospace" font-size="10">root@siteintel:~# ./start.sh</text>
    </g>
    <g transform="translate(580, 42)">
      <text x="45" y="-6" fill="#94A3B8" font-size="11" text-anchor="middle">Favicon</text>
      <rect width="40" height="40" rx="8" fill="#15803D"/>
      <text x="8" y="28" fill="#FFFFFF" font-family="monospace" font-size="20" font-weight="bold">&gt;_</text>
    </g>
  </g>

</svg>
