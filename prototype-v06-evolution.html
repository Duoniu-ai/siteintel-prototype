<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteIntel 1.0 Evolution · 2.0 Features</title><meta name="description" content="SiteIntel website intelligence prototype: SEO, technology, infrastructure, security, performance, relationships, history and evidence."><style>:root{--bg:#f4f7f8;--card:#fff;--text:#18232d;--muted:#71808d;--line:#dce4e8;--brand:#0f766e;--brand2:#0ea5a4;--soft:#e8f7f5;--dark:#102a2b;--ok:#16835b;--warn:#b7791f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 22px;position:sticky;top:0;z-index:20}.logo{font-size:20px;font-weight:850}.logo b{color:var(--brand)}.search{flex:1;max-width:680px;background:#f7fafb;border:1px solid var(--line);border-radius:9px;padding:10px 14px;color:var(--muted);cursor:pointer}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--text)}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.layout{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 66px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px 12px}.group{font-size:10px;letter-spacing:1px;color:#8a98a2;margin:16px 8px 6px;text-transform:uppercase}.nav{width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;color:#33424d}.nav:hover,.nav.on{background:var(--soft);color:var(--brand);font-weight:700}main{max-width:1500px;width:100%;margin:auto;padding:25px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:14px}.hero{padding:27px;background:linear-gradient(135deg,#fff,#edf9f7)}h1{font-size:34px;line-height:1.2;margin:5px 0}h2{margin:0}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.metric{font-size:27px;font-weight:850}.ct{font-weight:750;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.entity{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0}.badge{border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:11px}.ok{color:var(--ok)}.warn{color:var(--warn)}.tabs{display:flex;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:14px}.tab{border:0;background:none;padding:10px 12px;color:var(--muted);white-space:nowrap;cursor:pointer}.tab.on{color:var(--brand);border-bottom:2px solid var(--brand);font-weight:700}.graph{height:390px;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden;background:radial-gradient(circle,#e7f7f4,#f6f9fa 65%)}.node{position:absolute;transform:translate(-50%,-50%);padding:9px 12px;background:#fff;border:1px solid #cbdad9;border-radius:9px;color:var(--brand);font-weight:700;cursor:pointer;box-shadow:0 6px 20px #183b3b12}.node.main{border-color:var(--brand2);box-shadow:0 0 0 5px #0ea5a410,0 8px 22px #183b3b14}.drawer{display:none;position:fixed;inset:0;background:#0007;z-index:100}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(620px,95vw);background:#fff;padding:24px;overflow:auto}.close{float:right;border:0;background:none;font-size:25px}.timeline{padding-left:20px;border-left:2px solid var(--line)}.event{padding:0 0 20px;position:relative}.event:before{content:"";position:absolute;left:-25px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brand)}.bottom{display:none}@media(max-width:800px){.layout{display:block}aside{display:none}main{padding:15px 13px 75px}.g4,.g3,.g2{grid-template-columns:1fr}.hero h1{font-size:28px}.top{padding:0 13px}.top .btn{display:none}.bottom{display:grid;position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid var(--line);z-index:30;grid-template-columns:repeat(5,1fr)}.bottom button{border:0;background:none;color:var(--muted)}.bottom button.on{color:var(--brand)}}@media(max-width:520px){.search{font-size:0;max-width:42px;padding:10px}.search:before{content:'⌕';font-size:18px}}</style></head><body><header class="top"><div class="logo">Site<b>Intel</b></div><button class="search" onclick="search()">⌕ Search domain, IP, ASN, technology, provider, finding...</button><button class="btn">中文</button></header><div class="layout"><aside><div class="group">Intelligence</div><button class="nav on" onclick="home()">Overview</button><button class="nav" onclick="website()">Website</button><button class="nav" onclick="seo()">SEO Intelligence</button><button class="nav" onclick="technology()">Technology</button><button class="nav" onclick="explore()">Explore</button><div class="group">Infrastructure</div><button class="nav" onclick="entity('IP','104.18.32.10')">IP</button><button class="nav" onclick="entity('ASN','AS13335')">ASN</button><button class="nav" onclick="entity('Provider','Cloudflare')">Provider</button><button class="nav" onclick="entity('DNS','a.gtld-servers.net')">DNS / Nameserver</button><div class="group">2.0 Intelligence</div><button class="nav" onclick="relations()">Relationship Map</button><button class="nav" onclick="historyPage()">History / Timeline</button><button class="nav" onclick="evidence()">Evidence Chain</button><div class="group">Quality</div><button class="nav" onclick="quality('Security')">Security</button><button class="nav" onclick="quality('Performance')">Performance</button></aside><main id="app"></main></div><nav class="bottom"><button onclick="home()">Home</button><button onclick="search()">Search</button><button onclick="website()">Website</button><button onclick="relations()">Relations</button><button onclick="evidence()">Evidence</button></nav><div class="drawer" id="drawer"><section class="panel"><button class="close" onclick="closeD()">×</button><div id="panel"></div></section></div><script>const E=(n,t)=>`<button class="entity" onclick="entity('${t}','${n}')">${n}</button>`;const M=(a,b,c)=>`<div class="card"><div class="muted">${a}</div><div class="metric">${b}</div><div class="muted">${c}</div></div>`;const C=(t,x)=>`<div class="card"><div class="ct">${t}</div>${x}</div>`;function set(x){app.innerHTML=x}function head(t,s){return `<div style="margin-bottom:18px"><div class="muted">SiteIntel / Intelligence</div><h1>${t}</h1><div class="muted">${s}</div></div>`}function home(){set(`<div class="hero"><div class="muted">WEBSITE DATA INTELLIGENCE PLATFORM · 1.0 EVOLUTION</div><h1>Understand any website.</h1><p class="muted">保留 SiteIntel 1.0 的丰富信息结构，同时加入 2.0 的 SEO Intelligence、Relationship、History 和 Evidence 能力。</p><button class="btn primary" onclick="website()">Analyze example.com</button></div><div class="grid g4">${M('Websites','12.8M','observed globally')}${M('Technologies','42.7K','fingerprints')}${M('Countries','195','coverage')}${M('Relationships','86.4M','2.0 graph layer')}</div><div class="grid g3">${C('Website Intelligence','<div class="row">'+E('example.com','Website')+'<span>84 / 100</span></div><div class="row">SEO<span class="ok">82</span></div><div class="row">Security<span class="ok">91</span></div>')} ${C('Explore Entities','<div class="row">'+E('React','Technology')+'<span>1.28M</span></div><div class="row">'+E('104.18.32.10','IP')+'<span>327K sites</span></div><div class="row">'+E('AS13335','ASN')+'<span>2.1M</span></div>')} ${C('2.0 New Capabilities','<div class="row">Relationship Map<span>→</span></div><div class="row">Evidence Chain<span>→</span></div><div class="row">History Timeline<span>→</span></div>')}</div>`)}function website(){set(head('example.com','Website Intelligence · Website remains the center')+`<div class="hero"><div class="muted">WEBSITE</div><h1>example.com</h1><div class="muted">HTTPS · 200 OK · last observed 2 minutes ago</div><div class="metric">84 / 100</div></div><div class="tabs"><button class="tab on">Overview</button><button class="tab" onclick="seo()">SEO</button><button class="tab" onclick="technology()">Technology</button><button class="tab" onclick="quality('Performance')">Performance</button><button class="tab" onclick="quality('Security')">Security</button><button class="tab" onclick="entity('Infrastructure','Website')">Infrastructure</button><button class="tab" onclick="relations()">Relations</button><button class="tab" onclick="historyPage()">History</button><button class="tab" onclick="evidence()">Evidence</button></div><div class="grid g4">${M('SEO','82','5 findings')}${M('Technology','92','24 detected')}${M('Security','91','0 critical')}${M('Performance','76','LCP 2.1s')}</div><div class="grid g2">${C('Technology Stack','<div class="row">'+E('React','Technology')+'<span>98%</span></div><div class="row">'+E('Next.js','Technology')+'<span>96%</span></div><div class="row">'+E('Nginx','Technology')+'<span>91%</span></div>')} ${C('Infrastructure','<div class="row">IP '+E('104.18.32.10','IP')+'</div><div class="row">ASN '+E('AS13335','ASN')+'</div><div class="row">Provider '+E('Cloudflare','Provider')+'</div><div class="row">DNS '+E('a.gtld-servers.net','DNS')+'</div>')}</div><div class="card"><div class="ct">Website Relationship</div><div class="graph"><div class="node main" style="left:50%;top:50%">example.com</div><div class="node" style="left:18%;top:25%" onclick="entity('IP','104.18.32.10')">IP · 104.18.32.10</div><div class="node" style="left:82%;top:25%" onclick="entity('ASN','AS13335')">ASN · AS13335</div><div class="node" style="left:18%;top:77%" onclick="entity('DNS','a.gtld-servers.net')">DNS · a.gtld-servers.net</div><div class="node" style="left:82%;top:77%" onclick="entity('Provider','Cloudflare')">Cloudflare</div></div></div>`)}function seo(){set(head('SEO Intelligence','2.0 capability added without sacrificing the 1.0 information model')+`<div class="grid g4">${M('SEO Score','82','/ 100')}${M('Indexed Pages','4,821','observed')}${M('Keywords','12,481','estimated')}${M('Visibility','68.4%','search')}</div><div class="grid g2">${C('Technical SEO','<div class="row">Indexability<span class="ok">Good</span></div><div class="row">Robots.txt<span>Valid</span></div><div class="row">Sitemap<span>4,821 URLs</span></div><div class="row">Canonical<span class="ok">Valid</span></div><div class="row">Structured Data<span>Needs review</span></div>')} ${C('Search Intelligence','<div class="row">Top Keywords<span>12,481</span></div><div class="row">Ranking Changes<span class="ok">+214</span></div><div class="row">SERP Features<span>18</span></div><div class="row">Competitors<span>342</span></div><div class="row">Search Engines<span>Google · Bing · Baidu</span></div>')}</div><div class="card"><div class="ct">SEO Findings</div><div class="row"><button class="entity" onclick="finding('Missing structured data')">Missing structured data</button><span class="badge warn">Medium</span></div><div class="row"><button class="entity" onclick="finding('Slow LCP')">Several pages have slow LCP</button><span class="badge">Low</span></div></div>`)}function technology(){set(head('React','Technology Intelligence')+`<div class="grid g4">${M('Websites','1.28M','detected')}${M('Countries','180','coverage')}${M('First Seen','2013','history')}${M('Confidence','98%','signals')}</div><div class="grid g2">${C('Related Technologies','<div class="row">'+E('Next.js','Technology')+'<span>840K</span></div><div class="row">'+E('TypeScript','Technology')+'<span>1.1M</span></div><div class="row">'+E('Redux','Technology')+'<span>420K</span></div>')} ${C('Detection Evidence','<div class="row">HTML Script<span>98%</span></div><div class="row">Header Signal<span>96%</span></div><div class="row">Asset Fingerprint<span>94%</span></div>')}</div>`)}function explore(){set(head('Explore','Global website and entity discovery')+`<div class="card"><div class="row"><b>12,842,392 results</b><button class="btn">Filters ▾</button></div>${['example.com','shop.example','news.example','app.example','docs.example'].map((n,i)=>`<div class="row"><div>${E(n,'Website')}<div class="muted">${E(i%2?'AWS':'Cloudflare','Provider')} · ${E(i%2?'Next.js':'React','Technology')}</div></div><span>SEO ${78+i} · Security ${88+i}</span></div>`).join('')}</div>`)}function entity(t,n){open(`<div class="muted">${t.toUpperCase()} DETAIL</div><h1>${n}</h1><p class="muted">Current intelligence snapshot · updated 2 minutes ago.</p><div class="grid g2">${M('Associated Websites','327K','current')}${M('Confidence','98%','verified')}${M('Countries','180','coverage')}${M('Last Seen','2 min','ago')}</div><h3>Relationships</h3><div class="row">Website → ${E('example.com','Website')}</div><div class="row">Technology → ${E('React','Technology')}</div><div class="row">Provider → ${E('Cloudflare','Provider')}</div><div class="row">ASN → ${E('AS13335','ASN')}</div><h3>Evidence</h3><div class="row">HTTP Header<span>99%</span></div><div class="row">DNS Observation<span>98%</span></div><div class="row">Certificate<span>99%</span></div><button class="btn primary" onclick="evidence()">Open Evidence Chain</button><button class="btn" onclick="relations()">Explore Relations</button>`)}function relations(){set(head('Relationship Map','2.0 visual layer · relationships remain an extension of Website Intelligence')+`<div class="card"><div class="graph"><div class="node main" style="left:50%;top:50%">example.com</div><div class="node" style="left:14%;top:24%" onclick="entity('IP','104.18.32.10')">IP · 104.18.32.10</div><div class="node" style="left:86%;top:24%" onclick="entity('ASN','AS13335')">ASN · AS13335</div><div class="node" style="left:14%;top:78%" onclick="entity('DNS','a.gtld-servers.net')">DNS · a.gtld-servers.net</div><div class="node" style="left:86%;top:78%" onclick="entity('Provider','Cloudflare')">Organization · Cloudflare</div></div></div>`)}function historyPage(){set(head('History / Timeline','See how a website changed over time')+`<div class="card timeline"><div class="event"><b>2026-08-20 · Technology changed</b><div class="muted">React fingerprint confirmed</div></div><div class="event"><b>2026-08-18 · DNS changed</b><div class="muted">Nameserver observation updated</div></div><div class="event"><b>2026-08-15 · Certificate changed</b><div class="muted">TLS certificate renewed</div></div><div class="event"><b>2026-08-10 · SEO finding</b><div class="muted">Structured data issue first observed</div></div></div>`)}function evidence(){set(head('Evidence Chain','Every important finding should be traceable to an observation')+`<div class="card"><div class="row"><b>Finding</b><span>Missing structured data</span></div><div class="row"><b>Source</b><span>HTML Observation</span></div><div class="row"><b>Observed</b><span>2026-08-20 13:42 UTC</span></div><div class="row"><b>Confidence</b><span>98%</span></div><div class="row"><b>Status</b><span class="ok">Verified</span></div></div><div class="card"><div class="ct">Evidence events</div><div class="timeline"><div class="event"><b>Observation</b><div class="muted">HTML / HTTP headers collected</div></div><div class="event"><b>Analysis</b><div class="muted">Structured data parser found incomplete schema</div></div><div class="event"><b>Conclusion</b><div class="muted">SEO finding generated with medium severity</div></div></div></div>`)}function quality(t){set(head(t,t+' Intelligence')+`<div class="grid g4">${M('Score','91','/ 100')}${M('Findings','3','active')}${M('Critical','0','issues')}${M('Last Scan','2 min','ago')}</div><div class="card"><div class="row"><button class="entity" onclick="finding('Missing Content-Security-Policy')">Missing Content-Security-Policy</button><span class="badge warn">Medium</span></div><div class="row"><button class="entity" onclick="finding('LCP above target')">LCP above target</button><span class="badge">Low</span></div><div class="row"><button class="entity" onclick="finding('Security header review')">Security header review</button><span class="badge">Low</span></div></div>`)}function finding(n){open(`<div class="muted">FINDING DETAIL</div><h1>${n}</h1><div class="row">Severity<b>Medium</b></div><div class="row">Status<b>Open</b></div><div class="row">First Seen<b>2026-08-12</b></div><div class="row">Confidence<b>98%</b></div><h3>Evidence Chain</h3><div class="timeline"><div class="event"><b>Observation</b><div class="muted">HTTP / HTML signal captured</div></div><div class="event"><b>Analysis</b><div class="muted">Rule engine evaluated the observation</div></div><div class="event"><b>Conclusion</b><div class="muted">Finding created and linked to example.com</div></div></div>`)}function search(){open(`<div class="muted">GLOBAL SEARCH</div><h1>Explore SiteIntel</h1><input placeholder="example.com / IP / ASN / technology" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:8px"><p><button class="btn primary" onclick="website();closeD()">Search example.com</button></p>`)}function open(x){panel.innerHTML=x;drawer.classList.add('open')}function closeD(){drawer.classList.remove('open')}home()</script></body></html>
