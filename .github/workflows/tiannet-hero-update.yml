name: TIANNET Hero Update

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch homepage
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          p = Path('website/openai.com/TIANNET 天网官网首页.html')
          text = p.read_text(encoding='utf-8')

          start_marker = '''  /* ==========================================================\n     HERO CANVAS INTELLIGENCE FIELD\n  ========================================================== */'''
          end_marker = '''  /* ==========================================================\n     INITIAL LANGUAGE\n  ========================================================== */'''
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Hero Canvas block markers not found')

          new_block = '''  /* ==========================================================\n     HERO CANVAS INTELLIGENCE FIELD\n     Interactive TIANNET network field\n  ========================================================== */\n\n  (function(){\n    var fieldCanvas = document.getElementById('heroField');\n    if(!fieldCanvas) return;\n    var ctx = fieldCanvas.getContext('2d');\n    if(!ctx) return;\n\n    var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    var W=0,H=0,dpr=1;\n    var pointer={x:null,y:null};\n    var nodes=[];\n    var MAX_LINK_DISTANCE=135;\n    var POINTER_RADIUS=175;\n    var TYPES=['WEBSITE','DOMAIN','ENTITY','RELATION','IP','DNS','TECH','ASN','CERTIFICATE','INFRASTRUCTURE','PLATFORM','EVENT','DISCOVERY','INTELLIGENCE'];\n\n    function rnd(lo,hi){ return lo+Math.random()*(hi-lo); }\n    function count(){\n      if(W<700) return 44;\n      if(W<1100) return 70;\n      return Math.min(128,Math.max(76,Math.floor((W*H)/11000)));\n    }\n    function make(){\n      return {x:rnd(0,W),y:rnd(0,H),vx:rnd(-.12,.12),vy:rnd(-.10,.10),r:rnd(1.2,2.8),alpha:rnd(.20,.62),pulse:rnd(0,Math.PI*2),type:TYPES[Math.floor(Math.random()*TYPES.length)]};\n    }\n    function seed(){\n      nodes=[];\n      for(var i=0;i<count();i++) nodes.push(make());\n    }\n    function resize(){\n      var rect=fieldCanvas.getBoundingClientRect();\n      W=Math.max(rect.width,10); H=Math.max(rect.height,10);\n      dpr=Math.min(window.devicePixelRatio||1,2);\n      fieldCanvas.width=Math.round(W*dpr); fieldCanvas.height=Math.round(H*dpr);\n      ctx.setTransform(dpr,0,0,dpr,0,0); seed();\n    }\n    function update(n){\n      n.x+=n.vx; n.y+=n.vy; n.pulse+=.012;\n      n.vx+=Math.sin(n.pulse)*.0008; n.vy+=Math.cos(n.pulse*.8)*.0006;\n      if(pointer.x!==null&&pointer.y!==null){\n        var dx=n.x-pointer.x,dy=n.y-pointer.y,dist=Math.hypot(dx,dy);\n        if(dist>0&&dist<POINTER_RADIUS){\n          var f=(1-dist/POINTER_RADIUS)*.012;\n          n.vx+=(dx/dist)*f; n.vy+=(dy/dist)*f;\n        }\n      }\n      n.vx*=.994; n.vy*=.994;\n      if(n.x<-20)n.x=W+20; if(n.x>W+20)n.x=-20;\n      if(n.y<-20)n.y=H+20; if(n.y>H+20)n.y=-20;\n    }\n    function drawPointer(){\n      if(pointer.x===null||pointer.y===null)return;\n      var g=ctx.createRadialGradient(pointer.x,pointer.y,0,pointer.x,pointer.y,POINTER_RADIUS);\n      g.addColorStop(0,'rgba(59,130,246,.055)');\n      g.addColorStop(.35,'rgba(59,130,246,.022)');\n      g.addColorStop(1,'rgba(59,130,246,0)');\n      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pointer.x,pointer.y,POINTER_RADIUS,0,Math.PI*2); ctx.fill();\n    }\n    function drawLinks(){\n      for(var i=0;i<nodes.length;i++){\n        var a=nodes[i];\n        for(var j=i+1;j<nodes.length;j++){\n          var b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);\n          if(dist>MAX_LINK_DISTANCE)continue;\n          var op=(1-dist/MAX_LINK_DISTANCE)*.13,boost=0;\n          if(pointer.x!==null&&pointer.y!==null){\n            var da=Math.hypot(a.x-pointer.x,a.y-pointer.y);\n            var db=Math.hypot(b.x-pointer.x,b.y-pointer.y);\n            if(da<POINTER_RADIUS||db<POINTER_RADIUS)boost=.24;\n          }\n          op=Math.min(.5,op+boost);\n          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);\n          ctx.strokeStyle='rgba(100,140,195,'+op.toFixed(3)+')';\n          ctx.lineWidth=boost>.0?.85:.55; ctx.stroke();\n        }\n      }\n    }\n    function drawNodes(){\n      for(var i=0;i<nodes.length;i++){\n        var n=nodes[i],r=n.r*(1+Math.sin(n.pulse)*.12);\n        var blue=n.type==='DOMAIN'||n.type==='ENTITY'||n.type==='RELATION'||n.type==='DISCOVERY'||n.type==='INTELLIGENCE';\n        ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2);\n        ctx.fillStyle=blue?'rgba(96,165,250,'+n.alpha+')':'rgba(244,244,242,'+(n.alpha*.72)+')'; ctx.fill();\n      }\n    }\n    function draw(){\n      ctx.clearRect(0,0,W,H); drawPointer(); drawLinks(); drawNodes();\n      if(reduce)return; nodes.forEach(update); requestAnimationFrame(draw);\n    }\n    function move(e){\n      var rect=fieldCanvas.getBoundingClientRect();\n      pointer.x=e.clientX-rect.left; pointer.y=e.clientY-rect.top;\n    }\n    function leave(){pointer.x=null;pointer.y=null;}\n    fieldCanvas.addEventListener('pointermove',move,{passive:true});\n    fieldCanvas.addEventListener('pointerleave',leave,{passive:true});\n    window.addEventListener('resize',resize);\n    resize(); fieldCanvas.classList.add('on'); draw();\n  })();\n\n'''
          text=text[:start]+new_block+text[end:]

          removals=[
            (r'\n\s*<a\s+class="nav-cta"\s+href="#ecosystem"\s+data-i18n="nav\.enter"\s*>\s*进入天网\s*</a>\s*','desktop CTA'),
            (r'\n\s*<a\s+class="mm-cta"\s+href="#ecosystem"\s+data-i18n="nav\.enter"\s*>\s*进入天网\s*→\s*</a>\s*','mobile CTA'),
            (r'\n\s*\.nav-cta\{.*?\n\s*\}\n\s*\.nav-cta:hover\{.*?\n\s*\}\n','desktop CTA CSS'),
            (r'\n\s*\.mobile-menu a\.mm-cta\{.*?\n\s*\}\n','mobile CTA CSS')
          ]
          for pat,name in removals:
              text,n=re.subn(pat,'\n',text,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'Expected one {name} removal, got {n}')

          p.write_text(text,encoding='utf-8')
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',text,re.S|re.I)
          check=Path('/tmp/tiannet-check.js')
          check.write_text('\n\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check',str(check)],check=True)

      - name: Commit patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tiannet-hero-update.yml
          git add 'website/openai.com/TIANNET 天网官网首页.html'
          git commit -m 'Update TIANNET hero network field'
          git push origin HEAD:${GITHUB_HEAD_REF}
