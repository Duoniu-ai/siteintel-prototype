<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SiteIntel 2.0｜网站数据智能平台</title>
<style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#111827;--sub:#667085;--line:#e7e9ee;--blue:#2457e6;--blue2:#eef3ff;--nav:248px;--top:72px}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:var(--top);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:24px;position:sticky;top:0;z-index:50}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.brand i{font-style:normal;color:var(--blue)}.search{height:42px;max-width:680px;flex:1;border:1px solid var(--line);border-radius:12px;background:#fafbfc;display:flex;align-items:center;padding:0 15px;color:var(--sub)}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 13px}.btn:hover{border-color:#c8ced8}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.shell{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:calc(100vh - var(--top))}aside{background:#fff;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto}.nav-title{font-size:11px;color:#98a2b3;font-weight:800;margin:20px 10px 7px}.nav-title:first-child{margin-top:0}.nav{width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:9px;color:#344054;margin:2px 0}.nav:hover,.nav.on{background:var(--blue2);color:var(--blue);font-weight:700}.main{width:min(1480px,100%);margin:auto;padding:38px 42px 70px}.crumb{font-size:12px;color:#98a2b3;margin-bottom:7px}.page-title{font-size:30px;letter-spacing:-.7px;margin:0 0 6px}.page-desc{color:var(--sub);margin:0 0 25px}.hero{padding:58px 56px;background:#fff;border:1px solid var(--line);border-radius:20px;margin-bottom:22px}.hero .eyebrow{font-weight:700;color:var(--blue);margin-bottom:9px}.hero h1{font-size:48px;line-height:1.15;letter-spacing:-1.8px;margin:0 0 14px}.hero p{max-width:780px;color:var(--sub);font-size:16px;margin:0 0 25px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}.numbers{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:28px 0 22px}.number{padding:22px 24px;border-right:1px solid var(--line)}.number:last-child{border-right:0}.number b{font-size:28px;display:block;letter-spacing:-.8px}.number span{font-size:12px;color:var(--sub)}.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr);gap:20px}.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:23px;margin-bottom:18px}.section h3{margin:0 0 15px;font-size:16px}.line{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}.label{color:var(--sub)}.entity{border:0;background:none;color:var(--blue);padding:0;font-weight:700;text-align:left}.entity:hover{text-decoration:underline}.muted{color:var(--sub)}.small{font-size:12px}.tag{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px;margin:2px 4px 2px 0}.tabs{display:flex;gap:3px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:20px}.tab{border:0;background:none;color:var(--sub);padding:11px 14px;white-space:nowrap}.tab.on{color:var(--blue);font-weight:700;border-bottom:2px solid var(--blue)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--sub);font-weight:700}.table-scroll{overflow:auto}.timeline .line{display:grid;grid-template-columns:150px 1fr auto;align-items:center}.graph{height:470px;position:relative;border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle at center,#fff 0,#fafcff 42%,#f3f6fb 100%);overflow:hidden}.graph svg{position:absolute;inset:0;width:100%;height:100%}.node{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid #d8dee8;border-radius:11px;padding:10px 15px;box-shadow:0 8px 24px #10182810;color:var(--blue);font-weight:700}.node.main{position:absolute;width:auto;padding:13px 18px;border-color:#b7c7f6;box-shadow:0 12px 30px #2457e625}.drawer{display:none;position:fixed;inset:0;background:#10182866;z-index:100}.drawer.open{display:block}.drawer-panel{position:absolute;right:0;top:0;width:min(680px,94vw);height:100%;overflow:auto;background:#fff;padding:30px}.close{float:right;border:0;background:none;font-size:28px}.bottom{display:none}
@media(max-width:1200px){:root{--nav:220px}.main{padding:30px 25px}.numbers{grid-template-columns:repeat(2,1fr)}.number:nth-child(2){border-right:0}.number:nth-child(-n+2){border-bottom:1px solid var(--line)}.cols3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){:root{--top:58px}.top{height:var(--top);padding:0 13px;gap:10px}.brand{font-size:19px}.search{display:none}.actions{margin-left:auto}.actions .account{display:none}.shell{display:block}aside{display:none}.main{padding:17px 13px 82px}.hero{padding:31px 20px;border-radius:15px}.hero h1{font-size:33px;letter-spacing:-1px}.hero p{font-size:14px}.numbers{grid-template-columns:1fr 1fr}.number{padding:16px}.number b{font-size:22px}.cols,.cols3{grid-template-columns:1fr}.section{padding:17px;border-radius:13px}.page-title{font-size:26px}.timeline .line{grid-template-columns:1fr;gap:4px}.graph{height:390px}.drawer-panel{width:100%;padding:20px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:60;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:none;color:var(--sub);font-size:11px}.hide-phone{display:none!important}}
</style>
</head>
<body>
<header class="top"><div class="brand">Site<i>Intel</i></div><button class="search" onclick="search()">⌕　搜索网站、域名、IP、ASN、技术……</button><div class="actions"><button class="btn" onclick="toggleLang()" id="lang">EN</button><button class="btn account">账户</button></div></header>
<div class="shell"><aside id="aside"></aside><main class="main" id="app"></main></div><nav class="bottom" id="bottom"></nav>
<div class="drawer" id="drawer"><section class="drawer-panel"><button class="close" onclick="closeDrawer()">×</button><div id="drawerContent"></div></section></div>
<script>
const T={zh:{home:'首页',explore:'探索',websites:'网站',tech:'技术',network:'网络基础设施',ip:'IP 地址',asn:'ASN',provider:'服务商',country:'国家/地区',security:'安全',seo:'SEO',performance:'性能',relations:'关系',history:'历史变化',evidence:'证据链',compare:'数据对比',reports:'报告'},en:{home:'Home',explore:'Explore',websites:'Websites',tech:'Technologies',network:'Infrastructure',ip:'IP Addresses',asn:'ASN',provider:'Providers',country:'Countries / Regions',security:'Security',seo:'SEO',performance:'Performance',relations:'Relations',history:'Changes',evidence:'Evidence',compare:'Compare',reports:'Reports'}};
let lang=localStorage.getItem('siteintel-lang')||'zh';const L=k=>T[lang][k]||k;function toggleLang(){lang=lang==='zh'?'en':'zh';localStorage.setItem('siteintel-lang',lang);route()}function go(x){location.hash=x}function nav(k,r){return `<button class="nav ${location.hash.slice(1)===r?'on':''}" onclick="go('${r}')">${L(k)}</button>`}function renderChrome(){document.getElementById('aside').innerHTML=`<div class="nav-title">${L('home')}</div>${nav('home','home')}${nav('explore','explore')}${nav('websites','websites')}<div class="nav-title">${L('network')}</div>${nav('tech','tech')}${nav('ip','ip')}${nav('asn','asn')}${nav('provider','provider')}${nav('country','country')}<div class="nav-title">数据</div>${nav('security','security')}${nav('seo','seo')}${nav('performance','performance')}<div class="nav-title">探索关系</div>${nav('relations','relations')}${nav('history','history')}${nav('evidence','evidence')}<div class="nav-title">工作区</div>${nav('compare','compare')}${nav('reports','reports')}`;document.getElementById('lang').textContent=lang==='zh'?'EN':'中';document.getElementById('bottom').innerHTML=`<button onclick="go('home')">${L('home')}</button><button onclick="go('explore')">${L('explore')}</button><button onclick="go('websites')">${L('websites')}</button><button onclick="go('relations')">${L('relations')}</button><button onclick="go('reports')">${L('reports')}</button>`}
function title(t,d=''){return `<div class="crumb">SiteIntel / ${t}</div><h1 class="page-title">${t}</h1>${d?`<p class="page-desc">${d}</p>`:''}`}
function stat(label,value,note=''){return `<div class="number"><b>${value}</b><span>${label}${note?' · '+note:''}</span></div>`}
function entity(name,type){openDrawer(`<div class="crumb">实体详情</div><h1 class="page-title">${name}</h1><p class="page-desc">${type} · 可继续探索相关数据与证据</p><div class="section"><h3>核心参数</h3>${rows(type,name)}</div><div class="section"><h3>关联关系</h3><div class="line"><span>网站</span><button class="entity" onclick="openWebsite()">example.com</button></div><div class="line"><span>技术</span><button class="entity" onclick="entity('React','技术')">React</button></div><div class="line"><span>IP 地址</span><button class="entity" onclick="entity('104.18.32.10','IP 地址')">104.18.32.10</button></div><div class="line"><span>ASN</span><button class="entity" onclick="entity('AS13335','ASN')">AS13335</button></div><div class="line"><span>服务商</span><button class="entity" onclick="entity('Cloudflare','服务商')">Cloudflare</button></div><div class="line"><span>国家/地区</span><button class="entity" onclick="entity('美国','国家/地区')">美国</button></div></div><div class="section"><h3>数据证据</h3><div class="line"><span>HTTP 响应</span><b>已观测</b></div><div class="line"><span>DNS 记录</span><b>已观测</b></div><div class="line"><span>HTML / JavaScript</span><b>已观测</b></div><button class="btn primary" onclick="go('evidence');closeDrawer()">查看证据链 →</button></div>`)}
function rows(type,name){let a= type==='IP'?['地址','104.18.32.10','版本','IPv4','ASN','AS13335','运营商','Cloudflare, Inc.','国家/地区','美国']:type==='ASN'?['ASN','AS13335','组织','Cloudflare, Inc.','前缀','104.16.0.0/13','国家/地区','美国']:type==='技术'?['技术名称',name,'类别','JavaScript 框架','版本','18.3.1','首次发现','2026-07-12','最近观测','2026-08-20']:type==='服务商'?['名称',name,'类型','CDN / 云服务','网站数量','4,820,113','最近观测','2026-08-20']:['实体名称',name,'记录数量','420,381','最近观测','2026-08-20'];let s='';for(let i=0;i<a.length;i+=2)s+=`<div class="line"><span class="label">${a[i]}</span><b>${a[i+1]}</b></div>`;return s}
function openWebsite(){closeDrawer();website()}
function home(){document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">网站数据智能平台</div><h1>看见一个网站，<br>也看见它背后的网络。</h1><p>SiteIntel 将网站、技术、IP、ASN、服务商、国家/地区、历史与证据连接起来。不是评分，而是让真实数据可以被持续探索。</p><div class="hero-actions"><button class="btn primary" onclick="website()">探索 example.com</button><button class="btn" onclick="go('explore')">浏览全球数据</button></div></section><div class="numbers">${stat('网站实体','12,842,392','已建立记录')}${stat('技术实体','42,731','已识别技术')}${stat('国家/地区','195','覆盖范围')}${stat('实体关系','86,421,902','网站与数据关系')}</div><div class="cols"><section class="section"><h3>正在发生的数据变化</h3><div class="line"><span>新增网站观测</span><b>126,842</b></div><div class="line"><span>新增技术关系</span><b>38,214</b></div><div class="line"><span>IP 地址变化</span><b>17,392</b></div><div class="line"><span>TLS 证书变化</span><b>8,421</b></div></section><section class="section"><h3>快速进入实体</h3><div class="line"><button class="entity" onclick="entity('React','技术')">React</button><span>1,284,392 个网站</span></div><div class="line"><button class="entity" onclick="entity('Cloudflare','服务商')">Cloudflare</button><span>4,820,113 个网站</span></div><div class="line"><button class="entity" onclick="entity('AS13335','ASN')">AS13335</button><span>2,103,442 个网站</span></div></section></div>`}
function website(){document.getElementById('app').innerHTML=title('example.com','网站数据总览 · 最近观测 2 分钟前')+`<section class="section"><div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-start"><div><h2 style="margin:0 0 4px">example.com</h2><div class="muted">美国 · Cloudflare · AS13335 · HTTPS</div></div><button class="btn" onclick="go('relations')">查看关系图</button></div><div class="numbers" style="margin-bottom:0">${stat('状态码','200')}${stat('IPv4','2')}${stat('IPv6','2')}${stat('HTTP','2 / 3')}</div></section><div class="tabs"><button class="tab on">概览</button><button class="tab" onclick="go('tech')">技术</button><button class="tab" onclick="go('ip')">IP</button><button class="tab" onclick="go('asn')">ASN</button><button class="tab" onclick="go('security')">安全</button><button class="tab" onclick="go('seo')">SEO</button><button class="tab" onclick="go('performance')">性能</button><button class="tab" onclick="go('history')">历史变化</button><button class="tab" onclick="go('evidence')">证据链</button></div><div class="cols"><div><section class="section"><h3>基本信息</h3>${line('规范域名','example.com')}${line('页面标题','Example Domain')}${line('HTTPS','已启用')}${line('HTTP/2','已启用')}${line('HTTP/3','已启用')}${line('最近观测','2026-08-20 13:24:18')}</section><section class="section"><h3>技术栈</h3>${techLine('React','18.3.1')}${techLine('Next.js','14.2.5')}${techLine('Nginx','1.27')}${techLine('Cloudflare','—')}</section></div><div><section class="section"><h3>基础设施</h3>${infra('IP 地址','104.18.32.10','IP')}${infra('IP 地址','104.18.33.10','IP')}${infra('ASN','AS13335','ASN')}${infra('服务商','Cloudflare','服务商')}${infra('国家/地区','美国','国家/地区')}</section><section class="section"><h3>最近变化</h3>${line('IP 地址','发生变化')}${line('技术','新增 React')}${line('证书','已更新')}<button class="btn" onclick="go('history')">查看完整历史 →</button></section></div></div>`}
function line(a,b){return `<div class="line"><span class="label">${a}</span><span>${b}</span></div>`}function techLine(a,b){return `<div class="line"><button class="entity" onclick="entity('${a}','技术')">${a}</button><span>${b}</span></div>`}function infra(a,b,t){return `<div class="line"><span class="label">${a}</span><button class="entity" onclick="entity('${b}','${t}')">${b}</button></div>`}
function explore(){document.getElementById('app').innerHTML=title('探索','从网站进入技术、IP、ASN、服务商和国家/地区，继续下钻。')+`<section class="section"><div class="line"><b>全球网站记录</b><span class="muted">12,842,392</span></div><div class="cols3">${['example.com','shop.example','news.example','app.example','docs.example','media.example'].map((x,i)=>`<section class="section"><button class="entity" onclick="website()">${x}</button><div class="muted small">${i%2?'新加坡':'美国'} · ${i%2?'AWS':'Cloudflare'}</div><div style="margin-top:10px"><span class="tag">${i%2?'Next.js':'React'}</span><span class="tag">HTTPS</span></div><div class="line"><span>状态码</span><b>200</b></div><div class="line"><span>IP</span><button class="entity" onclick="entity('104.18.32.10','IP 地址')">104.18.32.10</button></div></section>`).join('')}</div></section>`}
function websites(){document.getElementById('app').innerHTML=title('网站','网站实体及其基础数据。')+`<section class="section table-scroll"><table><tr><th>网站</th><th>国家/地区</th><th>状态码</th><th>技术</th><th>服务商</th><th>最近观测</th></tr>${['example.com','shop.example','news.example','app.example','docs.example'].map((x,i)=>`<tr><td><button class="entity" onclick="website()">${x}</button></td><td>${i%2?'新加坡':'美国'}</td><td>200</td><td><button class="entity" onclick="entity('${i%2?'Next.js':'React'}','技术')">${i%2?'Next.js':'React'}</button></td><td>${i%2?'AWS':'Cloudflare'}</td><td>2 分钟前</td></tr>`).join('')}</table></section>`}
function tech(){document.getElementById('app').innerHTML=title('技术','技术名称、版本、识别时间与使用关系。')+`<div class="cols3">${[['React','18.3.1','1,284,392'],['Next.js','14.2.5','842,381'],['TypeScript','5.5.4','721,104'],['Nginx','1.27','3,102,445'],['Cloudflare','—','4,820,113'],['WordPress','6.6','2,914,802']].map(x=>`<section class="section"><button class="entity" onclick="entity('${x[0]}','技术')">${x[0]}</button><div class="line"><span>版本</span><b>${x[1]}</b></div><div class="line"><span>网站数量</span><b>${x[2]}</b></div><div class="line"><span>最近观测</span><span>今天</span></div></section>`).join('')}</div>`}
function dataPage(kind){let config={security:['安全','TLS、响应头、Cookie 等实际观测参数。',[['TLS 版本','TLS 1.3','协议'],['HSTS','已启用','响应头'],['CSP','存在','响应头'],['安全 Cookie','12 个','Cookie']]],seo:['SEO','页面索引相关的实际参数。',[['Title','Example Domain','HTML'],['Title 长度','13','字符'],['Canonical','https://example.com/','HTML'],['Sitemap','/sitemap.xml','页面'],['H1','1','HTML'],['图片','28','页面资源'],['无 ALT 图片','3','HTML']]],performance:['性能','网络和页面性能观测值。',[['LCP','2.1 秒','性能观测'],['INP','180 毫秒','性能观测'],['CLS','0.04','性能观测'],['TTFB','420 毫秒','网络观测'],['页面大小','1.82 MB','资源统计']]][kind];document.getElementById('app').innerHTML=title(config[0],config[1])+`<section class="section table-scroll"><table><tr><th>参数</th><th>实际数据</th><th>来源</th><th>观测时间</th></tr>${config[2].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>2026-08-20 13:24:18</td></tr>`).join('')}</table></section><section class="section"><h3>数据来源</h3>${line('来源','网站实时观测')}${line('最后更新','2 分钟前')}<button class="btn" onclick="go('evidence')">查看证据链 →</button></section>`}
function relations(){document.getElementById('app').innerHTML=title('关系图','从一个网站看到它连接的实体网络。')+`<section class="section"><div class="graph"><svg viewBox="0 0 1000 470" preserveAspectRatio="none"><g stroke="#cfd6e2" stroke-width="1.5"><line x1="500" y1="235" x2="190" y2="110"/><line x1="500" y1="235" x2="810" y2="110"/><line x1="500" y1="235" x2="190" y2="360"/><line x1="500" y1="235" x2="810" y2="360"/><line x1="500" y1="235" x2="500" y2="55"/></g></svg><button class="node main" style="left:50%;top:50%" onclick="website()">example.com</button><button class="node" style="left:19%;top:23%" onclick="entity('React','技术')">React</button><button class="node" style="left:81%;top:23%" onclick="entity('Cloudflare','服务商')">Cloudflare</button><button class="node" style="left:19%;top:77%" onclick="entity('104.18.32.10','IP 地址')">104.18.32.10</button><button class="node" style="left:81%;top:77%" onclick="entity('AS13335','ASN')">AS13335</button><button class="node" style="left:50%;top:12%" onclick="entity('美国','国家/地区')">美国</button></div></section>`}
