tion:absolute;right:0;top:0;height:100%;width:min(680px,94vw);background:#fff;padding:28px;overflow:auto}.close{float:right;border:0;background:none;font-size:26px;cursor:pointer}.bottom{display:none}.hide-mobile{display:block}.desktop-note{display:block}.kpi-label{font-size:12px;color:var(--muted)}@media(max-width:1200px){:root{--nav:220px}.main{padding:24px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:34px}}

t='⌕ '+(lang==='zh'?'搜索网站、域名、IP、ASN、技术……':'Search websites, domains, IPs, ASNs, technologies…');document.getElementById('side').innerHTML=side();document.getElementById('bottom').innerHTML=`<button onclick="go('overview')">${L('home')}</button><button onclick="search()">${L('search')}</button><button onclick="go('explore')">${L('explore')}</button><button onclick="go('compare')">${L('compare')}</button><button onclick="go('reports')">${L('more')}</button>`}function set(x){document.getElementById('app').innerHTML=x}function head(t,s){return `<div style="margin-bottom:18px"><div class="muted">SiteIntel / ${L('global')}</div><h2 style="font-size:29px;margin:3px 0">${t}</h2><div class="muted">${s}</div></div>`}function card(a,b,c=''){return `<div class="card"><div class="muted">${a}</div><div class="metric">${b}</div><div class="muted">${c}</div></div>`}function ent(n,t){return `<button class="entity" onclick="entity('${t}','${String(n).replace(/'/g,"\\'")}')">${n}</button>`}
function home(){set(`<section class="hero"><div class="muted">网站数据智能平台</div><h1>理解任何网站。</h1><p>从网站、技术、IP、ASN、服务商、国家/地区到证据链，建立可以持续下钻的全球数据关系网络。</p><div class="actions"><button class="btn primary" onclick="entity('Website','example.com')">分析 example.com</button><button class="btn" onclick="go('explore')">开始探索</button></div></section><div class="grid g4">${card('网站实体','12,842,392','已建立网站记录')}${card('技术实体','42,731','已识别技术指纹')}${card('国家/地区','195','覆盖国家和地区')}${card('实体关系','86,421,902','网站、技术、IP、ASN等关系')}</div><div class="grid g2"><div class="card"><div class="ct">快速探索</div><div class="row">${ent('React','Technology')}<span>1,284,392 个网站</span></div><div class="row">${ent('Cloudflare','Provider')}<span>4,820,113 个网站</span></div><div class="row">${ent('美国','Country')}<span>420,381 个网站</span></div><div class="row">${ent('AS13335','ASN')}<span>2,103,442 个网站</span></div></div><div class="card"><div class="ct">最近数据变化</div><div class="row"><span>新增网站观测</span><b>126,842</b></div><div class="row"><span>新增技术关系</span><b>38,214</b></div><div class="row"><span>IP变化记录</span><b>17,392</b></div><div class="row"><span>证书变化</span><b>8,421</b></div></div></div>`)}

function websiteDetail(){set(head('example.com','网站数据总览 · 最近观测 2 分钟前')+`<div class="hero"><h2 style="margin-top:0">example.com</h2><div class="muted">Example Company · ${ent('美国','Country')} · HTTPS</div><div class="grid g4" style="margin-top:16px"><div><span class="muted">状态码</span><div class="metric">200</div></div><div><span class="muted">协议</span><div class="metric">HTTP/2</div></div><div><span class="muted">IPv4</span><div class="metric">2</div></div><div><span class="muted">IPv6</span><div class="metric">2</div></div></div></div><div class="tabs"><button class="tab on">概览</button><button class="tab" onclick="entity('Technology','React')">技术</button><button class="tab" onclick="entity('IP','104.18.32.10')">IP</button><button class="tab" onclick="entity('ASN','AS13335')">ASN</button><button class="tab" onclick="go('security')">安全</button><button class="tab" onclick="go('seo')">SEO</button><button class="tab" onclick="go('performance')">性能</button><button class="tab" onclick="go('history')">历史变化</button><button class="tab" onclick="go('evidence')">证据链</button><button class="tab" onclick="go('relations')">关系图</button></div><div class="grid detail-grid"><div><div class="card"><div class="ct">基本信息</div><div class="row"><span>规范域名</span><b>example.com</b></div><div class="row"><span>页面标题</span><span>Example Domain</span></div><div class="row"><span>HTTPS</span><b class="good">已启用</b></div><div class="row"><span>HTTP/3</span><b class="good">已启用</b></div><div class="row"><span>最近观测</span><span>2026-08-20 13:24:18</span></div></div><div class="grid g3"><div class="card"><div class="ct">安全数据</div><div class="row"><span>TLS</span><b>TLS 1.3</b></div><div class="row"><span>HSTS</span><b>已启用</b></div><button class="btn" onclick="go('security')">查看全部 →</button></div><div class="card"><div class="ct">SEO 数据</div><div class="row"><span>Title</span><b>存在</b></div><div class="row"><span>Canonical</span><b>存在</b></div><button class="btn" onclick="go('seo')">查看全部 →</button></div><div class="card"><div class="ct">性能数据</div><div class="row"><span>LCP</span><b>2.1 秒</b></div><div class="row"><span>TTFB</span><b>420 毫秒</b></div><button class="btn" onclick="go('performance')">查看全部 →</button></div></div></div><div><div class="card"><div class="ct">基础设施</div><div class="row">IPv4 ${ent('104.18.32.10','IP')}</div><div class="row">IPv4 ${ent('104.18.33.10','IP')}</div><div class="row">ASN ${ent('AS13335','ASN')}</div><div class="row">服务商 ${ent('Cloudflare','Provider')}</div><div class="row">国家/地区 ${ent('美国','Country')}</div></div><div class="card"><div class="ct">最近变化</div><div class="row"><span>IP地址</span><b>发生变化</b></div><div class="row"><span>技术</span><b>新增 React</b></div><div class="row"><span>证书</span><b>已更新</b></div><button class="btn" onclick="go('history')">查看历史 →</button></div></div></div>`)}
