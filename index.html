<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteIntel 2.0 Prototype</title><style>:root{--bg:#f5f7fb;--p:#fff;--t:#111827;--m:#667085;--l:#e5e7eb;--a:#2563eb;--s:#eff6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{height:64px;background:var(--p);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:5}.logo{font-size:19px;font-weight:800}.logo b{color:var(--a)}.search{flex:1;max-width:680px;border:1px solid var(--l);background:var(--bg);border-radius:10px;padding:11px 14px;color:var(--m);cursor:pointer}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}aside{background:var(--p);border-right:1px solid var(--l);padding:16px 12px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;color:var(--t);cursor:pointer}.nav:hover,.nav.on{background:var(--s);color:var(--a);font-weight:700}.group{font-size:11px;color:var(--m);margin:15px 8px 6px;text-transform:uppercase}.main{width:min(1500px,100%);padding:28px;margin:auto}.hero,.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:18px;margin-bottom:14px}.hero{padding:30px;background:linear-gradient(135deg,var(--p),var(--s))}.hero h1{font-size:35px;margin:5px 0}.muted{color:var(--m)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.metric{font-size:27px;font-weight:800;margin:5px 0}.ct{font-weight:750;margin-bottom:10px}.entity{border:0;background:none;color:var(--a);font-weight:700;cursor:pointer;padding:0}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--l);gap:12px}.row:last-child{border:0}.btn{border:1px solid var(--l);background:var(--p);border-radius:9px;padding:9px 13px;cursor:pointer}.primary{background:var(--a);color:white;border-color:var(--a)}.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--l);margin-bottom:15px}.tab{border:0;background:none;padding:10px 13px;color:var(--m);white-space:nowrap;cursor:pointer}.tab.on{color:var(--a);font-weight:700;border-bottom:2px solid var(--a)}.graph{height:330px;position:relative;background:radial-gradient(circle,var(--s),var(--bg) 60%);border:1px solid var(--l);border-radius:12px}.node{position:absolute;transform:translate(-50%,-50%);padding:9px 12px;background:var(--p);border:1px solid var(--l);border-radius:9px;color:var(--a);font-weight:700;cursor:pointer}.drawer{display:none;position:fixed;inset:0;background:#0008;z-index:20}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(560px,94%);background:var(--p);padding:24px;overflow:auto}.close{float:right;border:0;background:none;font-size:22px;cursor:pointer}.bottom{display:none}@media(max-width:800px){.layout{display:block}aside{display:none}.main{padding:16px 13px 76px}.g4,.g3,.g2{grid-template-columns:1fr}.hero h1{font-size:29px}.top{padding:0 13px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--p);border-top:1px solid var(--l);z-index:10}.bottom button{border:0;background:none;color:var(--m)} }</style><body><header class="top"><div class="logo">Site<b>Intel</b></div><div class="search" onclick="search()">⌕ Search websites, IPs, technologies, ASN...</div><button class="btn" onclick="document.body.style.filter=document.body.style.filter?'':'invert(.92)'">◐</button></header><div class="layout"><aside><div class="group">Intelligence</div><button class="nav on" onclick="home()">Overview</button><button class="nav" onclick="explore()">Explore</button><button class="nav" onclick="website()">Websites</button><button class="nav" onclick="technology()">Technologies</button><div class="group">Infrastructure</div><button class="nav" onclick="detail('IP','104.18.32.10')">IPs</button><button class="nav" onclick="detail('ASN','AS13335')">ASNs</button><button class="nav" onclick="detail('Provider','Cloudflare')">Providers</button><div class="group">Global</div><button class="nav" onclick="detail('Country','Singapore')">Countries</button><button class="nav" onclick="quality('Security')">Security</button><button class="nav" onclick="quality('SEO')">SEO</button><button class="nav" onclick="quality('Performance')">Performance</button><div class="group">Workspace</div><button class="nav" onclick="compare()">Compare</button><button class="nav" onclick="reports()">Reports</button></aside><main class="main" id="app"></main></div><nav class="bottom"><button onclick="home()">Home</button><button onclick="search()">Search</button><button onclick="explore()">Explore</button><button onclick="compare()">Compare</button><button onclick="reports()">More</button></nav><div class="drawer" id="drawer" onclick="if(event.target.id==='drawer')closeD()"><section class="panel"><button class="close" onclick="closeD()">×</button><div id="detail"></div></section></div><script>const e=(x,t)=>`<button class="entity" onclick="detail('${t}','${x}')">${x}</button>`;const m=(a,b,c)=>`<div class="card"><div class="muted">${a}</div><div class="metric">${b}</div><div class="muted">${c}</div></div>`;function set(x){document.getElementById('app').innerHTML=x}function home(){set(`<section class="hero"><div class="muted">WEBSITE DATA INTELLIGENCE PLATFORM</div><h1>Understand any website.</h1><div class="muted">从 Website、Technology、IP、ASN、Provider、Country 到 Evidence 建立完整可探索关系。</div><p><button class="btn primary" onclick="website()">Analyze example.com</button> <button class="btn" onclick="explore()">Explore global data</button></p></section><div class="grid g4">${m('Websites','12.8M','globally observed')}${m('Technologies','42.7K','fingerprints')}${m('Countries','195','coverage')}${m('Relationships','86.4M','connected entities')}</div><div class="grid g2"><div class="card"><div class="ct">Quick Explore</div><div class="row">${e('React','Technology')}<span>1.28M websites</span></div><div class="row">${e('Cloudflare','Provider')}<span>4.82M websites</span></div><div class="row">${e('Singapore','Country')}<span>420K websites</span></div><div class="row">${e('AS13335','ASN')}<span>2.1M websites</span></div></div><div class="card"><div class="ct">Intelligence Trend</div><div class="metric">+12.4%</div><div class="muted">Technology adoption · 30 days</div><div style="height:110px;margin-top:15px;display:flex;align-items:end;gap:7px">${[30,42,35,54,48,62,58,75,70,84,80,100].map(x=>`<i style="height:${x}%;flex:1;background:var(--a);opacity:.7;border-radius:5px"></i>`).join('')}</div></div></div>`)}function head(t,s){return `<div style="margin-bottom:18px"><div class="muted">SiteIntel / Intelligence</div><h2 style="font-size:29px;margin:3px 0">${t}</h2><div class="muted">${s}</div></div>`}function explore(){set(head('Explore','Browse and filter global intelligence')+`<div class="card"><div class="row"><b>12,842,392 results</b><span class="muted">Relevance ▾ · Cards · Table · Graph</span></div><div class="grid g2">${['example.com','shop.example','news.example','app.example','docs.example','media.example'].map((x,i)=>`<div class="card"><div>${e(x,'Website')}</div><div class="muted">${i%2?'Singapore':'United States'} · ${e(i%2?'AWS':'Cloudflare','Provider')}</div><div style="margin-top:8px">${e(i%2?'Next.js':'React','Technology')}</div><div class="muted" style="margin-top:8px">Security ${88+i} · SEO ${78+i} · Performance ${74+i}</div></div>`).join('')}</div></div>`)}function website(){set(head('example.com','Website Intelligence · last analyzed 2 minutes ago')+`<div class="hero"><b>example.com</b><div class="muted">Example Company · ${e('United States','Country')} · 200 OK · HTTPS</div><div class="metric">84 / 100</div></div><div class="tabs"><button class="tab on">Overview</button><button class="tab" onclick="quality('Technologies')">Technologies</button><button class="tab" onclick="detail('Infrastructure','example.com')">Infrastructure</button><button class="tab" onclick="detail('DNS','example.com')">DNS</button><button class="tab" onclick="quality('Security')">Security</button><button class="tab" onclick="quality('SEO')">SEO</button><button class="tab" onclick="quality('Performance')">Performance</button><button class="tab" onclick="history()">Changes</button><button class="tab" onclick="evidence()">Evidence</button><button class="tab" onclick="relations()">Graph</button></div><div class="grid g4">${m('Technology','92','24 detected')}${m('Infrastructure','88','2 IP · 1 ASN')}${m('Security','91','0 critical')}${m('Performance','76','LCP 2.1s')}</div><div class="grid g2"><div class="card"><div class="ct">Technology Stack</div><div class="row">${e('React','Technology')}<b>98%</b></div><div class="row">${e('Next.js','Technology')}<b>96%</b></div><div class="row">${e('Nginx','Technology')}<b>91%</b></div></div><div class="card"><div class="ct">Infrastructure</div><div class="row">IP ${e('104.18.32.10','IP')}</div><div class="row">ASN ${e('AS13335','ASN')}</div><div class="row">Provider ${e('Cloudflare','Provider')}</div><div class="row">Country ${e('United States','Country')}</div></div></div><div class="grid g3">${qualityCard('Security','91','HSTS ✓ · TLS ✓ · CSP ⚠')}${qualityCard('SEO','82','Title ✓ · Canonical ✓ · Schema ⚠')}${qualityCard('Performance','76','LCP 2.1s · INP 180ms · CLS 0.08')}</div>`)}function qualityCard(a,b,c){return `<div class="card" onclick="quality('${a}')" style="cursor:pointer"><div class="ct">${a}</div><div class="metric">${b}</div><div class="muted">${c}</div></div>`}function technology(){set(head('React','Technology Intelligence')+`<div class="grid g4">${m('Websites','1.28M','+12.4% 30D')}${m('Countries','180','global')}${m('First Seen','2013','observed history')}${m('Confidence','98%','3 signals')}</div><div class="grid g2"><div class="card"><div class="ct">Adoption Trend</div><div class="metric">+12.4%</div><div class="muted">30D growth</div></div><div class="card"><div class="ct">Related Technologies</div><div class="row">${e('Next.js','Technology')}<span>840K</span></div><div class="row">${e('TypeScript','Technology')}<span>1.1M</span></div><div class="row">${e('Redux','Technology')}<span>420K</span></div></div></div>`)}function detail(t,n){open(`<div class="muted">ENTITY DETAIL</div><h1>${n}</h1><p>${t} Intelligence · global observations</p><div class="grid g2">${m('Websites','327K','associated')}${m('Countries','180','coverage')}${m('Confidence','98%','current')}${m('Last Seen','2 min','ago')}</div><h3>Relationships</h3><div class="row">Website → ${e('example.com','Website')}</div><div class="row">Technology → ${e('React','Technology')}</div><div class="row">Provider → ${e('Cloudflare','Provider')}</div><div class="row">Country → ${e('Singapore','Country')}</div><h3>Evidence</h3><div class="row">HTTP Header <span>99%</span></div><div class="row">DNS Observation <span>98%</span></div><div class="row">Historical Record <span>97%</span></div>`)}function quality(t){open(`<div class="muted">FINDING / METRIC DETAIL</div><h1>${t}</h1><p>Signals, findings, evidence and recommendations</p><div class="metric">91 / 100</div><div class="row"><span>Missing Content-Security-Policy</span><b>Medium</b></div><div class="row"><span>Structured data incomplete</span><b>Low</b></div><div class="row"><span>LCP above target</span><b>Low</b></div><h3>Evidence Chain</h3><div class="row">HTTP Header → Source → Observation → Timestamp</div><div class="row">HTML → Source → Observation → Confidence 98%</div><button class="btn primary" onclick="evidence()">Open Evidence</button>`)}function evidence(){open(`<div class="muted">EVIDENCE</div><h1>Evidence Chain</h1><div class="row">Source Type <b>HTTP Header</b></div><div class="row">Endpoint <b>https://example.com</b></div><div class="row">Observation <b>Cloudflare detected</b></div><div class="row">Timestamp <b>2026-08-19 13:20 UTC</b></div><div class="row">Confidence <b>99%</b></div><h3>Related</h3><div class="row">Finding → ${e('CSP Warning','Finding')}</div><div class="row">Provider → ${e('Cloudflare','Provider')}</div>`)}function history(){open(`<div class="muted">HISTORY / CHANGES</div><h1>example.com Changes</h1>${['React detected','IP changed','Provider changed','TLS certificate renewed'].map((x,i)=>`<div class="row"><div><b>${x}</b><div class="muted">Aug ${19-i}, 2026 · Evidence verified</div></div><span>→</span></div>`).join('')}`)}function relations(){set(head('Relationship Explorer','Click any node to continue exploration')+`<div class="card"><div class="graph"><div class="node" style="left:50%;top:50%" onclick="website()">example.com</div><div class="node" style="left:20%;top:24%" onclick="detail('Technology','React')">React</div><div class="node" style="left:80%;top:24%" onclick="detail('Provider','Cloudflare')">Cloudflare</div><div class="node" style="left:20%;top:76%" onclick="detail('IP','104.18.32.10')">104.18.32.10</div><div class="node" style="left:80%;top:76%" onclick="detail('ASN','AS13335')">AS13335</div></div></div>`)}function compare(){set(head('Compare','Compare entities side by side')+`<div class="card"><div class="row"><b>Metric</b><b>example.com</b><b>shop.example</b></div>${[['Security','91','78'],['SEO','82','89'],['Performance','76','81'],['Provider','Cloudflare','AWS'],['Country','United States','Singapore']].map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span><span>${r[2]}</span></div>`).join('')}</div>`)}function reports(){set(head('Reports','Saved intelligence reports')+`<div class="grid g2"><div class="card"><h3>example.com Intelligence</h3><div class="muted">Technology · Infrastructure · Security · SEO</div><button class="entity" onclick="website()">Open →</button></div><div class="card"><h3>Singapore Web Intelligence</h3><div class="muted">Websites · Technologies · Providers · Trends</div><button class="entity" onclick="detail('Country','Singapore')">Open →</button></div></div>`)}function open(x){document.getElementById('detail').innerHTML=x;document.getElementById('drawer').classList.add('open')}function closeD(){document.getElementById('drawer').classList.remove('open')}function search(){let q=prompt('Search entity / domain / IP / ASN / technology');if(q)detail('Search Result',q)}home()</script></body></html>
