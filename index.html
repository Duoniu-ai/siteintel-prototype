<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteIntel 2.0 Prototype</title><style>:root{--bg:#f5f7fb;--p:#fff;--t:#111827;--m:#667085;--l:#e5e7eb;--a:#2563eb;--s:#eff6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{height:64px;background:var(--p);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:5}.logo{font-size:19px;font-weight:800}.logo b{color:var(--a)}.search{flex:1;max-width:680px;border:1px solid var(--l);background:var(--bg);border-radius:10px;padding:11px 14px;color:var(--m);cursor:pointer}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}aside{background:var(--p);border-right:1px solid var(--l);padding:16px 12px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;color:var(--t);cursor:pointer}.nav:hover,.nav.on{background:var(--s);color:var(--a);font-weight:700}.group{font-size:11px;color:var(--m);margin:15px 8px 6px;text-transform:uppercase}.main{width:min(1500px,100%);padding:28px;margin:auto}.hero,.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:18px;margin-bottom:14px}.hero{padding:30px;background:linear-gradient(135deg,var(--p),var(--s))}.hero h1{font-size:35px;margin:5px 0}.muted{color:var(--m)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.metric{font-size:27px;font-weight:800;margin:5px 0}.ct{font-weight:750;margin-bottom:10px}.entity{border:0;background:none;color:var(--a);font-weight:700;cursor:pointer;padding:0}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--l);gap:12px}.row:last-child{border:0}.btn{border:1px solid var(--l);background:var(--p);border-radius:9px;padding:9px 13px;cursor:pointer}.primary{background:var(--a);color:white;border-color:var(--a)}.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--l);margin-bottom:15px}.tab{border:0;background:none;padding:10px 13px;color:var(--m);white-space:nowrap;cursor:pointer}.tab.on{color:var(--a);font-weight:700;border-bottom:2px solid var(--a)}.graph{height:330px;position:relative;background:radial-gradient(circle,var(--s),var(--bg) 60%);border:1px solid var(--l);border-radius:12px}.node{position:absolute;transform:translate(-50%,-50%);padding:9px 12px;background:var(--p);border:1px solid var(--l);border-radius:9px;color:var(--a);font-weight:700;cursor:pointer}.drawer{display:none;position:fixed;inset:0;background:#0008;z-index:20}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(560px,94%);background:var(--p);padding:24px;overflow:auto}.close{float:right;border:0;background:none;font-size:22px;cursor:pointer}.bottom{display:none}@media(max-width:800px){.layout{display:block}aside{display:none}.main{padding:16px 13px 76px}.g4,.g3,.g2{grid-template-columns:1fr}.hero h1{font-size:29px}.top{padding:0 13px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--p);border-top:1px solid var(--l);z-index:10}.bottom button{border:0;background:none;color:var(--m)}} </style></head><body><header class="top"><div class="logo">Site<b>Intel</b></div><div class="search" id="search" onclick="search()">⌕ 搜索网站、IP、技术、ASN...</div><button class="btn" id="lang" onclick="toggleLang()">EN</button><button class="btn" onclick="document.body.style.filter=document.body.style.filter?'':'invert(.92)'">◐</button></header><div class="layout"><aside><div class="group" data-i="intel">情报</div><button class="nav on" onclick="home()" data-i="overview">总览</button><button class="nav" onclick="explore()" data-i="explore">探索</button><button class="nav" onclick="website()" data-i="websites">网站</button><button class="nav" onclick="technology()" data-i="technologies">技术</button><div class="group" data-i="infra">基础设施</div><button class="nav" onclick="detail('IP','104.18.32.10')">IP</button><button class="nav" onclick="detail('ASN','AS13335')">ASN</button><button class="nav" onclick="detail('Provider','Cloudflare')" data-i="providers">服务商</button><div class="group" data-i="global">全球</div><button class="nav" onclick="detail('Country','Singapore')" data-i="countries">国家/地区</button><button class="nav" onclick="quality('Security')" data-i="security">安全</button><button class="nav" onclick="quality('SEO')">SEO</button><button class="nav" onclick="quality('Performance')" data-i="performance">性能</button><div class="group" data-i="workspace">工作台</div><button class="nav" onclick="compare()" data-i="compare">对比</button><button class="nav" onclick="reports()" data-i="reports">报告</button></aside><main class="main" id="app"></main></div><nav class="bottom"><button onclick="home()" data-i="home">首页</button><button onclick="search()" data-i="searchNav">搜索</button><button onclick="explore()" data-i="exploreNav">探索</button><button onclick="compare()" data-i="compareNav">对比</button><button onclick="reports()" data-i="more">更多</button></nav><div class="drawer" id="drawer" onclick="if(event.target.id==='drawer')closeD()"><section class="panel"><button class="close" onclick="closeD()">×</button><div id="detail"></div></section></div><script>let lang='zh';const Z={intel:'情报',overview:'总览',explore:'探索',websites:'网站',technologies:'技术',infra:'基础设施',providers:'服务商',global:'全球',countries:'国家/地区',security:'安全',performance:'性能',workspace:'工作台',compare:'对比',reports:'报告',home:'首页',searchNav:'搜索',exploreNav:'探索',compareNav:'对比',more:'更多'};const E={intel:'Intelligence',overview:'Overview',explore:'Explore',websites:'Websites',technologies:'Technologies',infra:'Infrastructure',providers:'Providers',global:'Global',countries:'Countries',security:'Security',performance:'Performance',workspace:'Workspace',compare:'Compare',reports:'Reports',home:'Home',searchNav:'Search',exploreNav:'Explore',compareNav:'Compare',more:'More'};function toggleLang(){lang=lang==='zh'?'en':'zh';document.querySelectorAll('[data-i]').forEach(x=>x.textContent=(lang==='zh'?Z:E)[x.dataset.i]);document.getElementById('lang').textContent=lang==='zh'?'EN':'中';document.getElementById('search').textContent=lang==='zh'?'⌕ 搜索网站、IP、技术、ASN...':'⌕ Search websites, IPs, technologies, ASN...';home()}function e(x,t){return `<button class="entity" onclick="detail('${t}','${x}')">${x}</button>`}function m(a,b,c){return `<div class="card"><div class="muted">${a}</div><div class="metric">${b}</div><div class="muted">${c}</div></div>`}function set(x){document.getElementById('app').innerHTML=x}function home(){set(`<section class="hero"><div class="muted">${lang==='zh'?'网站数据智能平台':'WEBSITE DATA INTELLIGENCE PLATFORM'}</div><h1>${lang==='zh'?'理解任何网站。':'Understand any website.'}</h1><div class="muted">${lang==='zh'?'从网站、技术、IP、ASN、服务商、国家/地区到证据链，建立完整可探索关系。':'Explore relationships across websites, technologies, IPs, ASNs, providers, countries and evidence.'}</div><p><button class="btn primary" onclick="website()">${lang==='zh'?'分析 example.com':'Analyze example.com'}</button> <button class="btn" onclick="explore()">${lang==='zh'?'探索全球数据':'Explore global data'}</button></p></section><div class="grid g4">${m(lang==='zh'?'网站':'Websites','12.8M',lang==='zh'?'全球观测':'globally observed')}${m(lang==='zh'?'技术':'Technologies','42.7K',lang==='zh'?'指纹':'fingerprints')}${m(lang==='zh'?'国家/地区':'Countries','195',lang==='zh'?'覆盖':'coverage')}${m(lang==='zh'?'关系':'Relationships','86.4M',lang==='zh'?'关联实体':'connected entities')}</div><div class="grid g2"><div class="card"><div class="ct">${lang==='zh'?'快速探索':'Quick Explore'}</div><div class="row">${e('React','Technology')}<span>1.28M websites</span></div><div class="row">${e('Cloudflare','Provider')}<span>4.82M websites</span></div><div class="row">${e('Singapore','Country')}<span>420K websites</span></div><div class="row">${e('AS13335','ASN')}<span>2.1M websites</span></div></div><div class="card"><div class="ct">${lang==='zh'?'情报趋势':'Intelligence Trend'}</div><div class="metric">+12.4%</div><div class="muted">${lang==='zh'?'技术采用率 · 30天':'Technology adoption · 30 days'}</div><div style="height:110px;margin-top:15px;display:flex;align-items:end;gap:7px">${[30,42,35,54,48,62,58,75,70,84,80,100].map(x=>`<i style="height:${x}%;flex:1;background:var(--a);opacity:.7;border-radius:5px"></i>`).join('')}</div></div></div>`)}function head(t,s){return `<div style="margin-bottom:18px"><div class="muted">SiteIntel / ${lang==='zh'?'情报':'Intelligence'}</div><h2 style="font-size:29px;margin:3px 0">${t}</h2><div class="muted">${s}</div></div>`}function explore(){set(head(lang==='zh'?'探索':'Explore',lang==='zh'?'浏览和筛选全球网站情报':'Browse and filter global intelligence')+`<div class="card"><div class="row"><b>12,842,392 ${lang==='zh'?'条结果':'results'}</b><span class="muted">${lang==='zh'?'相关性 · 卡片 · 表格 · 图谱':'Relevance · Cards · Table · Graph'}</span></div><div class="grid g2">${['example.com','shop.example','news.example','app.example','docs.example','media.example'].map((x,i)=>`<div class="card"><div>${e(x,'Website')}</div><div class="muted">${i%2?'Singapore':'United States'} · ${e(i%2?'AWS':'Cloudflare','Provider')}</div><div style="margin-top:8px">${e(i%2?'Next.js':'React','Technology')}</div><div class="muted" style="margin-top:8px">${lang==='zh'?'安全':'Security'} ${88+i} · SEO ${78+i} · ${lang==='zh'?'性能':'Performance'} ${74+i}</div></div>`).join('')}</div></div>`)}function website(){set(head('example.com',lang==='zh'?'网站智能 · 2分钟前分析':'Website Intelligence · last analyzed 2 minutes ago')+`<div class="hero"><b>example.com</b><div class="muted">Example Company · ${e(lang==='zh'?'美国':'United States','Country')} · 200 OK · HTTPS</div><div class="metric">84 / 100</div></div><div class="tabs"><button class="tab on">${lang==='zh'?'总览':'Overview'}</button><button class="tab" onclick="quality('Technologies')">${lang==='zh'?'技术':'Technologies'}</button><button class="tab" onclick="detail('Infrastructure','example.com')">${lang==='zh'?'基础设施':'Infrastructure'}</button><button class="tab" onclick="detail('DNS','example.com')">DNS</button><button class="tab" onclick="quality('Security')">${lang==='zh'?'安全':'Security'}</button><button class="tab" onclick="quality('SEO')">SEO</button><button class="tab" onclick="quality('Performance')">${lang==='zh'?'性能':'Performance'}</button><button class="tab" onclick="history()">${lang==='zh'?'变化':'Changes'}</button><button class="tab" onclick="evidence()">${lang==='zh'?'证据':'Evidence'}</button><button class="tab" onclick="relations()">${lang==='zh'?'关系图':'Graph'}</button></div><div class="grid g4">${m(lang==='zh'?'技术':'Technology','92',lang==='zh'?'24项检测':'24 detected')}${m(lang==='zh'?'基础设施':'Infrastructure','88','2 IP · 1 ASN')}${m(lang==='zh'?'安全':'Security','91',lang==='zh'?'0个严重问题':'0 critical')}${m(lang==='zh'?'性能':'Performance','76','LCP 2.1s')}</div><div class="grid g2"><div class="card"><div class="ct">${lang==='zh'?'技术栈':'Technology Stack'}</div><div class="row">${e('React','Technology')}<b>98%</b></div><div class="row">${e('Next.js','Technology')}<b>96%</b></div><div class="row">${e('Nginx','Technology')}<b>91%</b></div></div><div class="card"><div class="ct">${lang==='zh'?'基础设施':'Infrastructure'}</div><div class="row">IP ${e('104.18.32.10','IP')}</div><div class="row">ASN ${e('AS13335','ASN')}</div><div class="row">${lang==='zh'?'服务商':'Provider'} ${e('Cloudflare','Provider')}</div><div class="row">${lang==='zh'?'国家/地区':'Country'} ${e(lang==='zh'?'美国':'United States','Country')}</div></div></div><div class="grid g3">${qc(lang==='zh'?'安全':'Security','91','HSTS ✓ · TLS ✓ · CSP ⚠')}${qc('SEO','82','Title ✓ · Canonical ✓ · Schema ⚠')}${qc(lang==='zh'?'性能':'Performance','76','LCP 2.1s · INP 180ms · CLS 0.08')}</div>`)}function qc(a,b,c){return `<div class="card" onclick="quality('${a}')" style="cursor:pointer"><div class="ct">${a}</div><div class="metric">${b}</div><div class="muted">${c}</div></div>`}function technology(){set(head('React',lang==='zh'?'技术情报':'Technology Intelligence')+`<div class="grid g4">${m(lang==='zh'?'网站':'Websites','1.28M','+12.4% 30D')}${m(lang==='zh'?'国家/地区':'Countries','180',lang==='zh'?'全球':'global')}${m(lang==='zh'?'首次发现':'First Seen','2013',lang==='zh'?'观测历史':'observed history')}${m(lang==='zh'?'置信度':'Confidence','98%','3 signals')}</div><div class="grid g2"><div class="card"><div class="ct">${lang==='zh'?'采用趋势':'Adoption Trend'}</div><div class="metric">+12.4%</div><div class="muted">30D growth</div></div><div class="card"><div class="ct">${lang==='zh'?'相关技术':'Related Technologies'}</div><div class="row">${e('Next.js','Technology')}<span>840K</span></div><div class="row">${e('TypeScript','Technology')}<span>1.1M</span></div><div class="row">${e('Redux','Technology')}<span>420K</span></div></div></div>`)}function detail(t,n){open(`<div class="muted">${lang==='zh'?'实体详情':'ENTITY DETAIL'}</div><h1>${n}</h1><p>${t} ${lang==='zh'?'情报 · 全球观测':'Intelligence · global observations'}</p><div class="grid g2">${m(lang==='zh'?'关联网站':'Websites','327K',lang==='zh'?'关联':'associated')}${m(lang==='zh'?'国家/地区':'Countries','180',lang==='zh'?'覆盖':'coverage')}${m(lang==='zh'?'置信度':'Confidence','98%','current')}${m(lang==='zh'?'最后发现':'Last Seen','2 min','ago')}</div><h3>${lang==='zh'?'关系':'Relationships'}</h3><div class="row">Website → ${e('example.com','Website')}</div><div class="row">Technology → ${e('React','Technology')}</div><div class="row">Provider → ${e('Cloudflare','Provider')}</div><div class="row">Country → ${e('Singapore','Country')}</div><h3>${lang==='zh'?'证据':'Evidence'}</h3><div class="row">HTTP Header <span>99%</span></div><div class="row">DNS Observation <span>98%</span></div><div class="row">Historical Record <span>97%</span></div>`)}function quality(t){open(`<div class="muted">${lang==='zh'?'指标详情':'FINDING / METRIC DETAIL'}</div><h1>${t}</h1><p>${lang==='zh'?'信号、发现、证据与建议':'Signals, findings, evidence and recommendations'}</p><div class="metric">91 / 100</div><div class="row"><span>${lang==='zh'?'缺少内容安全策略 CSP':'Missing Content-Security-Policy'}</span><b>Medium</b></div><div class="row"><span>${lang==='zh'?'结构化数据不完整':'Structured data incomplete'}</span><b>Low</b></div><div class="row"><span>${lang==='zh'?'LCP 高于目标值':'LCP above target'}</span><b>Low</b></div><h3>${lang==='zh'?'证据链':'Evidence Chain'}</h3><div class="row">HTTP Header → Source → Observation → Timestamp</div><div class="row">HTML → Source → Observation → Confidence 98%</div><button class="btn primary" onclick="evidence()">${lang==='zh'?'打开证据':'Open Evidence'}</button>`)}function evidence(){open(`<div class="muted">${lang==='zh'?'证据':'EVIDENCE'}</div><h1>${lang==='zh'?'证据链':'Evidence Chain'}</h1><div class="row">${lang==='zh'?'来源类型':'Source Type'} <b>HTTP Header</b></div><div class="row">Endpoint <b>https://example.com</b></div><div class="row">${lang==='zh'?'观测结果':'Observation'} <b>Cloudflare detected</b></div><div class="row">${lang==='zh'?'时间':'Timestamp'} <b>2026-08-19 13:20 UTC</b></div><div class="row">${lang==='zh'?'置信度':'Confidence'} <b>99%</b></div><h3>${lang==='zh'?'关联':'Related'}</h3><div class="row">Finding → ${e('CSP Warning','Finding')}</div><div class="row">Provider → ${e('Cloudflare','Provider')}</div>`)}function history(){open(`<div class="muted">${lang==='zh'?'历史变化':'HISTORY / CHANGES'}</div><h1>example.com ${lang==='zh'?'变化记录':'Changes'}</h1>${(lang==='zh'?['发现 React','IP 地址变化','服务商变化','TLS 证书续期']:['React detected','IP changed','Provider changed','TLS certificate renewed']).map((x,i)=>`<div class="row"><div><b>${x}</b><div class="muted">Aug ${19-i}, 2026 · Evidence verified</div></div><span>→</span></div>`).join('')}`)}function relations(){set(head(lang==='zh'?'关系探索器':'Relationship Explorer',lang==='zh'?'点击任意节点继续向下探索':'Click any node to continue exploration')+`<div class="card"><div class="graph"><div class="node" style="left:50%;top:50%" onclick="website()">example.com</div><div class="node" style="left:20%;top:24%" onclick="detail('Technology','React')">React</div><div class="node" style="left:80%;top:24%" onclick="detail('Provider','Cloudflare')">Cloudflare</div><div class="node" style="left:20%;top:76%" onclick="detail('IP','104.18.32.10')">104.18.32.10</div><div class="node" style="left:80%;top:76%" onclick="detail('ASN','AS13335')">AS13335</div></div></div>`)}function compare(){set(head(lang==='zh'?'对比':'Compare',lang==='zh'?'并排比较实体':'Compare entities side by side')+`<div class="card"><div class="row"><b>${lang==='zh'?'指标':'Metric'}</b><b>example.com</b><b>shop.example</b></div>${[['Security','91','78'],['SEO','82','89'],['Performance','76','81'],['Provider','Cloudflare','AWS'],['Country','United States','Singapore']].map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span><span>${r[2]}</span></div>`).join('')}</div>`)}function reports(){set(head(lang==='zh'?'报告':'Reports',lang==='zh'?'已保存的情报报告':'Saved intelligence reports')+`<div class="grid g2"><div class="card"><h3>example.com Intelligence</h3><div class="muted">Technology · Infrastructure · Security · SEO</div><button class="entity" onclick="website()">${lang==='zh'?'打开 →':'Open →'}</button></div><div class="card"><h3>Singapore Web Intelligence</h3><div class="muted">Websites · Technologies · Providers · Trends</div><button class="entity" onclick="detail('Country','Singapore')">${lang==='zh'?'打开 →':'Open →'}</button></div></div>`)}function open(x){document.getElementById('detail').innerHTML=x;document.getElementById('drawer').classList.add('open')}function closeD(){document.getElementById('drawer').classList.remove('open')}function search(){let q=prompt(lang==='zh'?'搜索实体 / 域名 / IP / ASN / 技术':'Search entity / domain / IP / ASN / technology');if(q)detail(lang==='zh'?'搜索结果':'Search Result',q)}home()</script></body></html>
