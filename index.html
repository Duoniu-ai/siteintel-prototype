<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiteIntel 2.0 Prototype</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--muted:#667085;--text:#101828;--line:#e4e7ec;--accent:#2563eb;--soft:#eff6ff;--good:#16a34a;--warn:#d97706;--shadow:0 10px 30px rgba(16,24,40,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body.dark{--bg:#0b1020;--panel:#111827;--muted:#98a2b3;--text:#f2f4f7;--line:#263244;--soft:#172554;--shadow:0 12px 32px rgba(0,0,0,.25)}button,input{font:inherit}button{cursor:pointer}.top{height:64px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:20}.logo{font-size:18px;font-weight:800}.logo i{font-style:normal;color:var(--accent)}.search{height:40px;flex:1;max-width:680px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 13px;display:flex;align-items:center;color:var(--muted);cursor:pointer}.top button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 11px}.layout{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 64px)}aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:64px;height:calc(100vh - 64px)}.group{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 8px 6px}.nav{width:100%;border:0;background:transparent;color:var(--text);text-align:left;border-radius:9px;padding:9px 10px;margin:2px 0}.nav:hover,.nav.active{background:var(--soft);color:var(--accent);font-weight:700}.main{max-width:1540px;width:100%;padding:28px;margin:auto}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.eyebrow,.muted{color:var(--muted)}.eyebrow{font-size:12px}.title{font-size:29px;line-height:1.15;margin:3px 0;font-weight:800;letter-spacing:-.6px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.ghost{border-radius:9px;padding:9px 13px}.primary{border:0;background:var(--accent);color:#fff}.ghost{border:1px solid var(--line);background:var(--panel);color:var(--text)}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.hero{padding:28px;margin-bottom:14px;background:linear-gradient(135deg,var(--panel),var(--soft))}.hero h1{font-size:36px;margin:0 0 7px;line-height:1.1}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:17px}.ct{font-weight:750;margin-bottom:12px}.metric{font-size:26px;font-weight:800;letter-spacing:-.4px}.small{font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.entity{border:0;background:transparent;color:var(--accent);font-weight:650;padding:0}.entity:hover{text-decoration:underline}.pill{border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:11px}.good{color:var(--good)}.warn{color:var(--warn)}.tabs{display:flex;gap:3px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:16px}.tab{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filter{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 10px;border-radius:9px}.barbox{height:160px;display:flex;align-items:flex-end;gap:7px}.bar{flex:1;background:var(--accent);opacity:.75;border-radius:5px 5px 0 0}.timeline{padding-left:22px;position:relative}.timeline:before{content:"";position:absolute;left:6px;top:3px;bottom:3px;width:1px;background:var(--line)}.event{position:relative;padding-bottom:17px}.event:before{content:"";position:absolute;left:-19px;top:6px;width:7px;height:7px;background:var(--accent);border-radius:50%}.graph{height:350px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:radial-gradient(circle at 50% 50%,var(--soft),transparent 43%),var(--bg)}.node{position:absolute;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:9px 12px;color:var(--accent);font-weight:700;cursor:pointer}.modal-bg{display:none;position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:100;align-items:flex-start;justify-content:center;padding:9vh 14px}.modal-bg.open{display:flex}.modal{width:min(720px,100%);background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}.modal input{width:100%;border:0;border-bottom:1px solid var(--line);outline:0;background:transparent;color:var(--text);padding:17px;font-size:18px}.results{max-height:65vh;overflow:auto;padding:8px}.result{padding:11px 12px;border-radius:9px;display:flex;justify-content:space-between}.result:hover{background:var(--soft)}.bottom{display:none}
@media(max-width:900px){.layout{display:block}aside{display:none}.main{padding:18px 14px 80px}.top{padding:0 14px}.top .ghost{display:none}.search{max-width:none}.g4,.g3,.g2{grid-template-columns:1fr}.head{display:block}.actions{margin-top:12px}.hero h1{font-size:29px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--panel);border-top:1px solid var(--line);z-index:30}.bottom button{border:0;background:transparent;color:var(--muted);font-size:11px}.bottom button.active{color:var(--accent);font-weight:700}.table-wrap{overflow:auto}.table{min-width:700px}}
</style></head>
<body>
<header class="top"><div class="logo">Site<i>Intel</i></div><div class="search" onclick="openSearch()">⌕&nbsp; Search websites, IPs, technologies... <span style="margin-left:auto;font-size:12px">⌘ K</span></div><button onclick="toast('Language selector')">中文 / EN</button><button onclick="theme()">◐</button></header>
<div class="layout"><aside><div class="group">Intelligence</div><button class="nav" data-r="home">Overview</button><button class="nav" data-r="explore">Explore</button><button class="nav" data-r="website">Websites</button><button class="nav" data-r="technology">Technologies</button><div class="group">Infrastructure</div><button class="nav" data-r="ip">IPs</button><button class="nav" data-r="asn">ASNs</button><button class="nav" data-r="provider">Providers</button><div class="group">Global</div><button class="nav" data-r="country">Countries</button><button class="nav" data-r="security">Security</button><button class="nav" data-r="seo">SEO</button><button class="nav" data-r="performance">Performance</button><div class="group">Workspace</div><button class="nav" data-r="compare">Compare</button><button class="nav" data-r="reports">Reports</button></aside><main class="main" id="app"></main></div><nav class="bottom"><button data-r="home">Home</button><button onclick="openSearch()">Search</button><button data-r="explore">Explore</button><button data-r="compare">Compare</button><button data-r="reports">More</button></nav></div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeSearch()"><div class="modal"><input id="q" placeholder="Search anything..." oninput="search(this.value)"><div class="results" id="results"></div></div></div>
<script>
const E=[['example.com','Website','website'],['shop.example','Website','website'],['React','Technology','technology'],['Next.js','Technology','technology'],['Nginx','Technology','technology'],['Cloudflare','Provider','provider'],['AWS','Provider','provider'],['104.18.32.10','IP','ip'],['AS13335','ASN','asn'],['AS16509','ASN','asn'],['United States','Country','country'],['Singapore','Country','country'],['Japan','Country','country']];
const entity=(x,r)=>`<button class="entity" onclick="go('${r}')">${x}</button>`;const metric=(a,b,c)=>`<div class="card"><div class="muted small">${a}</div><div class="metric">${b}</div><div class="muted small">${c}</div></div>`;const card=(t,b)=>`<section class="card"><div class="ct">${t}</div>${b}</section>`;
function go(r){location.hash=r}function route(){return location.hash.slice(1)||'home'}function head(t,s,a=''){return `<div class="head"><div><div class="eyebrow">SiteIntel / Intelligence</div><h1 class="title">${t}</h1><div class="muted">${s}</div></div><div class="actions">${a}</div></div>`}
function home(){return `<div class="hero"><div class="eyebrow">Website Data Intelligence Platform</div><h1>Understand any website.</h1><div class="muted">从网站、技术、IP、ASN、地理与证据之间建立可探索的数据关系。</div><div class="actions" style="margin-top:20px"><button class="primary" onclick="go('website')">Analyze example.com</button><button class="ghost" onclick="go('explore')">Explore global data</button></div></div><div class="grid g4">${metric('Websites','12.8M','observed globally')}${metric('Technologies','42.7K','fingerprints')}${metric('Countries','195','coverage')}${metric('Relationships','86.4M','connected entities')}</div><div class="grid g2" style="margin-top:14px">${card('Global Intelligence','<div class="metric">+12.4%</div><div class="muted">30-day technology adoption growth</div><div class="barbox">'+[35,48,43,62,58,74,68,82,76,91,88,100].map(h=>`<i class="bar" style="height:${h}%"></i>`).join('')+'</div>')} ${card('Quick Explore','<div class="row">'+entity('React','technology')+'<span>1.28M websites</span></div><div class="row">'+entity('Cloudflare','provider')+'<span>4.82M websites</span></div><div class="row">'+entity('Singapore','country')+'<span>420K websites</span></div><div class="row">'+entity('AS13335','asn')+'<span>2.1M websites</span></div>')}</div>`}
function explore(){return head('Explore','Browse websites, technologies and infrastructure.','<button class="primary" onclick="toast(\'Search saved\')">＋ Save Search</button>')+`<div class="tabs"><button class="tab active">Websites</button><button class="tab">Technologies</button><button class="tab">IPs</button><button class="tab">ASNs</button><button class="tab">Providers</button><button class="tab">Countries</button></div><div class="filters"><button class="filter">Country ▾</button><button class="filter">Technology ▾</button><button class="filter">Provider ▾</button><button class="filter">Security ≥ 80</button><button class="filter">Last seen ▾</button><button class="filter">More Filters</button></div><div class="card"><div class="row"><b>12,842,392 results</b><span class="muted">Relevance ▾ · Cards / Table / Graph</span></div><div class="grid g2" style="margin-top:12px">${['example.com','shop.example','news.example','app.example','docs.example','media.example'].map((d,i)=>`<div class="card"><div>${entity(d,'website')}</div><div class="muted small">${i%2?'Singapore':'United States'} · ${i%2?'AWS':'Cloudflare'}</div><div style="margin-top:8px">${entity(i%2?'Next.js':'React','technology')} · ${entity('Cloudflare','provider')}</div><div class="small" style="margin-top:8px">Security ${88+i} · SEO ${78+i} · Performance ${74+i}</div></div>`).join('')}</div></div>`}
function website(){return head('example.com','Website Intelligence · last analyzed 2 minutes ago','<button class="primary" onclick="toast(\'Analysis queued\')">Analyze Again</button><button class="ghost" onclick="go(\'compare\')">Compare</button>')+`<div class="hero"><div style="display:flex;justify-content:space-between;gap:20px;align-items:center"><div><div class="eyebrow">Website</div><h1>example.com</h1><div class="muted">Example Company · ${entity('United States','country')} · 200 OK · HTTPS</div></div><div><div class="metric">84 / 100</div><div class="muted small">Overall Intelligence</div></div></div></div><div class="tabs"><button class="tab active">Overview</button><button class="tab">Technologies</button><button class="tab">Infrastructure</button><button class="tab">DNS</button><button class="tab">Security</button><button class="tab">SEO</button><button class="tab">Performance</button><button class="tab">Changes</button><button class="tab">Evidence</button><button class="tab">Graph</button></div><div class="grid g4">${metric('Technology','92','24 detected')}${metric('Infrastructure','88','2 IPs · 1 ASN')}${metric('Security','91','0 critical')}${metric('Performance','76','LCP 2.1s')}</div><div class="grid g2" style="margin-top:14px">${card('Technology Stack','<div class="row">'+entity('React','technology')+'<span class="pill good">98%</span></div><div class="row">'+entity('Next.js','technology')+'<span class="pill good">96%</span></div><div class="row">'+entity('Nginx','technology')+'<span class="pill good">91%</span></div>')} ${card('Infrastructure','<div class="row">IP '+entity('104.18.32.10','ip')+'</div><div class="row">ASN '+entity('AS13335','asn')+'</div><div class="row">Provider '+entity('Cloudflare','provider')+'</div><div class="row">Country '+entity('United States','country')+'</div>')}</div><div class="grid g3" style="margin-top:14px">${card('Security','<div class="metric">91</div><div class="muted">HSTS ✓ · TLS ✓ · CSP ⚠</div>')} ${card('SEO','<div class="metric">82</div><div class="muted">Title ✓ · Canonical ✓ · Schema ⚠</div>')} ${card('Performance','<div class="metric">76</div><div class="muted">LCP 2.1s · INP 180ms · CLS 0.08</div>')}</div><div class="grid g2" style="margin-top:14px">${card('Recent Changes','<div class="timeline"><div class="event"><b>React detected</b><div class="muted small">Aug 19 · HTML fingerprint</div></div><div class="event"><b>IP changed</b><div class="muted small">Aug 18 · DNS observation</div></div><div class="event"><b>Provider changed</b><div class="muted small">Aug 17 · AWS → Cloudflare</div></div></div>')} ${card('Evidence Chain','<div class="row">HTTP Header → '+entity('Cloudflare','provider')+'<span class="pill good">98%</span></div><div class="row">HTML Script → '+entity('React','technology')+'<span class="pill good">98%</span></div><div class="row">DNS A → '+entity('104.18.32.10','ip')+'<span class="pill good">99%</span></div>')}</div>`}
function technology(){return head('React','Technology Intelligence · Frontend Framework')+`<div class="grid g4">${metric('Websites','1.28M','+12.4% 30D')}${metric('Countries','180','global adoption')}${metric('First Seen','2013','observed history')}${metric('Confidence','98%','3 signal sources')}</div><div class="grid g2" style="margin-top:14px">${card('Adoption Trend','<div class="barbox">'+[28,32,36,44,42,51,58,55,64,71,78,86].map(h=>`<i class="bar" style="height:${h}%"></i>`).join('')+'</div><div class="muted small">30D · 90D · 1Y · 3Y</div>')} ${card('Related Technologies','<div class="row">'+entity('Next.js','technology')+'<span>840K</span></div><div class="row">'+entity('React Router','technology')+'<span>610K</span></div><div class="row">'+entity('Redux','technology')+'<span>420K</span></div><div class="row">'+entity('TypeScript','technology')+'<span>1.1M</span></div>')}</div>`}
function infra(type){const title=type==='ip'?'104.18.32.10':type==='asn'?'AS13335':'Cloudflare';return head(title,type==='ip'?'IP Intelligence · IPv4':type==='asn'?'ASN Intelligence · Cloudflare, Inc.':'Provider Intelligence · Global network')+`<div class="grid g4">${metric(type==='ip'?'Provider':'Websites',type==='ip'?'Cloudflare':'4.82M','')}${metric(type==='ip'?'ASN':'IPs',type==='ip'?'AS13335':'8.4M','')}${metric('Countries',type==='asn'?'190':'180','')}${metric('Websites',type==='ip'?'327':'2.1M','')}</div><div class="grid g2" style="margin-top:14px">${card('Relationships','<div class="row">Provider '+entity('Cloudflare','provider')+'</div><div class="row">ASN '+entity('AS13335','asn')+'</div><div class="row">Country '+entity('United States','country')+'</div>')} ${card('Associated Websites','<div class="row">'+entity('example.com','website')+'<span>8m ago</span></div><div class="row">'+entity('shop.example','website')+'<span>11m ago</span></div><div class="row">'+entity('news.example','website')+'<span>16m ago</span></div>')}</div><div class="card" style="margin-top:14px"><div class="ct">Relationship Graph</div><div class="graph"><div class="node" style="left:50%;top:50%" onclick="go('website')">example.com</div><div class="node" style="left:22%;top:25%" onclick="go('technology')">React</div><div class="node" style="left:78%;top:25%" onclick="go('provider')">Cloudflare</div><div class="node" style="left:22%;top:76%" onclick="go('ip')">104.18.32.10</div><div class="node" style="left:78%;top:76%" onclick="go('asn')">AS13335</div></div></div>`}
function country(){return head('Singapore','Country Intelligence · Asia')+`<div class="grid g4">${metric('Websites','420K','')}${metric('Technologies','8.2K','')}${metric('Providers','182','')}${metric('ASNs','640','')}</div><div class="grid g2" style="margin-top:14px">${card('Top Technologies','<div class="row">'+entity('React','technology')+'<span>18K</span></div><div class="row">'+entity('Next.js','technology')+'<span>14K</span></div><div class="row">WordPress<span>92K</span></div>')} ${card('Top Providers','<div class="row">'+entity('Cloudflare','provider')+'<span>182K</span></div><div class="row">'+entity('AWS','provider')+'<span>88K</span></div><div class="row">Google Cloud<span>42K</span></div>')}</div>`}
function quality(k){let d={security:['Security','91'],seo:['SEO','82'],performance:['Performance','76']}[k];return head(d[0]+' Intelligence','Signals, findings, evidence and recommendations')+`<div class="grid g4">${metric('Score',d[1],k==='security'?'Healthy':'Needs improvement')}${metric('Critical','0','')}${metric('Findings','12','')}${metric('Last Scan','2m','')}</div><div class="grid g2" style="margin-top:14px">${card('Findings','<div class="row"><button class="entity" onclick="toast(\'Finding detail: Missing CSP\')">Missing Content-Security-Policy</button><span class="pill warn">Medium</span></div><div class="row"><button class="entity" onclick="toast(\'Finding detail\')">Structured data incomplete</button><span class="pill warn">Low</span></div><div class="row"><button class="entity" onclick="toast(\'Finding detail\')">LCP above target</button><span class="pill warn">Low</span></div>')} ${card('Evidence','<div class="row">HTTP Header<span class="pill good">99%</span></div><div class="row">HTML<span class="pill good">98%</span></div><div class="row">DNS<span class="pill good">97%</span></div><div class="row">TLS<span class="pill good">99%</span></div>')}</div>`}
function compare(){return head('Compare','Compare up to 5 entities side by side.','<button class="primary" onclick="toast(\'Entity added\')">＋ Add Entity</button>')+`<div class="card" style="overflow:auto"><table class="table" style="width:100%;border-collapse:collapse"><tr><th>Metric</th><th>${entity('example.com','website')}</th><th>${entity('shop.example','website')}</th></tr><tr><td>Security</td><td>91</td><td>78</td></tr><tr><td>SEO</td><td>82</td><td>89</td></tr><tr><td>Performance</td><td>76</td><td>81</td></tr><tr><td>Provider</td><td>${entity('Cloudflare','provider')}</td><td>${entity('AWS','provider')}</td></tr><tr><td>Country</td><td>${entity('United States','country')}</td><td>${entity('Singapore','country')}</td></tr></table></div>`}
function reports(){return head('Reports','Saved intelligence reports and generated analyses.','<button class="primary" onclick="toast(\'Report generation started\')">Create Report</button>')+`<div class="grid g2">${card('example.com Intelligence Report','<div class="row"><span>Aug 19, 2026</span><span class="pill good">84 / 100</span></div><div class="muted small">Technology · Infrastructure · Security · SEO · Performance</div><button class="entity" onclick="go(\'website\')">Open report →</button>')} ${card('Singapore Web Intelligence','<div class="row"><span>Aug 18, 2026</span><span class="pill">Global</span></div><div class="muted small">Websites · Technologies · Providers · Trends</div><button class="entity" onclick="go(\'country\')">Open report →</button>')}</div>`}
function render(){let r=route(),h=r==='home'?home():r==='explore'?explore():r==='website'?website():r==='technology'?technology():r==='ip'?infra('ip'):r==='asn'?infra('asn'):r==='provider'?infra('provider'):r==='country'?country():r==='security'?quality('security'):r==='seo'?quality('seo'):r==='performance'?quality('performance'):r==='compare'?compare():r==='reports'?reports():home();document.getElementById('app').innerHTML=h;document.querySelectorAll('[data-r]').forEach(x=>{x.classList.toggle('active',x.dataset.r===r);x.onclick=()=>go(x.dataset.r)})}
function openSearch(){document.getElementById('modal').classList.add('open');document.getElementById('q').focus();search('')}function closeSearch(){document.getElementById('modal').classList.remove('open')}function search(q){let a=q?E.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())||x[1].toLowerCase().includes(q.toLowerCase())):E.slice(0,8);document.getElementById('results').innerHTML=a.map(x=>`<div class="result" onclick="closeSearch();go('${x[2]}')"><div><b>${x[0]}</b><div class="muted small">${x[1]}</div></div><span>→</span></div>`).join('')||'<div class="muted" style="padding:18px">No results found.</div>'}function theme(){document.body.classList.toggle('dark')}function toast(t){let x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.style='position:fixed;bottom:24px;right:24px;background:#111827;color:white;padding:10px 14px;border-radius:9px;z-index:200';document.body.appendChild(x)}x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}window.addEventListener('hashchange',render);window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeSearch()});render();
</script></body></html>
