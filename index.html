<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteIntel 2.0 Prototype</title><style>:root{--bg:#f5f7fb;--p:#fff;--t:#101828;--m:#667085;--l:#e4e7ec;--a:#2563eb;--s:#eff6ff;--ok:#079455;--w:#dc6803}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:10}.logo{font-size:19px;font-weight:800}.logo b{color:var(--a)}.search{flex:1;max-width:720px;border:1px solid var(--l);background:var(--bg);border-radius:10px;padding:10px 14px;color:var(--m);cursor:pointer}.btn{border:1px solid var(--l);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}.primary{background:var(--a);border-color:var(--a);color:#fff}.layout{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid var(--l);padding:14px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.group{font-size:11px;color:var(--m);font-weight:700;margin:15px 8px 6px;text-transform:uppercase}.nav{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;margin:2px 0}.nav:hover,.nav.on{background:var(--s);color:var(--a);font-weight:700}.main{width:min(1500px,100%);padding:26px;margin:auto}.hero,.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px;margin-bottom:14px}.hero{padding:30px;background:linear-gradient(135deg,#fff,var(--s))}.hero h1{font-size:36px;line-height:1.2;margin:6px 0 10px}.muted{color:var(--m)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.metric{font-size:27px;font-weight:800;margin:4px 0}.ct{font-weight:750;margin-bottom:10px}.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--l);gap:14px}.row:last-child{border:0}.entity{border:0;background:none;color:var(--a);font-weight:700;cursor:pointer;padding:0}.good{color:var(--ok)}.warn{color:var(--w)}.tabs{display:flex;gap:2px;overflow:auto;border-bottom:1px solid var(--l);margin-bottom:15px}.tab{border:0;background:none;padding:10px 13px;color:var(--m);white-space:nowrap;cursor:pointer}.tab.on{color:var(--a);font-weight:700;border-bottom:2px solid var(--a)}.graph{height:340px;position:relative;background:radial-gradient(circle,#fff,var(--s) 50%,var(--bg));border:1px solid var(--l);border-radius:12px;overflow:hidden}.edge{position:absolute;height:1px;background:#b2ccff;transform-origin:left}.node{position:absolute;transform:translate(-50%,-50%);padding:9px 12px;background:#fff;border:1px solid var(--l);box-shadow:0 2px 8px #0001;border-radius:9px;color:var(--a);font-weight:700;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--l)}.table th{font-size:12px;color:var(--m)}.bar{height:7px;background:#e9eef8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.drawer{display:none;position:fixed;inset:0;background:#0008;z-index:30}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(590px,94%);background:#fff;padding:24px;overflow:auto}.close{float:right;border:0;background:none;font-size:24px;cursor:pointer}.bottom{display:none}@media(max-width:800px){.top{height:58px;padding:0 12px}.top .search{display:none}.layout{display:block}aside{display:none}.main{padding:15px 12px 78px}.g4,.g3,.g2{grid-template-columns:1fr}.hero{padding:23px 18px}.hero h1{font-size:29px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--l);z-index:20}.bottom button{border:0;background:none;color:var(--m);font:12px system-ui}.panel{width:100%;padding:18px}} </style></head><body><header class="top"><div class="logo">Site<b>Intel</b></div><div class="search" id="search" onclick="search()">⌕ 搜索网站、域名、IP、ASN、技术...</div><button class="btn" id="lang" onclick="toggleLang()">EN</button></header><div class="layout"><aside id="side"></aside><main class="main" id="app"></main></div><nav class="bottom" id="bottom"></nav><div class="drawer" id="drawer" onclick="if(event.target.id==='drawer')closeD()"><section class="panel"><button class="close" onclick="closeD()">×</button><div id="detail"></div></section></div><script>const Z={intelligence:'情报',overview:'总览',explore:'探索',websites:'网站',technologies:'技术',infrastructure:'基础设施',ip:'IP',asn:'ASN',providers:'服务商',global:'全球',countries:'国家/地区',security:'安全',seo:'SEO',performance:'性能',workspace:'工作台',compare:'对比',reports:'报告',history:'历史变化',evidence:'证据链',relations:'关系图',home:'首页',search:'搜索',more:'更多',analyze:'分析网站',open:'打开',score:'评分',web:'网站',technology:'技术',country:'国家/地区',provider:'服务商',confidence:'置信度',lastSeen:'最后发现',recommendation:'建议',findings:'发现',signals:'信号',trend:'趋势',coverage:'覆盖',relationships:'关系'};const E={intelligence:'Intelligence',overview:'Overview',explore:'Explore',websites:'Websites',technologies:'Technologies',infrastructure:'Infrastructure',ip:'IP',asn:'ASN',providers:'Providers',global:'Global',countries:'Countries',security:'Security',seo:'SEO',performance:'Performance',workspace:'Workspace',compare:'Compare',reports:'Reports',history:'Changes',evidence:'Evidence Chain',relations:'Graph',home:'Home',search:'Search',more:'More',analyze:'Analyze website',open:'Open',score:'Score',web:'Websites',technology:'Technology',country:'Country',provider:'Provider',confidence:'Confidence',lastSeen:'Last seen',recommendation:'Recommendation',findings:'Findings',signals:'Signals',trend:'Trend',coverage:'Coverage',relationships:'Relationships'};let lang='zh';try{lang=localStorage.getItem('siteintel-lang')||'zh'}catch(e){}const L=k=>(lang==='zh'?Z:E)[k]||k;function toggleLang(){lang=lang==='zh'?'en':'zh';try{localStorage.setItem('siteintel-lang',lang)}catch(e){}document.documentElement.lang=lang==='zh'?'zh-CN':'en';renderChrome();route()}function go(r){location.hash=r}function nav(k,r){return `<button class="nav ${location.hash==='#'+r?'on':''}" onclick="go('${r}')">${L(k)}</button>`}function side(){return `<div class="group">${L('intelligence')}</div>${nav('overview','overview')}${nav('explore','explore')}${nav('websites','websites')}${nav('technologies','technologies')}<div class="group">${L('infrastructure')}</div>${nav('ip','ip')}${nav('asn','asn')}${nav('providers','providers')}<div class="group">${L('global')}</div>${nav('countries','countries')}${nav('security','security')}${nav('seo','seo')}${nav('performance','performance')}<div class="group">${L('workspace')}</div>${nav('compare','compare')}${nav('reports','reports')}${nav('history','history')}${nav('evidence','evidence')}${nav('relations','relations')}</div>`}function renderChrome(){document.getElementById('lang').textContent=lang==='zh'?'EN':'中';document.getElementById('search').textContent='⌕ '+(lang==='zh'?'搜索网站、域名、IP、ASN、技术...':'Search websites, domains, IPs, ASNs, technologies...');document.getElementById('side').innerHTML=side();document.getElementById('bottom').innerHTML=`<button onclick="go('overview')">${L('home')}</button><button onclick="search()">${L('search')}</button><button onclick="go('explore')">${L('explore')}</button><button onclick="go('compare')">${L('compare')}</button><button onclick="go('reports')">${L('more')}</button>`}function set(x){document.getElementById('app').innerHTML=x}function head(t,s){return `<div style="margin-bottom:18px"><div class="muted">SiteIntel / ${L('intelligence')}</div><h2 style="font-size:29px;margin:3px 0">${t}</h2><div class="muted">${s}</div></div>`}function m(a,b,c=''){return `<div class="card"><div class="muted">${a}</div><div class="metric">${b}</div><div class="muted">${c}</div></div>`}function ent(n,t){return `<button class="entity" onclick="entity('${t}','${n.replace(/'/g,"\\'")}')">${n}</button>`}function home(){set(`<section class="hero"><div class="muted">${lang==='zh'?'网站数据智能平台':'WEBSITE DATA INTELLIGENCE PLATFORM'}</div><h1>${lang==='zh'?'理解任何网站。':'Understand any website.'}</h1><div class="muted">${lang==='zh'?'从网站、技术、IP、ASN、服务商、国家/地区到证据链，建立可继续下钻的全球关系网络。':'Explore a connected intelligence graph across websites, technologies, IPs, ASNs, providers, countries and evidence.'}</div><p><button class="btn primary" onclick="entity('Website','example.com')">${L('analyze')} example.com</button> <button class="btn" onclick="go('explore')">${L('explore')}</button></p></section><div class="grid g4">${m(L('web'),'12.8M',lang==='zh'?'全球观测':'observed globally')}${m(L('technology'),'42.7K',lang==='zh'?'技术指纹':'fingerprints')}${m(L('country'),'195',lang==='zh'?'国家/地区':'countries')}${m(L('relationships'),'86.4M',lang==='zh'?'实体关系':'entity links')}</div><div class="grid g2"><div class="card"><div class="ct">${lang==='zh'?'快速探索':'Quick Explore'}</div><div class="row">${ent('React','Technology')}<span>1.28M ${L('web')}</span></div><div class="row">${ent('Cloudflare','Provider')}<span>4.82M ${L('web')}</span></div><div class="row">${ent('Singapore','Country')}<span>420K ${L('web')}</span></div><div class="row">${ent('AS13335','ASN')}<span>2.1M ${L('web')}</span></div></div><div class="card"><div class="ct">${L('trend')}</div><div class="metric">+12.4%</div><div class="muted">${lang==='zh'?'技术采用率 · 30天':'Technology adoption · 30 days'}</div><div style="height:105px;margin-top:15px;display:flex;align-items:end;gap:6px">${[30,42,35,54,48,62,58,75,70,84,80,100].map(x=>`<i style="height:${x}%;flex:1;background:var(--a);opacity:.7;border-radius:5px"></i>`).join('')}</div></div></div>`)}function explore(){const a=['example.com','shop.example','news.example','app.example','docs.example','media.example'];set(head(L('explore'),lang==='zh'?'浏览和筛选全球网站情报，点击任意实体继续下钻。':'Browse global intelligence and click any entity to drill down.')+`<div class="card"><div class="row"><b>12,842,392 ${lang==='zh'?'条结果':'results'}</b><span class="muted">${lang==='zh'?'相关性 · 卡片 · 表格 · 图谱':'Relevance · Cards · Table · Graph'}</span></div><div class="grid g2">${a.map((x,i)=>`<div class="card"><div>${ent(x,'Website')}</div><div class="muted">${i%2?'Singapore':'United States'} · ${ent(i%2?'AWS':'Cloudflare','Provider')}</div><div style="margin-top:7px">${ent(i%2?'Next.js':'React','Technology')}</div><div class="row">${L('security')} <b>${88+i}</b></div><div class="row">SEO <b>${78+i}</b></div><div class="row">${L('performance')} <b>${74+i}</b></div></div>`).join('')}</div></div>`)}function websites(){set(head(L('websites'),lang==='zh'?'网站实体、状态、国家、技术、基础设施和评分。':'Website entities, status, geography, technology, infrastructure and score.')+`<div class="card"><table class="table"><tr><th>${L('web')}</th><th>${L('country')}</th><th>${L('score')}</th><th>${L('provider')}</th></tr>${['example.com','shop.example','news.example','app.example','docs.example'].map((x,i)=>`<tr><td>${ent(x,'Website')}</td><td>${i%2?'Singapore':'United States'}</td><td><b>${84-i}</b></td><td>${ent(i%2?'AWS':'Cloudflare','Provider')}</td></tr>`).join('')}</table></div>`)}function websiteDetail(){set(head('example.com',lang==='zh'?'网站智能总览 · 最近分析 2 分钟前':'Website intelligence overview · analyzed 2 minutes ago')+`<div class="hero"><b>example.com</b><div class="muted">Example Company · ${ent(lang==='zh'?'美国':'United States','Country')} · 200 OK · HTTPS</div><div class="metric">84 / 100</div></div><div class="tabs"><button class="tab on">${L('overview')}</button><button class="tab" onclick="entity('Technology','React')">${L('technology')}</button><button class="tab" onclick="entity('IP','104.18.32.10')">${L('infrastructure')}</button><button class="tab" onclick="go('security')">${L('security')}</button><button class="tab" onclick="go('seo')">SEO</button><button class="tab" onclick="go('performance')">${L('performance')}</button><button class="tab" onclick="go('history')">${L('history')}</button><button class="tab" onclick="go('evidence')">${L('evidence')}</button><button class="tab" onclick="go('relations')">${L('relations')}</button></div><div class="grid g4">${m(L('technology'),'92','24 signals')}${m(L('infrastructure'),'88','2 IP · 1 ASN')}${m(L('security'),'91','0 critical')}${m(L('performance'),'76','LCP 2.1s')}</div><div class="grid g2"><div class="card"><div class="ct">${lang==='zh'?'技术栈':'Technology Stack'}</div><div class="row">${ent('React','Technology')}<b>98%</b></div><div class="row">${ent('Next.js','Technology')}<b>96%</b></div><div class="row">${ent('Nginx','Technology')}<b>91%</b></div></div><div class="card"><div class="ct">${L('infrastructure')}</div><div class="row">IP ${ent('104.18.32.10','IP')}</div><div class="row">ASN ${ent('AS13335','ASN')}</div><div class="row">${L('provider')} ${ent('Cloudflare','Provider')}</div><div class="row">${L('country')} ${ent(lang==='zh'?'美国':'United States','Country')}</div></div></div><div class="grid g3"><div class="card" onclick="metric('Security')"><div class="ct">${L('security')}</div><div class="metric">91</div><div class="muted">HSTS ✓ · TLS ✓ · CSP ⚠</div></div><div class="card" onclick="metric('SEO')"><div class="ct">SEO</div><div class="metric">82</div><div class="muted">Title ✓ · Schema ⚠</div></div><div class="card" onclick="metric('Performance')"><div class="ct">${L('performance')}</div><div class="metric">76</div><div class="muted">LCP 2.1s · INP 180ms</div></div></div>`)}function technologies(){set(head(L('technologies'),lang==='zh'?'技术实体目录与采用趋势。':'Technology entities and adoption trends.')+`<div class="grid g3">${['React','Next.js','TypeScript','Nginx','Cloudflare','WordPress'].map((x,i)=>`<div class="card" onclick="entity('Technology','${x}')"><div class="ct">${x}</div><div class="metric">${(128-i*11)}K</div><div class="muted">${L('web')} · +${12-i}% 30D</div></div>`).join('')}</div>`)}function technology(){entity('Technology','React')}function entity(t,n){if(t==='Website'){websiteDetail();return}open(`<div class="muted">${lang==='zh'?'实体详情':'ENTITY DETAIL'}</div><h1>${n}</h1><p>${t} · ${lang==='zh'?'全球观测':'global observation'}</p><div class="grid g2">${m(L('connected'),'327K',L('web'))}${m(L('country'),'180',L('coverage'))}${m(L('confidence'),'98%','3 signals')}${m(L('lastSeen'),'2 min','ago')}</div><h3>${L('relationships')}</h3><div class="row">Website → ${ent('example.com','Website')}</div><div class="row">Technology → ${ent('React','Technology')}</div><div class="row">Provider → ${ent('Cloudflare','Provider')}</div><div class="row">Country → ${ent('Singapore','Country')}</div><h3>${L('evidence')}</h3><div class="row">HTTP Header <b>99%</b></div><div class="row">DNS Observation <b>98%</b></div><div class="row">Historical Record <b>97%</b></div>`)}function ip(){entity('IP','104.18.32.10')}function asn(){entity('ASN','AS13335')}function providers(){entity('Provider','Cloudflare')}function countries(){set(head(L('countries'),lang==='zh'?'按国家查看网站、技术、服务商和趋势。':'Explore websites, technologies, providers and trends by country.')+`<div class="grid g3">${['Singapore','United States','Germany','Japan','United Kingdom','China','Australia','Canada','France'].map((x,i)=>`<div class="card" onclick="entity('Country','${x}')"><div class="ct">${x}</div><div class="metric">${420-i*27}K</div><div class="muted">${L('web')} · ${L('coverage')} 99%</div></div>`).join('')}</div>`)}function quality(k){const title=L(k);const rows=k==='security'?[['TLS','91'],['Headers','88'],['CSP','62'],['Cookies','94']]:k==='seo'?[['Title','92'],['Canonical','96'],['Schema','72'],['Indexability','89']]:[['LCP','76'],['INP','84'],['CLS','93'],['TTFB','81']];set(head(title,lang==='zh'?'点击任意指标查看发现、证据和建议。':'Click any metric for findings, evidence and recommendations.')+`<div class="grid g4">${rows.map(x=>m(x[0],x[1]+'/100',L('signals'))).join('')}</div><div class="card">${rows.map(x=>`<div class="row" onclick="metric('${x[0]}')"><span>${x[0]}</span><b>${x[1]}/100 →</b></div>`).join('')}</div>`)}function security(){quality('security')}function seo(){quality('seo')}function performance(){quality('performance')}function metric(n){open(`<div class="muted">${L('findings')}</div><h1>${n}</h1><p>${L('signals')} · ${L('evidence')} · ${L('recommendation')}</p><div class="metric">91 / 100</div><div class="row"><span>${lang==='zh'?'主要发现':'Primary finding'}</span><b class="warn">Medium</b></div><div class="row"><span>${lang==='zh'?'证据数量':'Evidence count'}</span><b>12</b></div><div class="row"><span>${L('confidence')}</span><b>98%</b></div><h3>${L('evidence')}</h3><div class="row">HTTP Header → Observation → 99%</div><div class="row">HTML Source → Observation → 98%</div><div class="row">Historical Record → Match → 97%</div><button class="btn primary" onclick="go('evidence')">${L('open')} ${L('evidence')}</button>`)}function compare(){set(head(L('compare'),lang==='zh'?'并排比较实体。':'Compare entities side by side.')+`<div class="card"><table class="table"><tr><th>${L('score')}</th><th>example.com</th><th>shop.example</th></tr>${[['Security','91','78'],['SEO','82','89'],['Performance','76','81'],['Provider','Cloudflare','AWS'],['Country','United States','Singapore'],['Technology','React','Next.js']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>`)}function reports(){set(head(L('reports'),lang==='zh'?'保存的网站、国家和技术情报报告。':'Saved website, country and technology intelligence reports.')+`<div class="grid g2"><div class="card"><h3>example.com Intelligence</h3><div class="muted">Technology · Infrastructure · Security · SEO</div><p><button class="btn primary" onclick="entity('Website','example.com')">${L('open')} →</button></p></div><div class="card"><h3>Singapore Web Intelligence</h3><div class="muted">Websites · Technologies · Providers · Trends</div><p><button class="btn primary" onclick="entity('Country','Singapore')">${L('open')} →</button></p></div></div>`)}function history(){set(head(L('history'),lang==='zh'?'按时间查看网站、技术、IP、服务商和安全状态变化。':'Review changes over time.')+`<div class="card">${(lang==='zh'?['发现 React 技术','IP 地址变化','服务商变化','TLS 证书续期','安全策略更新']:['React detected','IP changed','Provider changed','TLS certificate renewed','Security policy updated']).map((x,i)=>`<div class="row"><div><b>${x}</b><div class="muted">Aug ${19-i}, 2026 · Evidence verified</div></div><span>→</span></div>`).join('')}</div>`)}function evidence(){set(head(L('evidence'),lang==='zh'?'每个结论都追溯到来源、观测、时间和置信度。':'Trace every conclusion to source, observation, timestamp and confidence.')+`<div class="card"><table class="table"><tr><th>${lang==='zh'?'来源':'Source'}</th><th>${lang==='zh'?'观测':'Observation'}</th><th>${L('confidence')}</th><th>${lang==='zh'?'时间':'Time'}</th></tr><tr><td>HTTP Header</td><td>Cloudflare detected</td><td>99%</td><td>2026-08-19 13:20 UTC</td></tr><tr><td>DNS</td><td>AS13335</td><td>98%</td><td>2026-08-19 13:20 UTC</td></tr><tr><td>HTML</td><td>React / Next.js</td><td>97%</td><td>2026-08-19 13:21 UTC</td></tr></table></div>`)}function relations(){set(head(L('relations'),lang==='zh'?'点击任意节点继续探索。':'Click any node to continue exploring.')+`<div class="card"><div class="graph"><div class="node" style="left:50%;top:50%" onclick="entity('Website','example.com')">example.com</div><div class="node" style="left:18%;top:23%" onclick="entity('Technology','React')">React</div><div class="node" style="left:82%;top:23%" onclick="entity('Provider','Cloudflare')">Cloudflare</div><div class="node" style="left:18%;top:77%" onclick="entity('IP','104.18.32.10')">104.18.32.10</div><div class="node" style="left:82%;top:77%" onclick="entity('ASN','AS13335')">AS13335</div></div></div>`)}function open(x){document.getElementById('detail').innerHTML=x;document.getElementById('drawer').classList.add('open')}function closeD(){document.getElementById('drawer').classList.remove('open')}function search(){const q=prompt(lang==='zh'?'搜索实体 / 域名 / IP / ASN / 技术':'Search entity / domain / IP / ASN / technology');if(q)entity('Search',q)}const pages={overview:home,explore,websites,technologies,ip,asn,providers,countries,security,seo,performance,compare,reports,history,evidence,relations};function route(){renderChrome();(pages[location.hash.slice(1)]||home)()}window.addEventListener('hashchange',route);route()</script></body></html>
