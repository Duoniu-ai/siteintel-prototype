<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteIntel 2.0 · Deep Explorer v0.3</title><style>:root{--bg:#f6f8fb;--p:#fff;--t:#101828;--m:#667085;--l:#e4e7ec;--a:#2563eb;--s:#eff6ff;--ok:#16a34a;--w:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.top{height:62px;background:var(--p);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:20}.logo{font-weight:850;font-size:19px}.logo b{color:var(--a)}.search{flex:1;max-width:680px;border:1px solid var(--l);background:var(--bg);padding:10px 13px;border-radius:10px;color:var(--m);cursor:pointer}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 62px)}aside{background:var(--p);border-right:1px solid var(--l);padding:16px 12px}.group{font-size:10px;color:var(--m);letter-spacing:.08em;margin:14px 8px 6px;text-transform:uppercase}.nav{width:100%;border:0;background:none;text-align:left;color:var(--t);padding:9px 10px;border-radius:8px;cursor:pointer}.nav:hover{background:var(--s);color:var(--a)}main{max-width:1480px;width:100%;margin:auto;padding:26px}.hero,.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:17px;margin-bottom:14px}.hero{padding:26px;background:linear-gradient(135deg,var(--p),var(--s))}.hero h1{font-size:34px;margin:4px 0}.muted{color:var(--m)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.metric{font-size:26px;font-weight:800}.ct{font-weight:750;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}.entity{border:0;background:none;color:var(--a);font-weight:700;cursor:pointer;padding:0}.btn{border:1px solid var(--l);background:var(--p);border-radius:9px;padding:8px 12px;cursor:pointer}.primary{background:var(--a);color:#fff;border-color:var(--a)}.tabs{display:flex;overflow:auto;border-bottom:1px solid var(--l);margin-bottom:14px}.tab{border:0;background:none;padding:10px 12px;color:var(--m);white-space:nowrap;cursor:pointer}.tab.on{color:var(--a);border-bottom:2px solid var(--a);font-weight:700}.badge{border:1px solid var(--l);border-radius:99px;padding:3px 8px;font-size:11px}.ok{color:var(--ok)}.warn{color:var(--w)}.graph{height:360px;position:relative;border:1px solid var(--l);border-radius:12px;background:radial-gradient(circle,var(--s),var(--bg) 62%);overflow:hidden}.node{position:absolute;transform:translate(-50%,-50%);padding:9px 12px;border:1px solid var(--l);border-radius:9px;background:var(--p);color:var(--a);font-weight:700;cursor:pointer;box-shadow:0 5px 20px #10182812}.edge{position:absolute;height:1px;background:#98a2b3;transform-origin:left center}.drawer{display:none;position:fixed;inset:0;background:#0007;z-index:100}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(620px,95%);background:var(--p);padding:24px;overflow:auto}.close{float:right;border:0;background:none;font-size:24px}.timeline{padding-left:20px;border-left:2px solid var(--l)}.event{padding:0 0 20px;position:relative}.event:before{content:"";position:absolute;left:-25px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--a)}@media(max-width:800px){.layout{display:block}aside{display:none}main{padding:16px 13px 74px}.g4,.g3,.g2{grid-template-columns:1fr}.hero h1{font-size:28px}.top{padding:0 13px}.top button{display:none}.bottom{display:grid!important;position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--p);border-top:1px solid var(--l);z-index:30;grid-template-columns:repeat(5,1fr)}.bottom button{border:0;background:none;color:var(--m)}}.bottom{display:none}</style><body><header class="top"><div class="logo">Site<b>Intel</b></div><div class="search" onclick="openSearch()">⌕ Search domain, IP, ASN, technology, provider, country, finding...</div><button class="btn" onclick="alert('Language: 中文 / English / 日本語 / 한국어')">中文</button><button class="btn" onclick="document.body.style.filter=document.body.style.filter?'':'invert(.9) brightness(1.1)'"></button></header><div class="layout"><aside><div class="group">Intelligence</div><button class="nav" onclick="home()">Overview</button><button class="nav" onclick="website()">Website</button><button class="nav" onclick="technology()">Technology</button><button class="nav" onclick="explore()">Explore</button><div class="group">Infrastructure</div><button class="nav" onclick="entity('IP','104.18.32.10')">IP</button><button class="nav" onclick="entity('ASN','AS13335')">ASN</button><button class="nav" onclick="entity('Provider','Cloudflare')">Provider</button><button class="nav" onclick="entity('Datacenter','SIN1')">Datacenter</button><div class="group">Global</div><button class="nav" onclick="entity('Country','Singapore')">Countries</button><button class="nav" onclick="quality('Security')">Security</button><button class="nav" onclick="quality('SEO')">SEO</button><button class="nav" onclick="quality('Performance')">Performance</button><div class="group">Workspace</div><button class="nav" onclick="compare()">Compare</button><button class="nav" onclick="reports()">Reports</button></aside><main id="app"></main></div><nav class="bottom"><button onclick="home()">Home</button><button onclick="openSearch()">Search</button><button onclick="explore()">Explore</button><button onclick="compare()">Compare</button><button onclick="reports()">More</button></nav><div class="drawer" id="drawer"><section class="panel"><button class="close" onclick="closeD()">×</button><div id="panel"></div></section></div><script>const E=(n,t)=>`<button class="entity" onclick="entity('${t}','${n}')">${n}</button>`;const M=(a,b,c)=>`<div class="card"><div class="muted">${a}</div><div class="metric">${b}</div><div class="muted">${c}</div></div>`;const C=(t,x)=>`<div class="card"><div class="ct">${t}</div>${x}</div>`;function set(x){app.innerHTML=x}function head(t,s){return `<div style="margin-bottom:18px"><div class="muted">SiteIntel / Intelligence</div><h2 style="font-size:29px;margin:3px 0">${t}</h2><div class="muted">${s}</div></div>`}function home(){set(`<div class="hero"><div class="muted">WEBSITE DATA INTELLIGENCE PLATFORM</div><h1>Understand any website.</h1><div class="muted">每一个实体、指标、发现、证据和关系都可以继续向下探索。</div><p><button class="btn primary" onclick="website()">Analyze example.com</button> <button class="btn" onclick="explore()">Explore global data</button></p></div><div class="grid g4">${M('Websites','12.8M','observed globally')}${M('Technologies','42.7K','fingerprints')}${M('Countries','195','coverage')}${M('Relationships','86.4M','connected')}</div><div class="grid g2">${C('Explore Entity','<div class="row">'+E('React','Technology')+'<span>1.28M</span></div><div class="row">'+E('Cloudflare','Provider')+'<span>4.82M</span></div><div class="row">'+E('104.18.32.10','IP')+'<span>327K sites</span></div><div class="row">'+E('AS13335','ASN')+'<span>2.1M</span></div>')} ${C('Recent Intelligence','<div class="row">'+E('React detected','Finding')+'<span class="badge ok">98%</span></div><div class="row">'+E('IP changed','Change')+'<span>2h ago</span></div><div class="row">'+E('CSP Warning','Finding')+'<span class="badge warn">Medium</span></div>')}</div>`)}function website(){set(head('example.com','Website Intelligence · global entity')+`<div class="hero"><div class="muted">WEBSITE</div><h1>example.com</h1><div class="muted">Example Company · ${E('United States','Country')} · HTTPS · 200 OK</div><div class="metric">84 / 100</div></div><div class="tabs"><button class="tab on">Overview</button><button class="tab" onclick="tab('Technologies')">Technologies</button><button class="tab" onclick="tab('Infrastructure')">Infrastructure</button><button class="tab" onclick="tab('DNS')">DNS</button><button class="tab" onclick="quality('Security')">Security</button><button class="tab" onclick="quality('SEO')">SEO</button><button class="tab" onclick="quality('Performance')">Performance</button><button class="tab" onclick="historyPage()">Changes</button><button class="tab" onclick="evidence()">Evidence</button><button class="tab" onclick="relations()">Relations</button></div><div class="grid g4">${M('Technology','92','24 detected')}${M('Infrastructure','88','2 IP · 1 ASN')}${M('Security','91','0 critical')}${M('Performance','76','LCP 2.1s')}</div><div class="grid g2">${C('Technology Stack','<div class="row">'+E('React','Technology')+'<span>98%</span></div><div class="row">'+E('Next.js','Technology')+'<span>96%</span></div><div class="row">'+E('Nginx','Technology')+'<span>91%</span></div>')} ${C('Infrastructure','<div class="row">IP '+E('104.18.32.10','IP')+'</div><div class="row">ASN '+E('AS13335','ASN')+'</div><div class="row">Provider '+E('Cloudflare','Provider')+'</div><div class="row">Datacenter '+E('SIN1','Datacenter')+'</div>')}</div><div class="grid g3">${C('Security','<div class="metric">91</div><button class="entity" onclick="quality(\'Security\')">3 findings →</button>')} ${C('SEO','<div class="metric">82</div><button class="entity" onclick="quality(\'SEO\')">5 findings →</button>')} ${C('Performance','<div class="metric">76</div><button class="entity" onclick="quality(\'Performance\')">4 findings →</button>')}</div>`)}function tab(t){entity(t,'Website Tab')}function technology(){set(head('React','Technology Intelligence')+`<div class="grid g4">${M('Websites','1.28M','+12.4% 30D')}${M('Countries','180','global')}${M('First Seen','2013','history')}${M('Confidence','98%','3 signal sources')}</div><div class="grid g2">${C('Related Technologies','<div class="row">'+E('Next.js','Technology')+'<span>840K</span></div><div class="row">'+E('TypeScript','Technology')+'<span>1.1M</span></div><div class="row">'+E('Redux','Technology')+'<span>420K</span></div>')} ${C('Detection Evidence','<div class="row">HTML Script<span>98%</span></div><div class="row">Header Signal<span>96%</span></div><div class="row">Asset Fingerprint<span>94%</span></div>')}</div>`)}function explore(){set(head('Explore','Global entity discovery')+`<div class="card"><div class="row"><b>12,842,392 results</b><button class="btn" onclick="alert('Filters: Country · Technology · Provider · Security · SEO · Performance · Last Seen')">Filters ▾</button></div>${['example.com','shop.example','news.example','app.example','docs.example'].map((n,i)=>`<div class="row"><div>${E(n,'Website')}<div class="muted">${i%2?'Singapore':'United States'} · ${E(i%2?'AWS':'Cloudflare','Provider')} · ${E(i%2?'Next.js':'React','Technology')}</div></div><span>Security ${88+i} · SEO ${78+i}</span></div>`).join('')}</div>`)}function entity(t,n){open(`<div class="muted">${t.toUpperCase()} DETAIL</div><h1>${n}</h1><div class="muted">Current intelligence snapshot · updated 2 minutes ago</div><div class="grid g2">${M('Associated Websites','327K','current')}${M('Countries','180','coverage')}${M('Confidence','98%','verified')}${M('Last Seen','2 min','ago')}</div><h3>Relationships</h3><div class="row">Website → ${E('example.com','Website')}</div><div class="row">Technology → ${E('React','Technology')}</div><div class="row">Provider → ${E('Cloudflare','Provider')}</div><div class="row">ASN → ${E('AS13335','ASN')}</div><div class="row">Country → ${E('Singapore','Country')}</div><div class="row">Datacenter → ${E('SIN1','Datacenter')}</div><h3>Evidence</h3><div class="row">HTTP Header <span>99%</span></div><div class="row">DNS Observation <span>98%</span></div><div class="row">Certificate <span>99%</span></div><button class="btn primary" onclick="evidence()">Open Evidence Chain</button><button class="btn" onclick="relations()">Explore Relations</button>`)}function quality(t){open(`<div class="muted">${t.toUpperCase()} / FINDINGS</div><h1>${t}</h1><div class="metric">91 / 100</div><div class="row"><button class="entity" onclick="finding('Missing CSP')">Missing Content-Security-Policy</button><span class="badge warn">Medium</span></div><div class="row"><button class="entity" onclick="finding('Schema incomplete')">Structured data incomplete</button><span class="badge">Low</span></div><div class="row"><button class="entity" onclick="finding('LCP above target')">LCP above target</button><span class="badge">Low</span></div><h3>Recommendation</h3><div class="card">Review the affected resource, verify evidence, then apply the recommended remediation.</div>`)}function finding(n){open(`<div class="muted">FINDING DETAIL</div><h1>${n}</h1><div class="row">Severity <b>Medium</b></div><div class="row">Status <b>Open</b></div><div class="row">First Seen <b>2026-08-12</b></div><div class="row">Last Seen <b>2026-08-19 13:20 UTC</b></div><div class="row">Confidence <b>98%</b></div><h3>Evidence Chain</h3><div class="timeline"><div class="event"><b>Observation</b><div class="muted">HTTP Header / HTML</div></div><div class="event"><b>Verification</b><div class="muted">2 independent signals</div></div><div class="event"><b>Conclusion</b><div class="muted">Finding remains active</div></div></div><button class="btn primary" onclick="evidence()">Open Raw Evidence</button>`)}function evidence(){open(`<div class="muted">EVIDENCE CHAIN</div><h1>Evidence</h1><div class="row">Source Type <b>HTTP Header</b></div><div class="row">Endpoint <b>https://example.com</b></div><div class="row">Observation <b>Cloudflare detected</b></div><div class="row">Timestamp <b>2026-08-19 13:20 UTC</b></div><div class="row">Confidence <b>99%</b></div><h3>Trace</h3><div class="timeline"><div class="event">Collected</div><div class="event">Parsed</div><div class="event">Correlated</div><div class="event">Evidence accepted</div></div>`)}function historyPage(){open(`<div class="muted">HISTORY / CHANGES</div><h1>example.com Changes</h1>${['React detected','IP changed','Provider changed','TLS certificate renewed'].map((x,i)=>`<div class="event"><b>${x}</b><div class="muted">Aug ${19-i}, 2026 · Evidence verified · Confidence 97%</div></div>`).join('')}`)}function relations(){set(head('Relationship Explorer','点击任何节点继续深入')+`<div class="card"><div class="graph"><div class="edge" style="left:50%;top:50%;width:230px;transform:rotate(-150deg)"></div><div class="edge" style="left:50%;top:50%;width:230px;transform:rotate(-30deg)"></div><div class="edge" style="left:50%;top:50%;width:230px;transform:rotate(150deg)"></div><div class="edge" style="left:50%;top:50%;width:230px;transform:rotate(30deg)"></div><div class="node" style="left:50%;top:50%" onclick="website()">example.com</div><div class="node" style="left:20%;top:24%" onclick="entity('Technology','React')">React</div><div class="node" style="left:80%;top:24%" onclick="entity('Provider','Cloudflare')">Cloudflare</div><div class="node" style="left:20%;top:76%" onclick="entity('IP','104.18.32.10')">104.18.32.10</div><div class="node" style="left:80%;top:76%" onclick="entity('ASN','AS13335')">AS13335</div></div></div><div class="grid g3">${M('Depth','1','current')}${M('Nodes','5','visible')}${M('Confidence','98%','path')}</div>`)}function compare(){set(head('Compare','Side-by-side intelligence')+`<div class="card"><div class="row"><b>Metric</b><b>example.com</b><b>shop.example</b></div><div class="row">Security <span>91</span><span>78</span></div><div class="row">SEO <span>82</span><span>89</span></div><div class="row">Performance <span>76</span><span>81</span></div><div class="row">Provider ${E('Cloudflare','Provider')} ${E('AWS','Provider')}</div></div>`)}function reports(){set(head('Reports','Saved intelligence reports')+`<div class="grid g2">${C('example.com Intelligence','<div class="row">Score <b>84</b></div><button class="entity" onclick="website()">Open →</button>')} ${C('Singapore Web Intelligence','<div class="row">Websites <b>420K</b></div><button class="entity" onclick="entity(\'Country\',\'Singapore\')">Open →</button>')}</div>`)}function open(x){panel.innerHTML=x;drawer.classList.add('open')}function closeD(){drawer.classList.remove('open')}function openSearch(){let q=prompt('Search entity');if(q)entity('Search Result',q)}home();</script></body></html>
